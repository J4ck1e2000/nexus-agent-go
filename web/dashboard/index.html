                    </div>

                    <div className="text-[11px] text-[#6f685f] mt-2">
                        {t('gpu.modal.fanSpeed')}: {fanSpeed !== null ? `${fanSpeed.toFixed(0)}%` : t('node.na')}
                    </div>
                </div>
            );
        };

        const createMessageId = () => `${Date.now()}-${Math.random().toString(16).slice(2)}`;

        const sanitizeAIText = (value, depth = 0) => {
            if (depth > 4 || typeof value !== 'string') return '';
            let text = value.trim();
            if (!text) return '';

            if (text.startsWith('```')) {
                const lines = text.split('\n');
                if (lines.length >= 2) {
                    lines.shift();
                    if (lines.length > 0 && lines[lines.length - 1].trim().startsWith('```')) {
                        lines.pop();
                    }
                    text = lines.join('\n').trim();
                }
            }

            text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            if (!text) return '';

            try {
                const parsed = JSON.parse(text);
                if (typeof parsed === 'string') {
                    return sanitizeAIText(parsed, depth + 1);
                }
                if (parsed && typeof parsed === 'object') {
                    const preferred = [
                        parsed.answer,
                        parsed.content,
                        parsed.text,
                        parsed.message,
                    ].find((item) => typeof item === 'string' && item.trim());
                    if (preferred) {
                        return sanitizeAIText(preferred, depth + 1);
                    }
                    const firstString = Object.values(parsed).find((item) => typeof item === 'string' && item.trim());
                    if (typeof firstString === 'string') {
                        return sanitizeAIText(firstString, depth + 1);
                    }
                }
            } catch (e) {}

            return text;
        };

        const normalizeAIServerHint = (language, rawText) => {
            const normalizedLanguage = language === 'zh' ? 'zh' : 'en';
            const text = String(rawText || '').trim();
            if (!text) return '';
            const lower = text.toLowerCase();

            if (normalizedLanguage === 'zh') {
                if (lower.includes('current sampled snapshot')) {
                    return '以上结论基于当前采样快照。';
                }
                if (lower.includes('data age is missing')) {
                    return '数据时间戳缺失，结论仅供参考。';
                }
                const staleMatch = text.match(/data is stale \(([\d.]+)s\)/i);
                if (staleMatch && staleMatch[1]) {
                    return `数据已过旧（${staleMatch[1]}s），建议结合下一轮采样复核。`;
                }
            } else {
                if (text.includes('当前采样快照')) {
                    return 'The conclusion is based on the current sampled snapshot.';
                }
                if (text.includes('数据时间戳缺失')) {
                    return 'Data age is missing; conclusions are for reference only.';
                }
                const staleMatch = text.match(/数据已过旧（([\d.]+)s）/);
                if (staleMatch && staleMatch[1]) {
                    return `Data is stale (${staleMatch[1]}s); re-check with the next polling cycle.`;
                }
            }

            return text;
        };

        const normalizeAIResponse = (payload, language = DEFAULT_LANGUAGE) => {
            let source = payload;
            if (typeof source === 'string') {
                try {
                    source = JSON.parse(source);
                } catch (e) {}
            }
            const obj = source && typeof source === 'object' ? source : {};

            const rawAnswer = typeof obj.answer === 'string'
                ? obj.answer
                : (typeof obj.content === 'string' ? obj.content : (typeof payload === 'string' ? payload : ''));
            const answer = sanitizeAIText(rawAnswer);

            const reasoningSummaryRaw = typeof obj.reasoning_summary === 'string'
                ? obj.reasoning_summary
                : (typeof obj.reasoningSummary === 'string' ? obj.reasoningSummary : '');
            const reasoningSummary = normalizeAIServerHint(language, sanitizeAIText(reasoningSummaryRaw));

            const mode = typeof obj.mode === 'string' ? obj.mode.trim() : '';
            const toolCalls = Array.isArray(obj.tool_calls)
                ? obj.tool_calls
                : (Array.isArray(obj.toolCalls) ? obj.toolCalls : []);
            const relatedNodes = Array.isArray(obj.related_nodes)
                ? obj.related_nodes
                : (Array.isArray(obj.relatedNodes) ? obj.relatedNodes : []);
            const warnings = Array.isArray(obj.warnings)
                ? obj.warnings
                    .filter((item) => typeof item === 'string' && item.trim())
                    .map((item) => normalizeAIServerHint(language, item))
                    .filter(Boolean)
                : [];

            return { answer, reasoningSummary, mode, toolCalls, relatedNodes, warnings };
        };

        // 提取 meta/done 载荷中的会话 ID（snake_case 或 camelCase 别名）。
        const extractAIConversationId = (payload) => {
            const obj = payload && typeof payload === 'object' ? payload : {};
            const raw = obj.conversation_id !== undefined ? obj.conversation_id : obj.conversationId;
            return typeof raw === 'number' && Number.isInteger(raw) && raw > 0 ? raw : null;
        };

        // 把服务端存储的消息还原为面板气泡结构（meta 为 SSE meta 载荷原样 JSON）。
        const mapStoredAIMessages = (rows) => {
            if (!Array.isArray(rows)) return [];
            return rows.map((row, index) => {
                const meta = row && typeof row.meta === 'object' && row.meta !== null ? row.meta : {};
                const warnings = Array.isArray(meta.warnings)
                    ? meta.warnings.filter((item) => typeof item === 'string' && item.trim())
                    : [];
                return {
                    id: `conv-${row.id}-${index}`,
                    role: row.role === 'assistant' ? 'assistant' : 'user',
                    content: typeof row.content === 'string' ? row.content : '',
                    status: 'done',
                    reasoningSummary: typeof meta.reasoning_summary === 'string' ? meta.reasoning_summary : '',
                    mode: typeof meta.mode === 'string' ? meta.mode : '',
                    relatedNodes: Array.isArray(meta.related_nodes) ? meta.related_nodes : [],
                    toolCalls: Array.isArray(meta.tool_calls) ? meta.tool_calls : [],
                    warnings,
                    createdAt: Date.parse(row.created_at || '') || Date.now(),
                };
            });
        };

        const chunkTextForUI = (text, chunkSize = 42) => {
            const source = sanitizeAIText(text);
            if (!source) return [];
            if (source.length <= chunkSize) return [source];

            const chunks = [];
            let index = 0;
            while (index < source.length) {
                let end = Math.min(index + chunkSize, source.length);
                if (end < source.length) {
                    const breakPoint = source.lastIndexOf(' ', end);
                    if (breakPoint > index + 8) {
                        end = breakPoint;
                    }
                }
                chunks.push(source.slice(index, end));
                index = end;
                while (source[index] === ' ') index += 1;
            }
            return chunks.filter(Boolean);
        };

        const parseSSEFrame = (frame) => {
            if (!frame) return null;
            const lines = frame.split(/\r?\n/);
            let event = '';
            const dataLines = [];
            lines.forEach((line) => {
                if (line.startsWith('event:')) {
                    event = line.slice(6).trim();
                    return;
                }
                if (line.startsWith('data:')) {
                    dataLines.push(line.slice(5).trimStart());
                }
            });
            if (dataLines.length === 0) return null;
            const rawData = dataLines.join('\n');
            let data = null;
            try {
                data = JSON.parse(rawData);
            } catch (e) {
                data = { message: rawData };
            }
            return { event: event || 'message', data };
        };

        const localizeAIStatusText = (language, phase, rawMessage) => {
            const normalizedLanguage = language === 'zh' ? 'zh' : 'en';
            const normalizedPhase = String(phase || '').trim().toLowerCase();
            const phaseMap = normalizedLanguage === 'zh'
                ? {
                    thinking: '正在分析节点状态...',
                    tooling: '正在汇总 GPU / CPU / 进程信息...',
                    generating: '正在生成调度建议...',
                }
                : {
                    thinking: 'Analyzing node status...',
                    tooling: 'Aggregating GPU / CPU / process stats...',
                    generating: 'Generating scheduling guidance...',
                };

            if (phaseMap[normalizedPhase]) {
                return phaseMap[normalizedPhase];
            }

            const fallback = typeof rawMessage === 'string' ? rawMessage.trim() : '';
            if (fallback) return normalizeAIServerHint(normalizedLanguage, fallback);

            return normalizedLanguage === 'zh' ? '正在处理请求...' : 'Processing request...';
        };

        const updateMessageById = (messages, messageId, updater) => messages.map((item) => {
            if (item.id !== messageId) return item;
            return updater(item);
        });

        const FloatingAIChatButton = ({ isOpen, onToggle, isStreaming, language }) => {
            const title = language === 'zh'
                ? (isOpen ? '收起 AI 助手' : '打开 AI 助手')
                : (isOpen ? 'Hide AI assistant' : 'Open AI assistant');
            const nudge = language === 'zh'
                ? '问问 AI？我该怎么分配任务？'
                : 'Ask AI: how should I allocate workloads?';
            const nudgeTag = language === 'zh' ? 'AI 助手' : 'AI helper';

            return (
                <div className="floating-ai-launcher">
                    {!isOpen ? (
                        <div className="floating-ai-nudge">
                            <span className="floating-ai-nudge-pill">{nudgeTag}</span>
                            <span>{nudge}</span>
                        </div>
                    ) : null}
                    <button
                        type="button"
                        className={cx('floating-ai-button', isStreaming ? 'ai-pulse' : '')}
                        onClick={onToggle}
                        title={title}
                        aria-label={title}
                    >
                        <Icons.Sparkles className="w-6 h-6" />
                    </button>
                </div>
            );
        };

        const FloatingAIChatWidget = ({
            language,
            isOpen,
            onClose,
            messages,
            draft,
            onDraftChange,
            onSubmit,
            onStop,
            isStreaming,
            isThinking,
            streamError,
            selectedServerName,
            messageListRef,
            onMessageListScroll,
            sessionId,
            thinkingLabel,
            conversations,
            activeConversationId,
            historyOpen,
            historyError,
            deletingConversationId,
            onToggleHistory,
            onSelectConversation,
            onDeleteConversation,
            onNewChat,
        }) => {
            const copy = language === 'zh'
                ? {
                    title: 'Nexus AI',
                    subtitleIdle: '已连接网关数据',
                    subtitleStreaming: '正在生成回复',
                    placeholder: '例如：哪台机器最适合 16GB 显存训练任务？',
                    send: '发送',
                    stop: '停止',
                    thinking: '思考中',
                    failed: '请求失败',
                    details: '依据详情',
                    reasoningLabel: '推理摘要',
                    modeLabel: '模式',
                    nodesLabel: '相关节点',
                    toolsLabel: '工具调用',
                    warningsLabel: '提示',
                    quickPromptsLabel: '快捷提问',
                    emptyTitle: '我可以帮你分析节点负载与调度建议。',
                    close: '关闭',
                    session: '会话',
                    history: '历史对话',
                    newChat: '新对话',
                    historyEmpty: '暂无历史对话，发送第一条提问即可开始。',
                    untitled: '新对话',
                    deleteConversation: '删除对话',
                }
                : {
                    title: 'Nexus AI',
                    subtitleIdle: 'Connected to gateway data',
                    subtitleStreaming: 'Generating response',
                    placeholder: 'Example: Which node fits a 16GB VRAM training task?',
                    send: 'Send',
                    stop: 'Stop',
                    thinking: 'Thinking',
                    failed: 'Request failed',
                    details: 'Response Details',
                    reasoningLabel: 'Reasoning',
                    modeLabel: 'Mode',
                    nodesLabel: 'Nodes',
                    toolsLabel: 'Tools',
                    warningsLabel: 'Warnings',
                    quickPromptsLabel: 'Quick Prompts',
                    emptyTitle: 'Ask me about node health, load, and scheduling suggestions.',
                    close: 'Close',
                    session: 'Session',
                    history: 'History',
                    newChat: 'New chat',
                    historyEmpty: 'No conversations yet. Send a message to start one.',
                    untitled: 'New conversation',
                    deleteConversation: 'Delete conversation',

            const formatConversationTime = (value) => {

                if (Number.isNaN(timestamp)) return '';

            const quickPrompts = language === 'zh'

            return (
                <section className={cx('floating-ai-widget flex flex-col', isOpen ? 'floating-ai-widget-open' : 'floating-ai-widget-closed')}>
                    <header className="px-4 py-3 border-b border-[rgba(60,47,35,0.11)] bg-[#f4efe7]">
                        <div className="flex items-start justify-between gap-3">
                            <div className="min-w-0">
                                <div className="flex items-center gap-2">
                                    <Icons.MessageCircle className="w-4 h-4 text-[#42514d]" />
                                    <div className="font-semibold text-sm text-[#24221f]">{copy.title}</div>
                                </div>
                                <div className="text-[11px] text-[#6d675f] mt-1">
                                    {(isStreaming || isThinking) ? copy.subtitleStreaming : copy.subtitleIdle}
                                </div>
                            </div>
                            <div className="flex items-center gap-1.5">
                                <button
                                    type="button"
                                    className={cx('muted-button px-2 py-1.5', historyOpen ? 'bg-[rgba(60,47,35,0.08)]' : '')}
                                    onClick={onToggleHistory}
                                    title={copy.history}
                                    aria-label={copy.history}
                                >
                                    <Icons.Clock className="w-3.5 h-3.5" />
                                </button>
                                <button
                                    type="button"
                                    className="muted-button px-2 py-1.5"
                                    onClick={onNewChat}
                                    title={copy.newChat}
                                    aria-label={copy.newChat}
                                >
                                    <Icons.Plus className="w-3.5 h-3.5" />
                                </button>
                                <button
                                    type="button"
                                    className="muted-button px-2.5 py-1 text-xs"
                                    onClick={onClose}
                                    title={copy.close}
                                    aria-label={copy.close}
                                >
                                    <Icons.X className="w-3.5 h-3.5" />
                                </button>
                            </div>
                        </div>
                    </header>

                    <div
                        ref={messageListRef}
                        onScroll={onMessageListScroll}
                        className="flex-1 min-h-0 overflow-y-auto custom-scrollbar px-3.5 py-3 space-y-3"
                    >
                        {historyOpen ? (
                            <div className="space-y-2">
                                {historyError ? (
                                    <div className="text-[11px] text-[#8b4b42] soft-panel-subtle px-2.5 py-1.5 border border-[#e0b9b2]">{historyError}</div>
                                ) : null}
                                {!Array.isArray(conversations) || conversations.length === 0 ? (
                                    <p className="py-6 text-center text-xs text-[#7f776e]">{copy.historyEmpty}</p>
                                ) : (
                                    conversations.map((conversation) => {
                                        const conversationTime = formatConversationTime(conversation.updated_at || conversation.created_at);
                                        const isActive = conversation.id === activeConversationId;
                                        return (
                                            <div
                                                key={conversation.id}
                                                className={cx('group flex items-center gap-2 rounded-xl px-3 py-2 transition-colors', isActive ? 'soft-panel-subtle' : 'hover:bg-[rgba(60,47,35,0.05)]')}
                                            >
                                                <button
                                                    type="button"
                                                    className="min-w-0 flex-1 text-left"
                                                    onClick={() => onSelectConversation(conversation)}
                                                >
                                                    <div className="truncate text-xs font-medium text-[#24221f]">
                                                        {String(conversation.title || '').trim() || copy.untitled}
                                                    </div>
                                                    {conversationTime ? (
                                                        <div className="text-[10px] text-[#7f776e] mt-0.5">{conversationTime}</div>
                                                    ) : null}
                                                </button>
                                                <button
                                                    type="button"
                                                    className="shrink-0 muted-button px-1.5 py-1 opacity-0 group-hover:opacity-100 focus-visible:opacity-100"
                                                    onClick={() => onDeleteConversation(conversation)}
                                                    disabled={deletingConversationId === conversation.id}

                                            </div>
                                        );

                                )}
                            </div>
                        ) : messages.length === 0 ? (
                            <div className="space-y-3">
                                <div className="soft-panel-subtle p-3 text-sm text-[#3f3a34]">{copy.emptyTitle}</div>
                                <div>
                                    <div className="text-[10px] uppercase tracking-[0.12em] text-[#7f776e] mb-2">{copy.quickPromptsLabel}</div>
                                    <div className="space-y-2">
                                        {quickPrompts.map((item) => (
                                            <button
                                                key={item}
                                                type="button"
                                                className="w-full text-left muted-button px-3 py-2 text-xs"
                                                onClick={() => onSubmit(item)}
                                            >
                                                {item}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            messages.map((message) => {
                                const isUser = message.role === 'user';
                                const displayText = sanitizeAIText(message.content);
                                const showThinking = message.role === 'assistant' && message.status === 'thinking' && !displayText;
                                return (
                                    <div key={message.id} className={cx('flex', isUser ? 'justify-end' : 'justify-start')}>
                                        <article className={cx('max-w-[88%] px-3.5 py-2.5 text-sm whitespace-pre-wrap break-words', isUser ? 'ai-bubble-user' : 'ai-bubble-assistant')}>
                                            {showThinking ? (
                                                <div className="text-[13px] text-[#3e4f4b] ai-pulse">
                                                    {thinkingLabel || copy.thinking}
                                                    <span className="ai-thinking-dots"><span /><span /><span /></span>
                                                </div>
                                            ) : (
                                                <div>{displayText || (message.status === 'error' ? copy.failed : '')}</div>
                                            )}

                                            {!isUser && message.status === 'error' && streamError ? (
                                                <div className="text-[11px] text-[#8a4b42] mt-2">{streamError}</div>
                                            ) : null}

                                            {!isUser && (
                                                message.reasoningSummary ||
                                                (Array.isArray(message.relatedNodes) && message.relatedNodes.length > 0) ||
                                                (Array.isArray(message.warnings) && message.warnings.length > 0) ||
                                                (Array.isArray(message.toolCalls) && message.toolCalls.length > 0)
                                            ) ? (
                                                <details className="mt-2 text-[11px] text-[#5a5249]">
                                                    <summary className="cursor-pointer select-none">{copy.details}</summary>
                                                    <div className="mt-2 space-y-1.5">
                                                        {message.reasoningSummary ? <div><span className="text-[#7a7269]">{copy.reasoningLabel}:</span> {message.reasoningSummary}</div> : null}
                                                        {message.mode ? <div><span className="text-[#7a7269]">{copy.modeLabel}:</span> <span className="font-mono">{message.mode}</span></div> : null}
                                                        {Array.isArray(message.relatedNodes) && message.relatedNodes.length > 0 ? (
                                                            <div><span className="text-[#7a7269]">{copy.nodesLabel}:</span> {message.relatedNodes.join(', ')}</div>
                                                        ) : null}
                                                        {Array.isArray(message.toolCalls) && message.toolCalls.length > 0 ? (
                                                            <div><span className="text-[#7a7269]">{copy.toolsLabel}:</span> {message.toolCalls.map((item) => item.name || '-').join(', ')}</div>
                                                        ) : null}
                                                        {Array.isArray(message.warnings) && message.warnings.length > 0 ? (
                                                            <div className="text-[#8a4b42]"><span className="text-[#7a7269]">{copy.warningsLabel}:</span> {message.warnings.join(' | ')}</div>
                                                        ) : null}
                                                    </div>
                                                </details>
                                            ) : null}
                                        </article>
                                    </div>
                                );
                            })
                        )}
                    </div>

                    <footer className="border-t border-[rgba(60,47,35,0.11)] bg-[#f7f4ee] px-3 py-3">
                        {streamError && !historyOpen ? (
                            <div className="mb-2 text-[11px] text-[#8b4b42] soft-panel-subtle px-2.5 py-1.5 border border-[#e0b9b2]">
                                {streamError}
                            </div>
                        ) : null}
                        <textarea
                            className="w-full min-h-[76px] max-h-[148px] bg-[#fbf8f3] border border-[rgba(60,47,35,0.12)] rounded-2xl px-3 py-2 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.26)] transition-colors resize-y"
                            value={draft}
                            placeholder={copy.placeholder}
                            onChange={(event) => onDraftChange(event.target.value)}
                            onKeyDown={(event) => {
                                if (event.key === 'Enter' && !event.shiftKey) {
                                    event.preventDefault();
                                    onSubmit();
                                }
                            }}
                        />
                        <div className="mt-2 flex items-center justify-between gap-2">
                            <div className="text-[10px] uppercase tracking-[0.1em] text-[#807a72]">{copy.session}: <span className="font-mono lowercase">{sessionId}</span></div>
                            <button
                                type="button"
                                className={cx('primary-button px-4 py-2 text-sm font-medium inline-flex items-center gap-1.5', isStreaming ? '' : (!draft.trim() ? 'opacity-60 cursor-not-allowed' : ''))}
                                onClick={isStreaming ? onStop : () => onSubmit()}
                                disabled={!isStreaming && !draft.trim()}
                            >
                                {isStreaming ? <Icons.Square className="w-3 h-3" /> : <Icons.Send className="w-3.5 h-3.5" />}
                                <span>{isStreaming ? copy.stop : copy.send}</span>
                            </button>
                        </div>
                    </footer>
                </section>
            );
        };

        const App = () => {
            const [servers, setServers] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isActivityOpen, setIsActivityOpen] = useState(false);
            const [modalData, setModalData] = useState({ name: "", url: "http://" });
            const [language, setLanguage] = useState(() => getInitialLanguage());
            const [currentUser, setCurrentUser] = useState(null);
            const [isAuthLoading, setIsAuthLoading] = useState(true);
            const [selectedServerId, setSelectedServerId] = useState(null);
            const [nodeQuery, setNodeQuery] = useState('');
            const [sortMode, setSortMode] = useState('availability');
            const latestServersRef = useRef([]);
            const [lastSyncedAt, setLastSyncedAt] = useState(null);
            const [selectedGpuRef, setSelectedGpuRef] = useState(null);
            const [dialogState, setDialogState] = useState(null);
            const dialogResolverRef = useRef(null);
            const [toasts, setToasts] = useState([]);
            const toastTimersRef = useRef(new Map());
            const [isSavingServer, setIsSavingServer] = useState(false);
            const [adminUsers, setAdminUsers] = useState([]);
            const [userQuery, setUserQuery] = useState('');
            const [isLoadingAdminUsers, setIsLoadingAdminUsers] = useState(false);
            const [userActionKey, setUserActionKey] = useState('');
            const [isUserManagerOpen, setIsUserManagerOpen] = useState(false);
            const [newUserForm, setNewUserForm] = useState({ username: '', password: '', role: 'user' });
            const [isCreatingUser, setIsCreatingUser] = useState(false);
            const [isAIWidgetOpen, setIsAIWidgetOpen] = useState(false);
            const [aiMessages, setAIMessages] = useState([]);
            const [aiDraft, setAIDraft] = useState('');
            const [isAIStreaming, setIsAIStreaming] = useState(false);
            const [aiThinking, setAIThinking] = useState(false);
            const [aiStreamError, setAIStreamError] = useState('');
            const [aiSessionId] = useState(() => Math.random().toString(16).slice(2, 10));
            const [aiThinkingLabel, setAIThinkingLabel] = useState('');
            const [aiConversationId, setAIConversationId] = useState(null);
            const [aiConversations, setAIConversations] = useState([]);
            const [aiHistoryOpen, setAIHistoryOpen] = useState(false);
            const [aiListError, setAIListError] = useState('');
            const [aiDeletingId, setAIDeletingId] = useState(null);
            const abortControllerRef = useRef(null);
            const activeAssistantIdRef = useRef('');
            const messageListRef = useRef(null);
            const shouldAutoScrollRef = useRef(true);
            const t = useMemo(() => createTranslator(language), [language]);
            const isAdmin = currentUser && currentUser.role === 'admin';
            const resolvedSelectedGpu = useResolvedSelectedGpu(selectedGpuRef, servers);

            useEffect(() => {
                persistLanguage(language);
                document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
                document.title = t('app.title');
            }, [language, t]);

            const switchLanguage = (nextLanguage) => {
                const normalized = normalizeLanguage(nextLanguage);
                if (!normalized || normalized === language) return;
                persistLanguage(normalized);
                setLanguage(normalized);
            };

            useEffect(() => {
                if (!selectedGpuRef) return;
                if (selectedServerId === null || String(selectedGpuRef.serverId) !== String(selectedServerId)) {
                    setSelectedGpuRef(null);
                }
            }, [selectedGpuRef, selectedServerId]);

            useEffect(() => () => {
                const activeResolver = dialogResolverRef.current;
                dialogResolverRef.current = null;
                if (typeof activeResolver === 'function') activeResolver(null);
            }, []);

            useEffect(() => () => {
                toastTimersRef.current.forEach((timer) => clearTimeout(timer));
                toastTimersRef.current.clear();
            }, []);

            useEffect(() => () => {
                if (abortControllerRef.current) {
                    abortControllerRef.current.abort();
                    abortControllerRef.current = null;
                }
            }, []);

            useEffect(() => {
                if (!aiThinking) {
                    setAIThinkingLabel('');
                    return undefined;
                }

                const labels = language === 'zh'
                    ? ['正在分析节点状态...', '正在汇总 GPU / CPU / 进程信息...', '正在生成调度建议...']
                    : ['Analyzing node status...', 'Aggregating GPU / CPU / process stats...', 'Preparing scheduling guidance...'];
                let index = 0;
                setAIThinkingLabel(labels[index]);
                const timer = setInterval(() => {
                    index = (index + 1) % labels.length;
                    setAIThinkingLabel(labels[index]);
                }, 1350);

                return () => clearInterval(timer);
            }, [aiThinking, language]);

            useEffect(() => {
                if (!isAIWidgetOpen) return;
                if (!shouldAutoScrollRef.current) return;
                const list = messageListRef.current;
                if (!list) return;
                requestAnimationFrame(() => {
                    list.scrollTop = list.scrollHeight;
                });
            }, [aiMessages, isAIWidgetOpen]);

            const handleAIMessageListScroll = useCallback(() => {
                const list = messageListRef.current;
                if (!list) return;
                const distance = list.scrollHeight - list.scrollTop - list.clientHeight;
                shouldAutoScrollRef.current = distance < 64;
            }, []);

            const dismissToast = (id) => {
                const timer = toastTimersRef.current.get(id);
                if (timer) {
                    clearTimeout(timer);
                    toastTimersRef.current.delete(id);
                }
                setToasts((prev) => prev.filter((item) => item.id !== id));
            };

            const pushToast = (message, tone = 'info', duration = 3200) => {
                if (!message) return null;
                const id = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
                setToasts((prev) => [...prev, { id, message, tone }]);
                const timer = setTimeout(() => dismissToast(id), duration);
                toastTimersRef.current.set(id, timer);
                return id;
            };

            const clearSessionAndRedirect = useCallback(() => {
                clearAuthSession();
                window.location.href = '/';
            }, []);

            const handleLogout = useCallback(() => {
                setCurrentUser(null);
                clearSessionAndRedirect();
            }, [clearSessionAndRedirect]);

            const authFetch = useCallback(async (input, init = {}) => {
                const token = readAuthToken();
                if (!token) {
                    clearSessionAndRedirect();
                    throw new Error('unauthorized');
                }

                const headers = new Headers(init.headers || {});
                headers.set('Authorization', `Bearer ${token}`);

                const response = await fetch(input, { ...init, headers });
                if (response.status === 401) {
                    clearSessionAndRedirect();
                    throw new Error('unauthorized');
                }
                return response;
            }, [clearSessionAndRedirect]);

            const openDialog = (config) => new Promise((resolve) => {
                const previousResolver = dialogResolverRef.current;
                if (typeof previousResolver === 'function') previousResolver(null);
                dialogResolverRef.current = resolve;
                setDialogState(config);
            });

            const resolveDialog = (value) => {
                const resolver = dialogResolverRef.current;
                dialogResolverRef.current = null;
                setDialogState(null);
                if (typeof resolver === 'function') resolver(value);
            };

            const openConfirmDialog = (options = {}) => openDialog({
                type: 'confirm',
                confirmText: t('action.confirm'),
                cancelText: t('action.cancel'),
                closeOnEsc: true,
                closeOnBackdrop: true,
                ...options,
            });

            const openPromptDialog = (options = {}) => openDialog({
                type: 'prompt',
                confirmText: t('action.submit'),
                cancelText: t('action.cancel'),
                closeOnEsc: true,
                closeOnBackdrop: true,
                ...options,
            });

            const readResponseError = async (response, fallback = 'request_failed') => {
                try {
                    const payload = await response.json();
                    if (payload && typeof payload.error === 'string' && payload.error.trim()) {
                        return payload.error.trim();
                    }
                } catch (parseError) {}
                return fallback;
            };

            const normalizeServerConfig = (server) => ({
                id: server.id,
                name: server.name,
                url: server.url,
                status: 'pending',
                data: null,
                metrics: null,
                lastSeenAt: null,
            });

            const normalizeOverviewServer = (server) => ({
                id: server?.id,
                name: server?.name,
                url: server?.url,
                status: typeof server?.status === 'string' ? server.status : 'pending',
                data: server?.data || null,
                metrics: server?.metrics || null,
                lastSeenAt: safeNumber(server?.lastSeenAt),
                lastPolledAtUnix: safeNumber(server?.lastPolledAtUnix),
                collectedAtUnix: safeNumber(server?.collectedAtUnix),
                activeUsers: Array.isArray(server?.activeUsers) ? server.activeUsers : null,
                activeUserCount: safeNumber(server?.activeUserCount),
                gpuSummary: server?.gpuSummary || null,
                availabilityScore: safeNumber(server?.availabilityScore),
                availabilityTier: typeof server?.availabilityTier === 'string' ? server.availabilityTier : null,
                dataAgeSec: safeNumber(server?.dataAgeSec),
                error: typeof server?.error === 'string' ? server.error : null,
            });

            useEffect(() => {
                const token = readAuthToken();
                if (!token) {
                    clearSessionAndRedirect();
                    return undefined;
                }

                let disposed = false;
                const bootstrapUser = async () => {
                    try {
                        const res = await authFetch('/api/me');
                        if (!res.ok) {
                            throw new Error('load_me_failed');
                        }
                        const profile = await res.json();
                        if (disposed) return;
                        setCurrentUser(profile);
                    } catch (error) {
                        if (!disposed) clearSessionAndRedirect();
                    } finally {
                        if (!disposed) setIsAuthLoading(false);
                    }
                };
                bootstrapUser();

                return () => {
                    disposed = true;
                };
            }, [authFetch, clearSessionAndRedirect]);

            useEffect(() => {
                if (!currentUser) return;

                let disposed = false;
                const loadConfig = async () => {
                    if (currentUser.role !== 'admin') {
                        setServers([]);
                        return;
                    }
                    try {
                        const res = await authFetch('/api/config');
                        if (!res.ok) {
                            throw new Error('load_config_failed');
                        }
                        const data = await res.json();
                        if (disposed) return;
                        setServers(data.map(normalizeServerConfig));
                    } catch (error) {
                        if (!disposed) {
                            setServers([]);
                            pushToast(t('notify.saveConfigFailed'), 'error');
                        }
                    }
                };
                loadConfig();

                return () => {
                    disposed = true;
                };
            }, [authFetch, currentUser, t]);

            const loadAdminUsers = useCallback(async () => {
                if (!isAdmin) return;

                setIsLoadingAdminUsers(true);
                try {
                    const res = await authFetch('/api/admin/users');
                    if (!res.ok) {
                        const errorCode = await readResponseError(res, 'load_users_failed');
                        pushToast(t('notify.adminUserActionFailed', { error: errorCode }), 'error');
                        return;
                    }

                    const data = await res.json();
                    setAdminUsers(Array.isArray(data) ? data : []);
                } catch (error) {
                    pushToast(t('notify.loadUsersFailed'), 'error');
                } finally {
                    setIsLoadingAdminUsers(false);
                }
            }, [authFetch, isAdmin, t]);

            useEffect(() => {
                if (currentUser && isAdmin) return;
                setAdminUsers([]);
                setUserQuery('');
                setUserActionKey('');
                setIsUserManagerOpen(false);
                setIsCreatingUser(false);
                setNewUserForm({ username: '', password: '', role: 'user' });
            }, [currentUser, isAdmin]);

            useEffect(() => {
                if (!isUserManagerOpen || !isAdmin) return;
                if (adminUsers.length > 0) return;
                loadAdminUsers();
            }, [isUserManagerOpen, isAdmin, adminUsers.length, loadAdminUsers]);

            useEffect(() => {
                latestServersRef.current = servers;
            }, [servers]);

            const showSaveConfigError = (errorCode = '') => {
                if (errorCode === 'duplicate_node_url') {
                    pushToast(t('notify.duplicateNodeUrl'), 'error');
                    return;
                }
                pushToast(t('notify.saveConfigFailed'), 'error');
            };

            useEffect(() => {
                if (!currentUser) return;

                let disposed = false;

                const fetchAll = async () => {
                    try {
                        const res = await authFetch('/api/nodes/overview');
                        if (!res.ok) throw new Error('load_overview_failed');
                        const data = await res.json();
                        if (disposed) return;
                        const list = Array.isArray(data) ? data.map(normalizeOverviewServer) : [];
                        setServers(list);
                    } catch (error) {
                        if (disposed) return;
                    }
                    setLastSyncedAt(new Date());
                };

                fetchAll();
                const interval = setInterval(fetchAll, 2000);

                return () => {
                    disposed = true;
                    clearInterval(interval);
                };
            }, [authFetch, currentUser]);

            const addServer = async () => {
                if (!isAdmin || isSavingServer) return;
                setIsSavingServer(true);
                try {
                    const name = modalData.name.trim();
                    const url = modalData.url.trim();
                    if (!name || !url) {
                        showSaveConfigError();
                        return;
                    }
                    const normalizedURL = normalizeAgentURL(url);
                    if (!normalizedURL) {
                        showSaveConfigError();
                        return;
                    }

                    const hasDuplicateURL = latestServersRef.current.some((item) => {
                        const existingURL = normalizeAgentURL(item?.url);
                        return existingURL && existingURL === normalizedURL;
                    });
                    if (hasDuplicateURL) {
                        showSaveConfigError('duplicate_node_url');
                        return;
                    }

                    const res = await authFetch('/api/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, url: normalizedURL }),
                    });
                    if (!res.ok) {
                        const errorCode = await readResponseError(res, 'save_config_failed');
                        showSaveConfigError(errorCode);
                        return;
                    }

                    const createdNode = await res.json();
                    setServers((prev) => [...prev, normalizeServerConfig(createdNode)]);
                    setIsModalOpen(false);
                    setModalData({ name: "", url: "http://" });
                } catch (error) {
                    showSaveConfigError();
                } finally {
                    setIsSavingServer(false);
                }
            };

            const deleteServer = async (server) => {
                if (!isAdmin || !server) return;

                const confirmed = await openConfirmDialog({
                    title: t('dialog.deleteNodeTitle'),
                    description: t('dialog.deleteNodeDescription', { name: server.name || '-' }),
                    confirmText: t('action.deleteNode'),
                    confirmTone: 'danger',
                });
                if (!confirmed) return;

                let deleteRes;
                try {
                    deleteRes = await authFetch(`/api/config/${server.id}`, {
                        method: 'DELETE',
                    });
                } catch (error) {
                    showSaveConfigError();
                    return;
                }
                if (!deleteRes.ok) {
                    showSaveConfigError();
                    return;
                }

                const currentServers = latestServersRef.current;
                const newList = currentServers.filter((item) => item.id !== server.id);
                setServers(newList);
                if (selectedGpuRef && String(selectedGpuRef.serverId) === String(server.id)) {
                    setSelectedGpuRef(null);
                }
                pushToast(t('notify.nodeDeleted', { name: server.name || '-' }), 'success');
            };

            const openUserManager = () => {
                if (!isAdmin) return;
                setIsUserManagerOpen(true);
            };

            const closeUserManager = () => {
                setIsUserManagerOpen(false);
                setNewUserForm({ username: '', password: '', role: 'user' });
            };

            const createAdminUser = async () => {
                if (!isAdmin || isCreatingUser) return;

                const username = (newUserForm.username || '').trim();
                const password = newUserForm.password || '';
                const role = String(newUserForm.role || 'user').trim().toLowerCase();

                if (!username) {
                    pushToast(t('dialog.usernameRequired'), 'warning');
                    return;
                }
                if (!password) {
                    pushToast(t('dialog.passwordRequired'), 'warning');
                    return;
                }
                if (password.length < 6) {
                    pushToast(t('dialog.passwordTooShort', { min: 6 }), 'warning');
                    return;
                }
                if (role !== 'user' && role !== 'admin') {
                    pushToast(t('dialog.invalidRole'), 'warning');
                    return;
                }

                setIsCreatingUser(true);
                try {
                    const res = await authFetch('/api/admin/users', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, role }),
                    });
                    if (!res.ok) {
                        const errorCode = await readResponseError(res, 'create_user_failed');
                        pushToast(t('notify.createUserFailed', { error: errorCode }), 'error');
                        return;
                    }

                    const created = await res.json();
                    setNewUserForm({ username: '', password: '', role: 'user' });
                    await loadAdminUsers();
                    pushToast(t('notify.userCreated', { name: created?.username || username }), 'success');
                } catch (error) {
                    pushToast(t('notify.loadUsersFailed'), 'error');
                } finally {
                    setIsCreatingUser(false);
                }
            };

            const runUserAction = async (actionKey, task) => {
                if (userActionKey) return;
                setUserActionKey(actionKey);
                try {
                    await task();
                } finally {
                    setUserActionKey('');
                }
            };

            const deleteAdminUser = async (user) => {
                if (!isAdmin || !user) return;

                const confirmed = await openConfirmDialog({
                    title: t('dialog.deleteUserTitle'),
                    description: t('dialog.deleteUserDescription', { name: user.username || '-' }),
                    confirmText: t('action.deleteUser'),
                    confirmTone: 'danger',
                });
                if (!confirmed) return;

                await runUserAction(`delete:${user.id}`, async () => {
                    try {
                        const res = await authFetch(`/api/admin/users/${user.id}`, {
                            method: 'DELETE',
                        });
                        if (!res.ok) {
                            const errorCode = await readResponseError(res);
                            pushToast(t('notify.adminUserActionFailed', { error: errorCode }), 'error');
                            return;
                        }
                        await loadAdminUsers();
                        pushToast(t('notify.userDeleted', { name: user.username || '-' }), 'success');
                    } catch (error) {
                        pushToast(t('notify.loadUsersFailed'), 'error');
                    }
                });
            };

            const updateAdminUserRole = async (user, nextRole) => {
                if (!isAdmin || !user) return;
                if (nextRole !== 'admin' && nextRole !== 'user') return;
                if (user.role === nextRole) return;

                await runUserAction(`role:${user.id}`, async () => {
                    try {
                        const res = await authFetch(`/api/admin/users/${user.id}/role`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ role: nextRole }),
                        });
                        if (!res.ok) {
                            const errorCode = await readResponseError(res);
                            pushToast(t('notify.adminUserActionFailed', { error: errorCode }), 'error');
                            await loadAdminUsers();
                            return;
                        }

                        const updated = await res.json();
                        setAdminUsers((prev) => prev.map((item) => (String(item.id) === String(updated.id) ? updated : item)));
                        if (currentUser && String(currentUser.id) === String(updated.id)) {
                            setCurrentUser((prev) => (prev ? { ...prev, role: updated.role } : prev));
                        }
                        pushToast(t('notify.userRoleUpdated', { name: updated.username || user.username || '-' }), 'success');
                    } catch (error) {
                        pushToast(t('notify.loadUsersFailed'), 'error');
                    }
                });
            };

            const resetAdminUserPassword = async (user) => {
                if (!isAdmin || !user) return;

                const password = await openPromptDialog({
                    title: t('dialog.resetPasswordTitle'),
                    description: t('dialog.resetPasswordDescription', { name: user.username || '-' }),
                    placeholder: '******',
                    inputType: 'password',
                    required: true,
                    maxLength: 128,
                    validate: (candidate) => {
                        if (!candidate || candidate.length < 6) {
                            return t('dialog.passwordTooShort', { min: 6 });
                        }
                        return '';
                    },
                });
                if (password === null) return;

                await runUserAction(`password:${user.id}`, async () => {
                    try {
                        const res = await authFetch(`/api/admin/users/${user.id}/password`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password }),
                        });
                        if (!res.ok) {
                            const errorCode = await readResponseError(res);
                            pushToast(t('notify.adminUserActionFailed', { error: errorCode }), 'error');
                            return;
                        }
                        pushToast(t('notify.userPasswordReset', { name: user.username || '-' }), 'success');
                    } catch (error) {
                        pushToast(t('notify.loadUsersFailed'), 'error');
                    }
                });
            };

            const localizeAIError = (rawMessage) => {
                const normalizedLanguage = language === 'zh' ? 'zh' : 'en';
                const fallback = normalizedLanguage === 'zh' ? 'AI 查询失败，请稍后重试。' : 'AI query failed, please retry.';
                const message = String(rawMessage || '').trim();
                if (!message) return fallback;

                const code = message.toLowerCase();
                const knownCodeMap = normalizedLanguage === 'zh'
                    ? {
                        ai_disabled: 'AI 功能未启用。',
                        invalid_query: '问题不能为空，请输入后重试。',
                        ai_query_failed: 'AI 查询失败，请稍后重试。',
                        unauthorized: '登录状态已失效，请重新登录。',
                        invalid_conversation: '该会话已不存在或已失效，请开启新对话。',
                        conversation_not_found: '会话不存在，可能已被删除。',
                    }
                    : {
                        ai_disabled: 'AI feature is disabled.',
                        invalid_query: 'Query is empty. Please enter your question and retry.',
                        ai_query_failed: 'AI query failed. Please retry shortly.',
                        unauthorized: 'Session expired. Please sign in again.',
                        invalid_conversation: 'This conversation is no longer available. Start a new chat.',
                        conversation_not_found: 'Conversation not found. It may have been deleted already.',
                    };

                if (knownCodeMap[code]) {
                    return knownCodeMap[code];
                }

                const normalizedMessage = normalizeAIServerHint(normalizedLanguage, message);
                return normalizedLanguage === 'zh'
                    ? `AI 查询失败：${normalizedMessage}`
                    : `AI query failed: ${normalizedMessage}`;
            };

            const stopAIStreaming = () => {
                if (!abortControllerRef.current) return;
                abortControllerRef.current.abort();
                abortControllerRef.current = null;
                setIsAIStreaming(false);
                setAIThinking(false);
                const stopText = language === 'zh' ? '已停止当前回复。' : 'Stopped the current response.';
                setAIStreamError(stopText);
                if (activeAssistantIdRef.current) {
                    const targetId = activeAssistantIdRef.current;
                    setAIMessages((prev) => updateMessageById(prev, targetId, (item) => ({
                        ...item,
                        status: item.content ? 'done' : 'error',
                        content: item.content || stopText,
                    })));
                }
            };

            const refreshAIConversations = async () => {
                try {
                    const res = await authFetch('/api/ai/conversations?limit=200&offset=0');
                    if (!res.ok) {
                        setAIListError(localizeAIError(await readResponseError(res, 'ai_query_failed')));
                        return;
                    }
                    const payload = await res.json().catch(() => null);
                    const rows = payload && Array.isArray(payload.conversations) ? payload.conversations : [];
                    setAIConversations(rows.filter((row) => row && typeof row.id === 'number' && row.id > 0));
                    setAIListError('');
                } catch (loadError) {
                    setAIListError(localizeAIError('ai_query_failed'));
                }
            };

            useEffect(() => {
                if (!isAIWidgetOpen || !aiHistoryOpen || isAIStreaming) return;
                void refreshAIConversations();
            }, [isAIWidgetOpen, aiHistoryOpen, isAIStreaming]);

            const handleAISelectConversation = async (conversation) => {
                if (!conversation || isAIStreaming) return;
                try {
                    const res = await authFetch(`/api/ai/conversations/${conversation.id}/messages`);
                    if (!res.ok) {
                        setAIStreamError(localizeAIError(await readResponseError(res, 'ai_query_failed')));
                        return;
                    }
                    const payload = await res.json().catch(() => null);
                    const rows = payload && Array.isArray(payload.messages) ? payload.messages : [];
                    setAIMessages(mapStoredAIMessages(rows));
                    setAIConversationId(conversation.id);
                    setAIHistoryOpen(false);
                    setAIStreamError('');
                    setAIThinking(false);
                    shouldAutoScrollRef.current = true;
                } catch (loadError) {
                    setAIStreamError(localizeAIError('ai_query_failed'));
                }
            };

            const handleAIDeleteConversation = async (conversation) => {
                if (!conversation || aiDeletingId !== null) return;
                const conversationTitle = (conversation.title || '').trim() || (language === 'zh' ? '新对话' : 'New conversation');
                const confirmed = await openConfirmDialog({
                    title: language === 'zh' ? '删除对话' : 'Delete conversation',
                    description: language === 'zh'
                        ? `删除「${conversationTitle}」及其全部消息？此操作不可恢复。`
                        : `Delete "${conversationTitle}" and all of its messages? This cannot be undone.`,
                    confirmText: language === 'zh' ? '删除' : 'Delete',
                    confirmTone: 'danger',
                });
                if (!confirmed) return;

                setAIDeletingId(conversation.id);
                try {
                    const res = await authFetch(`/api/ai/conversations/${conversation.id}`, { method: 'DELETE' });
                    if (!res.ok) {
                        pushToast(localizeAIError(await readResponseError(res, 'conversation_not_found')), 'error');
                        return;
                    }
                    if (aiConversationId === conversation.id) {
                        setAIConversationId(null);
                        setAIMessages([]);
                    }
                    await refreshAIConversations();
                    pushToast(language === 'zh' ? '已删除对话。' : 'Conversation deleted.', 'success');
                } catch (deleteError) {
                    pushToast(localizeAIError('ai_query_failed'), 'error');
                } finally {
                    setAIDeletingId(null);
                }
            };

            const handleAINewChat = () => {
                if (isAIStreaming) return;
                setAIConversationId(null);
                setAIMessages([]);
                setAIStreamError('');
                setAIThinking(false);
                setAIHistoryOpen(false);
                shouldAutoScrollRef.current = true;
            };

            const submitAIStreamQuery = async (rawQuery = aiDraft) => {
                const query = String(rawQuery || '').trim();
                if (!query || isAIStreaming) return;

                const userMessage = {
                    id: createMessageId(),
                    role: 'user',
                    content: query,
                    status: 'done',
                    createdAt: Date.now(),
                };
                const assistantMessageId = createMessageId();
                const assistantPlaceholder = {
                    id: assistantMessageId,
                    role: 'assistant',
                    content: '',
                    status: 'thinking',
                    reasoningSummary: '',
                    mode: '',
                    relatedNodes: [],
                    toolCalls: [],
                    warnings: [],
                    createdAt: Date.now() + 1,
                };

                activeAssistantIdRef.current = assistantMessageId;
                shouldAutoScrollRef.current = true;
                setIsAIWidgetOpen(true);
                setAIMessages((prev) => [...prev, userMessage, assistantPlaceholder]);
                setAIDraft('');
                setAIStreamError('');
                setAIThinking(true);
                setIsAIStreaming(true);

                const controller = new AbortController();
                abortControllerRef.current = controller;

                const setAssistant = (updater) => {
                    setAIMessages((prev) => updateMessageById(prev, assistantMessageId, updater));
                };

                const applyAssistantMeta = (source = {}) => {
                    if (!source || typeof source !== 'object') return;
                    setAssistant((item) => ({
                        ...item,
                        reasoningSummary: sanitizeAIText(
                            typeof source.reasoning_summary === 'string'
                                ? source.reasoning_summary
                                : (typeof source.reasoningSummary === 'string' ? source.reasoningSummary : item.reasoningSummary || '')
                        ),
                        mode: typeof source.mode === 'string' ? source.mode : (item.mode || ''),
                        relatedNodes: Array.isArray(source.related_nodes)
                            ? source.related_nodes
                            : (Array.isArray(source.relatedNodes) ? source.relatedNodes : (item.relatedNodes || [])),
                        toolCalls: Array.isArray(source.tool_calls)
                            ? source.tool_calls
                            : (Array.isArray(source.toolCalls) ? source.toolCalls : (item.toolCalls || [])),
                        warnings: Array.isArray(source.warnings)
                            ? source.warnings
                                .filter((warning) => typeof warning === 'string' && warning.trim())
                                .map((warning) => normalizeAIServerHint(language, warning))
                                .filter(Boolean)
                            : (item.warnings || []),
                    }));
                };

                const streamFallbackResponse = async (normalized) => {
                    const chunks = chunkTextForUI(normalized.answer || '', 36);
                    setAIThinking(false);
                    if (chunks.length === 0) {
                        setAssistant((item) => ({
                            ...item,
                            status: 'done',
                            content: sanitizeAIText(normalized.answer || '') || item.content,
                        }));
                        applyAssistantMeta(normalized);
                        return;
                    }

                    setAssistant((item) => ({ ...item, status: 'streaming', content: '' }));
                    for (const chunk of chunks) {
                        if (controller.signal.aborted) return;
                        setAssistant((item) => ({ ...item, status: 'streaming', content: `${item.content || ''}${chunk}` }));
                        await new Promise((resolve) => setTimeout(resolve, 24));
                    }
                    setAssistant((item) => ({ ...item, status: 'done' }));
                    applyAssistantMeta(normalized);
                };

                try {
                    // 新会话首条提问前先在服务端建档；失败则中止本次提交。
                    let conversationId = aiConversationId;
                    if (!conversationId) {
                        const createdRes = await authFetch('/api/ai/conversations', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({}),
                        });
                        const createdPayload = createdRes.ok ? await createdRes.json().catch(() => null) : null;
                        const createdId = createdPayload && typeof createdPayload.id === 'number' ? createdPayload.id : null;
                        if (!createdRes.ok || !createdId) {
                            const errorCode = createdRes.ok ? 'ai_query_failed' : await readResponseError(createdRes, 'ai_query_failed');
                            const message = localizeAIError(errorCode);
                            setAIStreamError(message);
                            setAssistant((item) => ({
                                ...item,
                                status: 'error',
                                content: item.content || message,
                            }));
                            pushToast(message, 'error');
                            return;
                        }
                        conversationId = createdId;
                        setAIConversationId(createdId);
                    }

                    const res = await authFetch('/api/ai/query', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'text/event-stream, application/json',
                        },
                        body: JSON.stringify({ query, stream: true, conversation_id: conversationId }),
                        signal: controller.signal,
                    });
                    if (!res.ok) {
                        const errorCode = await readResponseError(res, 'ai_query_failed');
                        const message = localizeAIError(errorCode);
                        setAIStreamError(message);
                        setAssistant((item) => ({
                            ...item,
                            status: 'error',
                            content: item.content || message,
                        }));
                        pushToast(message, 'error');
                        return;
                    }

                    const contentType = String(res.headers.get('content-type') || '').toLowerCase();
                    if (!contentType.includes('text/event-stream') || !res.body) {
                        const payload = await res.json();
                        const fallbackConversationId = extractAIConversationId(payload);
                        if (fallbackConversationId) setAIConversationId(fallbackConversationId);
                        const normalized = normalizeAIResponse(payload, language);
                        await streamFallbackResponse(normalized);
                        return;
                    }

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';
                    let hasDelta = false;
                    let hasDone = false;
                    let donePayload = null;

                    const handleFrame = (frame) => {
                        const parsed = parseSSEFrame(frame);
                        if (!parsed) return;
                        const eventType = String(parsed.event || '').trim();
                        const data = parsed.data && typeof parsed.data === 'object' ? parsed.data : {};

                        if (eventType === 'status') {
                            setAIThinking(true);
                            const localizedStatusMessage = localizeAIStatusText(
                                language,
                                typeof data.phase === 'string' ? data.phase : '',
                                typeof data.message === 'string' ? data.message : ''
                            );
                            setAIThinkingLabel(localizedStatusMessage);
                            setAssistant((item) => ({
                                ...item,
                                status: hasDelta ? item.status : 'thinking',
                            }));
                            return;
                        }
                        if (eventType === 'delta') {
                            const text = typeof data.text === 'string' ? data.text : '';
                            if (!text) return;
                            hasDelta = true;
                            setAIThinking(false);
                            setAssistant((item) => ({
                                ...item,
                                status: 'streaming',
                                content: `${item.content || ''}${text}`,
                            }));
                            return;
                        }
                        if (eventType === 'meta') {
                            const metaConversationId = extractAIConversationId(data);
                            if (metaConversationId) setAIConversationId(metaConversationId);
                            applyAssistantMeta(data);
                            return;
                        }
                        if (eventType === 'done') {
                            hasDone = true;
                            donePayload = data;
                            const doneConversationId = extractAIConversationId(data);
                            if (doneConversationId) setAIConversationId(doneConversationId);
                            setAIThinking(false);
                            return;
                        }
                        if (eventType === 'error') {
                            const code = typeof data.error === 'string' ? data.error : '';
                            const message = localizeAIError(code);
                            setAIStreamError(message);
                            setAIThinking(false);
                            setAssistant((item) => ({
                                ...item,
                                status: 'error',
                                content: item.content || message,
                            }));
                        }
                    };

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        buffer = buffer.replace(/\r\n/g, '\n');

                        let delimiterIndex = buffer.indexOf('\n\n');
                        while (delimiterIndex >= 0) {
                            const frame = buffer.slice(0, delimiterIndex);
                            buffer = buffer.slice(delimiterIndex + 2);
                            handleFrame(frame);
                            delimiterIndex = buffer.indexOf('\n\n');
                        }
                    }
                    if (buffer.trim()) {
                        handleFrame(buffer);
                    }

                    if (hasDone && donePayload) {
                        const normalizedDone = normalizeAIResponse(donePayload, language);
                        setAssistant((item) => ({
                            ...item,
                            status: item.status === 'error' ? 'error' : 'done',
                            content: normalizedDone.answer || item.content,
                            reasoningSummary: normalizedDone.reasoningSummary || item.reasoningSummary || '',
                            mode: normalizedDone.mode || item.mode || '',
                            relatedNodes: normalizedDone.relatedNodes.length > 0 ? normalizedDone.relatedNodes : (item.relatedNodes || []),
                            toolCalls: normalizedDone.toolCalls.length > 0 ? normalizedDone.toolCalls : (item.toolCalls || []),
                            warnings: normalizedDone.warnings.length > 0 ? normalizedDone.warnings : (item.warnings || []),
                        }));
                    } else if (!hasDelta) {
                        const normalizedFallback = normalizeAIResponse(donePayload || {}, language);
                        await streamFallbackResponse(normalizedFallback);
                    } else {
                        setAssistant((item) => ({
                            ...item,
                            status: item.status === 'error' ? 'error' : 'done',
                        }));
                    }
                } catch (error) {
                    if (error && error.name === 'AbortError') {
                        return;
                    }
                    const message = localizeAIError(error && error.message ? error.message : '');
                    setAIStreamError(message);
                    setAIThinking(false);
                    setAssistant((item) => ({
                        ...item,
                        status: 'error',
                        content: item.content || message,
                    }));
                    pushToast(message, 'error');
                } finally {
                    if (abortControllerRef.current === controller) {
                        abortControllerRef.current = null;
                    }
                    activeAssistantIdRef.current = '';
                    setIsAIStreaming(false);
                    setAIThinking(false);
                }
            };

            const handleSelectGpu = (serverId, gpuIndex, gpu) => {
                setSelectedGpuRef({
                    serverId,
                    gpuIndex,
                    gpuId: safeNumber(gpu?.id),
                    gpuName: typeof gpu?.name === 'string' ? gpu.name.trim() : '',
                });
            };

            const enrichedServers = useMemo(() => {
                const nowMs = Date.now();
                return servers.map((server) => {
                    const fallbackGpuSummary = getServerGpuSummary(server);
                    const gpuSummary = server?.gpuSummary && typeof server.gpuSummary === 'object'
                        ? {
                            ...fallbackGpuSummary,
                            ...server.gpuSummary,
                            avgUtilization: safeNumber(server.gpuSummary.avgUtilization),
                            avgMemoryPercent: safeNumber(server.gpuSummary.avgMemoryPercent),
                        }
                        : fallbackGpuSummary;
                    const activeUsers = Array.isArray(server?.activeUsers) ? server.activeUsers : getServerActiveUsers(server);
                    const activeUserCount = Number.isFinite(server?.activeUserCount) ? Number(server.activeUserCount) : activeUsers.length;
                    const availabilityScore = Number.isFinite(server?.availabilityScore)
                        ? Number(server.availabilityScore)
                        : computeAvailabilityScore(server, nowMs);
                    const availabilityTier = (typeof server?.availabilityTier === 'string' && server.availabilityTier)
                        ? server.availabilityTier
                        : getAvailabilityTier(availabilityScore, server);
                    const dataAgeSec = Number.isFinite(server?.dataAgeSec)
                        ? Number(server.dataAgeSec)
                        : computeDataAgeSeconds(server, nowMs);
                    return {
                        ...server,
                        hostDisplay: getServerHostDisplay(server),
                        activeUsers,
                        activeUserCount,
                        gpuSummary,
                        availabilityScore,
                        availabilityTier,
                        cpuPercent: safeNumber(server?.data?.cpu_usage),
                        ramPercent: safeNumber(server?.data?.ram_percent),
                        networkDown: safeNumber(server?.metrics?.downSpeed) || 0,
                        networkUp: safeNumber(server?.metrics?.upSpeed) || 0,
                        dataAgeSec,
                    };
                });
            }, [servers]);

            const filteredServers = useMemo(() => {
                const query = nodeQuery.trim().toLowerCase();
                const filtered = enrichedServers.filter((server) => {
                    if (!query) return true;
                    const target = `${server.name || ''} ${server.url || ''} ${server.hostDisplay || ''}`.toLowerCase();
                    return target.includes(query);
                });
                return sortServersForMode(filtered, sortMode);
            }, [enrichedServers, nodeQuery, sortMode]);

            const filteredAdminUsers = useMemo(() => {
                const query = userQuery.trim().toLowerCase();
                if (!query) return adminUsers;
