        };

        const App = () => {
            const [servers, setServers] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isActivityOpen, setIsActivityOpen] = useState(false);
            const [modalData, setModalData] = useState({ name: "", url: "http://" });
            const [language, setLanguage] = useState(() => getInitialLanguage());
            const [currentUser, setCurrentUser] = useState(null);
            const [isAuthLoading, setIsAuthLoading] = useState(true);
            const [selectedServerId, setSelectedServerId] = useState(null);
            const [nodeQuery, setNodeQuery] = useState('');
            const [sortMode, setSortMode] = useState('availability');
            const historyRef = useRef({});
            const latestServersRef = useRef([]);
            const activeFetchIdRef = useRef(0);
            const [lastSyncedAt, setLastSyncedAt] = useState(null);
            const [selectedGpuRef, setSelectedGpuRef] = useState(null);
            const [dialogState, setDialogState] = useState(null);
            const dialogResolverRef = useRef(null);
            const [toasts, setToasts] = useState([]);
            const toastTimersRef = useRef(new Map());
            const [isSavingServer, setIsSavingServer] = useState(false);
            const t = useMemo(() => createTranslator(language), [language]);
            const isAdmin = currentUser && currentUser.role === 'admin';
            const resolvedSelectedGpu = useResolvedSelectedGpu(selectedGpuRef, servers);

            useEffect(() => {
                try {
                    localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
                } catch (e) {}
                document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
                document.title = t('app.title');
            }, [language, t]);

            useEffect(() => {
                if (!selectedGpuRef) return;
                if (selectedServerId === null || String(selectedGpuRef.serverId) !== String(selectedServerId)) {
                    setSelectedGpuRef(null);
                }
            }, [selectedGpuRef, selectedServerId]);

            useEffect(() => () => {
                const activeResolver = dialogResolverRef.current;
                dialogResolverRef.current = null;
                if (typeof activeResolver === 'function') activeResolver(null);
            }, []);

            useEffect(() => () => {
                toastTimersRef.current.forEach((timer) => clearTimeout(timer));
                toastTimersRef.current.clear();
            }, []);

            const dismissToast = (id) => {
                const timer = toastTimersRef.current.get(id);
                if (timer) {
                    clearTimeout(timer);
                    toastTimersRef.current.delete(id);
                }
                setToasts((prev) => prev.filter((item) => item.id !== id));
            };

            const pushToast = (message, tone = 'info', duration = 3200) => {
                if (!message) return null;
                const id = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
                setToasts((prev) => [...prev, { id, message, tone }]);
                const timer = setTimeout(() => dismissToast(id), duration);
                toastTimersRef.current.set(id, timer);
                return id;
            };

            const clearSessionAndRedirect = useCallback(() => {
                try {
                    localStorage.removeItem(TOKEN_STORAGE_KEY);
                    localStorage.removeItem(USER_STORAGE_KEY);
                } catch (e) {}
                window.location.href = '/';
            }, []);

            const handleLogout = useCallback(() => {
                setCurrentUser(null);
                clearSessionAndRedirect();
            }, [clearSessionAndRedirect]);

            const authFetch = useCallback(async (input, init = {}) => {
                const token = localStorage.getItem(TOKEN_STORAGE_KEY);
                if (!token) {
                    clearSessionAndRedirect();
                    throw new Error('unauthorized');
                }

                const headers = new Headers(init.headers || {});
                headers.set('Authorization', `Bearer ${token}`);

                const response = await fetch(input, { ...init, headers });
                if (response.status === 401) {
                    clearSessionAndRedirect();
                    throw new Error('unauthorized');
                }
                return response;
            }, [clearSessionAndRedirect]);

            const openDialog = (config) => new Promise((resolve) => {
                const previousResolver = dialogResolverRef.current;
                if (typeof previousResolver === 'function') previousResolver(null);
                dialogResolverRef.current = resolve;
                setDialogState(config);
            });

            const resolveDialog = (value) => {
                const resolver = dialogResolverRef.current;
                dialogResolverRef.current = null;
                setDialogState(null);
                if (typeof resolver === 'function') resolver(value);
            };

            const openConfirmDialog = (options = {}) => openDialog({
                type: 'confirm',
                confirmText: t('action.confirm'),
                cancelText: t('action.cancel'),
                closeOnEsc: true,
                closeOnBackdrop: true,
                ...options,
            });

            const normalizeServerConfig = (server) => ({
                id: server.id,
                name: server.name,
                url: server.url,
                status: 'pending',
                data: null,
                metrics: null,
                lastSeenAt: null,
            });

            useEffect(() => {
                const token = localStorage.getItem(TOKEN_STORAGE_KEY);
                if (!token) {
                    clearSessionAndRedirect();
                    return undefined;
                }

                let disposed = false;
                const bootstrapUser = async () => {
                    try {
                        const res = await authFetch('/api/me');
                        if (!res.ok) {
                            throw new Error('load_me_failed');
                        }
                        const profile = await res.json();
                        if (disposed) return;
                        setCurrentUser(profile);
                    } catch (error) {
                        if (!disposed) clearSessionAndRedirect();
                    } finally {
                        if (!disposed) setIsAuthLoading(false);
                    }
                };
                bootstrapUser();

                return () => {
                    disposed = true;
                };
            }, [authFetch, clearSessionAndRedirect]);

            useEffect(() => {
                if (!currentUser) return;

                let disposed = false;
                const loadConfig = async () => {
                    try {
                        const res = await authFetch('/api/config');
                        if (!res.ok) {
                            throw new Error('load_config_failed');
                        }
                        const data = await res.json();
                        if (disposed) return;
                        setServers(data.map(normalizeServerConfig));
                    } catch (error) {
                        if (!disposed) {
                            setServers([]);
                            pushToast(t('notify.saveConfigFailed'), 'error');
                        }
                    }
                };
                loadConfig();

                return () => {
                    disposed = true;
                };
            }, [authFetch, currentUser, t]);

            useEffect(() => {
                latestServersRef.current = servers;
            }, [servers]);

            const showSaveConfigError = () => {
                pushToast(t('notify.saveConfigFailed'), 'error');
            };

            useEffect(() => {
                if (!currentUser) return;

                let disposed = false;
                const inFlightControllers = new Set();
                const inFlightTimeouts = new Set();
                const effectGeneration = ++activeFetchIdRef.current;
                let nextRequestId = 0;
                let latestAppliedRequestId = 0;

                const fetchAll = async () => {
                    const requestId = ++nextRequestId;
                    const snapshot = latestServersRef.current;
                    if (snapshot.length === 0) return;

                    const promises = snapshot.map(async (server) => {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 3000);
                        inFlightControllers.add(controller);
                        inFlightTimeouts.add(timeoutId);

                        try {
                            const targetUrl = `${server.url}/metrics`;
                            const proxyUrl = `/api/proxy?url=${encodeURIComponent(targetUrl)}`;
                            let res;
                            try {
                                res = await authFetch(proxyUrl, {
                                    signal: controller.signal,
                                });
                                if (res.status !== 200) throw new Error('proxy_failed');
                            } catch (proxyErr) {
                                if (proxyErr && proxyErr.message === 'unauthorized') {
                                    throw proxyErr;
                                }
                                res = await fetch(targetUrl, {
                                    signal: controller.signal,
                                });
                            }
                            if (!res.ok) throw new Error();

                            const jsonData = await res.json();
                            const currentTime = Date.now();
                            const history = historyRef.current[server.url];
                            let upSpeed = 0;
                            let downSpeed = 0;
                            if (history) {
                                const timeDiffSec = (currentTime - history.timestamp) / 1000;
                                if (timeDiffSec > 0) {
                                    upSpeed = Math.max(0, jsonData.net_sent_mb - history.sent) / timeDiffSec;
                                    downSpeed = Math.max(0, jsonData.net_recv_mb - history.recv) / timeDiffSec;
                                }
                            }
                            historyRef.current[server.url] = { timestamp: currentTime, sent: jsonData.net_sent_mb, recv: jsonData.net_recv_mb };
                            return { id: server.id, status: 'online', data: jsonData, metrics: { upSpeed, downSpeed }, lastSeenAt: currentTime };
                        } catch {
                            return { id: server.id, status: 'offline' };
                        } finally {
                            clearTimeout(timeoutId);
                            inFlightTimeouts.delete(timeoutId);
                            inFlightControllers.delete(controller);
                        }
                    });

                    const results = await Promise.all(promises);
                    if (disposed || effectGeneration !== activeFetchIdRef.current) return;
                    if (requestId < latestAppliedRequestId) return;
                    latestAppliedRequestId = requestId;

                    setServers((prevServers) => {
                        const resultMap = new Map(results.map((item) => [item.id, item]));
                        return prevServers.map((server) => {
                            const next = resultMap.get(server.id);
                            if (!next) return server;
                            if (next.status === 'offline') return { ...server, status: 'offline' };
                            return { ...server, status: 'online', data: next.data, metrics: next.metrics, lastSeenAt: next.lastSeenAt };
                        });
                    });
                    setLastSyncedAt(new Date());
                };

                fetchAll();
                const interval = setInterval(fetchAll, 2000);

                return () => {
                    disposed = true;
                    if (activeFetchIdRef.current === effectGeneration) {
                        activeFetchIdRef.current += 1;
                    }
                    clearInterval(interval);
                    inFlightTimeouts.forEach((timeoutId) => clearTimeout(timeoutId));
                    inFlightControllers.forEach((controller) => controller.abort());
                };
            }, [authFetch, currentUser]);

            const addServer = async () => {
                if (!isAdmin || isSavingServer) return;
                setIsSavingServer(true);
                try {
                    const name = modalData.name.trim();
                    const url = modalData.url.trim();
                    if (!name || !url) {
                        showSaveConfigError();
                        return;
                    }

                    const res = await authFetch('/api/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, url }),
                    });
                    if (!res.ok) {
                        showSaveConfigError();
                        return;
                    }

                    const createdNode = await res.json();
                    setServers((prev) => [...prev, normalizeServerConfig(createdNode)]);
                    setIsModalOpen(false);
                    setModalData({ name: "", url: "http://" });
                } catch (error) {
                    showSaveConfigError();
                } finally {
                    setIsSavingServer(false);
                }
            };

            const deleteServer = async (server) => {
                if (!isAdmin || !server) return;

                const confirmed = await openConfirmDialog({
                    title: t('dialog.deleteNodeTitle'),
                    description: t('dialog.deleteNodeDescription', { name: server.name || '-' }),
                    confirmText: t('action.deleteNode'),
                    confirmTone: 'danger',
                });
                if (!confirmed) return;

                let deleteRes;
                try {
                    deleteRes = await authFetch(`/api/config/${server.id}`, {
                        method: 'DELETE',
                    });
                } catch (error) {
                    showSaveConfigError();
                    return;
                }
                if (!deleteRes.ok) {
                    showSaveConfigError();
                    return;
                }

                const currentServers = latestServersRef.current;
                const newList = currentServers.filter((item) => item.id !== server.id);
                const removedServer = currentServers.find((item) => item.id === server.id);
                if (removedServer) delete historyRef.current[removedServer.url];
                setServers(newList);
                if (selectedGpuRef && String(selectedGpuRef.serverId) === String(server.id)) {
                    setSelectedGpuRef(null);
                }
                pushToast(t('notify.nodeDeleted', { name: server.name || '-' }), 'success');
            };

            const handleSelectGpu = (serverId, gpuIndex, gpu) => {
                setSelectedGpuRef({
                    serverId,
                    gpuIndex,
                    gpuId: safeNumber(gpu?.id),
                    gpuName: typeof gpu?.name === 'string' ? gpu.name.trim() : '',
                });
            };

            const enrichedServers = useMemo(() => {
                const nowMs = Date.now();
                return servers.map((server) => {
                    const gpuSummary = getServerGpuSummary(server);
                    const activeUsers = getServerActiveUsers(server);
                    const availabilityScore = computeAvailabilityScore(server, nowMs);
                    const availabilityTier = getAvailabilityTier(availabilityScore, server);
                    return {
                        ...server,
                        hostDisplay: getServerHostDisplay(server),
                        activeUsers,
                        activeUserCount: activeUsers.length,
                        gpuSummary,
                        availabilityScore,
                        availabilityTier,
                        cpuPercent: safeNumber(server?.data?.cpu_usage),
                        ramPercent: safeNumber(server?.data?.ram_percent),
                        networkDown: safeNumber(server?.metrics?.downSpeed) || 0,
                        networkUp: safeNumber(server?.metrics?.upSpeed) || 0,
                        dataAgeSec: computeDataAgeSeconds(server, nowMs),
                    };
                });
            }, [servers]);

            const filteredServers = useMemo(() => {
                const query = nodeQuery.trim().toLowerCase();
                const filtered = enrichedServers.filter((server) => {
                    if (!query) return true;
                    const target = `${server.name || ''} ${server.url || ''} ${server.hostDisplay || ''}`.toLowerCase();
                    return target.includes(query);
                });
                return sortServersForMode(filtered, sortMode);
            }, [enrichedServers, nodeQuery, sortMode]);

            useEffect(() => {
                if (filteredServers.length === 0) {
                    setSelectedServerId(null);
                    return;
                }

                const exists = filteredServers.find((item) => String(item.id) === String(selectedServerId));
                if (exists) {
                    const hasData = !!exists.data;
                    const shouldFallback = exists.status === 'offline' && !hasData;
                    if (!shouldFallback) return;
                }

                const firstOnline = filteredServers.find((item) => item.status === 'online');
                const fallback = firstOnline || filteredServers[0];
                if (fallback && String(fallback.id) !== String(selectedServerId)) {
                    setSelectedServerId(fallback.id);
                }
            }, [filteredServers, selectedServerId]);

            const selectedServer = useMemo(
                () => filteredServers.find((item) => String(item.id) === String(selectedServerId)) || null,
                [filteredServers, selectedServerId]
            );

            const onlineServers = useMemo(() => enrichedServers.filter((server) => server.status === 'online'), [enrichedServers]);
            const activeCount = onlineServers.length;
            const totalServers = enrichedServers.length;
            const totalGpus = onlineServers.reduce((sum, server) => sum + server.gpuSummary.gpuCount, 0);
            const totalPower = onlineServers.reduce((sum, server) => sum + server.gpuSummary.totalPower, 0);
            const totalCpuAvg = onlineServers.length
                ? onlineServers.reduce((sum, server) => sum + (server.cpuPercent || 0), 0) / onlineServers.length
                : null;
            const totalRamAvg = onlineServers.length
                ? onlineServers.reduce((sum, server) => sum + (server.ramPercent || 0), 0) / onlineServers.length
                : null;

            const allProcesses = useMemo(() => onlineServers
                .flatMap((server) => getServerProcesses(server).map((proc) => ({ ...proc, serverName: server.name })))
                .filter((proc) => !SYSTEM_USER_BLACKLIST.has(resolveProcessUser(proc).toLowerCase())), [onlineServers]);

            const activeUsersCount = useMemo(() => {
                const users = new Set();
                allProcesses.forEach((proc) => {
                    if (!isActiveGpuProcess(proc)) return;
                    const user = resolveProcessUser(proc);
                    if (!user) return;
                    users.add(user);
                });
                return users.size;
            }, [allProcesses]);

            const selectedUsers = useMemo(() => buildServerTopUsers(selectedServer, t), [selectedServer, t]);

            const snapshotEvents = useMemo(() => {
                if (!selectedServer) return [];
                return [
                    {
                        label: t('snapshot.updatedLabel'),
                        value: selectedServer.lastSeenAt ? formatTime(new Date(selectedServer.lastSeenAt)) : t('node.na'),
                        detail: selectedServer.status === 'online' ? t('detail.onlineHint') : t('detail.offlineHint'),
                    },
                    {
                        label: t('availability.score'),
                        value: `${selectedServer.availabilityScore}`,
                        detail: t(`availability.${selectedServer.availabilityTier}`),
                    },
                    {
                        label: t('snapshot.occupancyLabel'),
                        value: t('snapshot.occupancyValue', { count: selectedServer.activeUserCount }),
                        detail: `${t('node.idleGpu')} ${selectedServer.gpuSummary.idleGpuCount} · ${t('node.busyGpu')} ${getBusyGpuCount(selectedServer)}`,
                    },
                    {
                        label: t('node.dataAge'),
                        value: formatAgeShort(selectedServer.dataAgeSec, t),
                        detail: t('snapshot.updatedDetail'),
                    },
                    {
                        label: t('metric.net'),
                        value: `↓ ${formatSpeed(selectedServer.networkDown)} / ↑ ${formatSpeed(selectedServer.networkUp)}`,
                        detail: t('drawer.networkThroughput'),
                    },
                ];
            }, [selectedServer, t]);

            if (isAuthLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center text-sm text-[#6f685f]">
                        {language === 'zh' ? '正在验证登录状态...' : 'Checking session...'}
                    </div>
                );
            }
            if (!currentUser) return null;

            return (
                <div className="min-h-screen pb-12">
                    <div className="max-w-[1480px] mx-auto px-4 sm:px-6 py-6 md:py-8">
                        <header className="soft-panel p-5 mb-5">
                            <div className="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
                                <div className="min-w-0">
                                    <div className="section-eyebrow mb-1">{t('app.eyebrow')}</div>
                                    <h1 className="text-xl md:text-2xl font-semibold tracking-tight text-[#1a1917]">
                                        {t('app.title')} <span className="text-[#6b665e]">/ {t('app.fleetOverviewHeading')}</span>
                                    </h1>
                                    <p className="text-sm text-[#6b665e] mt-1">{t('app.dashboardSubtitle')}</p>
                                </div>
                                <div className="flex flex-wrap items-center gap-2">
                                    <SummaryPill label={t('summary.synced')} value={lastSyncedAt ? formatTime(lastSyncedAt) : '-'} tone="default" />
                                    <SummaryPill label={t('summary.refresh')} value={t('summary.refreshValue')} tone="default" />
                                    <SummaryPill label={language === 'zh' ? '角色' : 'Role'} value={currentUser.role} tone={isAdmin ? 'positive' : 'neutral'} />
                                    {isAdmin ? (
                                        <button
                                            onClick={() => setIsModalOpen(true)}
                                            className="primary-button px-4 py-2 text-sm font-medium inline-flex items-center gap-2"
                                        >
                                            <Icons.Plus className="w-4 h-4" /> {t('action.addNode')}
                                        </button>
                                    ) : null}
                                    <button
                                        onClick={() => setIsActivityOpen(true)}
                                        className="muted-button px-4 py-2 text-sm font-medium inline-flex items-center gap-2"
                                        title={t('misc.includesVramUsers')}
                                    >
                                        <Icons.Users className="w-4 h-4" />
                                        {t('action.gpuUsers')}
                                    </button>
                                    <button
                                        onClick={() => setLanguage((prev) => (prev === 'en' ? 'zh' : 'en'))}
                                        className="muted-button px-3 py-2 text-sm font-medium"
                                        title={language === 'en' ? t('action.langSwitchTitleToZh') : t('action.langSwitchTitleToEn')}
                                        aria-label={language === 'en' ? t('action.langSwitchAriaToZh') : t('action.langSwitchAriaToEn')}
                                    >
                                        {language === 'en' ? '中文' : 'EN'}
                                    </button>
                                    <button
                                        onClick={handleLogout}
                                        className="muted-button px-4 py-2 text-sm font-medium"
                                    >
                                        {t('action.logout')}
                                    </button>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3 mt-5">
                                <NodeKpiTile label={t('metric.onlineServers')} value={`${activeCount} / ${totalServers}`} sub={t('metric.liveReachability')} icon={Icons.Server} />
                                <NodeKpiTile label={t('metric.totalGpu')} value={`${totalGpus}`} sub={t('metric.detectedOnlineNodes')} icon={Icons.Zap} />
                                <NodeKpiTile label={t('metric.totalPower')} value={totalPower > 0 ? `${totalPower.toFixed(0)} W` : '-'} sub={t('metric.summedGpuDraw')} icon={Icons.Activity} />
                                <NodeKpiTile label={t('metric.avgCpu')} value={totalCpuAvg !== null ? `${totalCpuAvg.toFixed(1)}%` : '-'} sub={t('metric.onlineNodesOnly')} icon={Icons.Cpu} />
                                <NodeKpiTile label={t('metric.avgRam')} value={totalRamAvg !== null ? `${totalRamAvg.toFixed(1)}%` : '-'} sub={t('metric.onlineNodesOnly')} icon={Icons.HardDrive} />
                                <NodeKpiTile label={t('summary.activeUsers')} value={`${activeUsersCount}`} sub={t('drawer.thresholdNote')} icon={Icons.Users} />
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-[370px_minmax(0,1fr)] gap-5">
                            <aside className="soft-panel p-4 md:p-5">
                                <NodeListToolbar
                                    query={nodeQuery}
                                    onQueryChange={setNodeQuery}
                                    sortMode={sortMode}
                                    onSortModeChange={setSortMode}
                                    t={t}
                                />

                                <div className="mt-3 space-y-2.5 max-h-[calc(100vh-280px)] overflow-y-auto custom-scrollbar pr-1">
                                    {servers.length === 0 ? (
                                        <div className="soft-panel-subtle p-5 text-center">
                                            <div className="text-sm font-semibold text-[#2d2a27] mb-1">{t('empty.noConfiguredNodes')}</div>
                                            <div className="text-xs text-[#6e675f] mb-3">{t('empty.addFirstNode')}</div>
                                            {isAdmin ? (
                                                <button onClick={() => setIsModalOpen(true)} className="primary-button px-4 py-2 text-sm font-medium inline-flex items-center gap-2">
                                                    <Icons.Plus className="w-4 h-4" /> {t('action.connectNode')}
                                                </button>
                                            ) : null}
                                        </div>
                                    ) : filteredServers.length === 0 ? (
                                        <div className="soft-panel-subtle p-5 text-center">
                                            <div className="text-sm text-[#6f685f]">{t('panel.emptyFilter')}</div>
                                            <button type="button" className="muted-button px-4 py-2 text-xs font-medium mt-3" onClick={() => setNodeQuery('')}>
                                                {t('action.clearFilter')}
                                            </button>
                                        </div>
                                    ) : (
                                        filteredServers.map((server) => (
                                            <NodeListItem
                                                key={server.id}
                                                server={server}
                                                isSelected={String(selectedServerId) === String(server.id)}
                                                onSelect={(item) => setSelectedServerId(item.id)}
                                                onDelete={deleteServer}
                                                canManage={isAdmin}
                                                t={t}
                                            />
                                        ))
                                    )}
                                </div>
                            </aside>

                            <section className="space-y-5">
                                {!selectedServer ? (
                                    <div className="soft-panel p-8 text-center text-[#6f685f] text-sm">{t('panel.emptySelect')}</div>
                                ) : (
                                    <>
                                        <NodeHeroCard server={selectedServer} t={t} />

                                        <section className="soft-panel p-5">
                                            <div className="section-eyebrow mb-2">{t('detail.resourceOverview')}</div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3">
                                                <NodeKpiTile
                                                    label={t('metric.cpu')}
                                                    value={selectedServer.cpuPercent !== null ? `${selectedServer.cpuPercent.toFixed(1)}%` : t('node.na')}
                                                    sub={selectedServer.data?.cpu_cores ? `${selectedServer.data.cpu_cores} ${t('metric.cores')}` : t('node.na')}
                                                    icon={Icons.Cpu}
                                                />
                                                <NodeKpiTile
                                                    label={t('metric.ram')}
                                                    value={selectedServer.ramPercent !== null ? `${selectedServer.ramPercent.toFixed(1)}%` : t('node.na')}
                                                    sub={safeNumber(selectedServer?.data?.ram_used) !== null ? `${Number(selectedServer.data.ram_used).toFixed(1)} ${t('metric.gbUsed')}` : t('node.na')}
                                                    icon={Icons.HardDrive}
                                                />
                                                <NodeKpiTile
                                                    label={t('metric.net')}
                                                    value={`↓ ${formatSpeed(selectedServer.networkDown)}`}
                                                    sub={`${t('metric.up')} ${formatSpeed(selectedServer.networkUp)}`}
                                                    icon={Icons.Activity}
                                                />
                                                <NodeKpiTile
                                                    label={t('metric.gpus')}
                                                    value={`${selectedServer.gpuSummary.gpuCount}`}
                                                    sub={`${selectedServer.gpuSummary.totalMemoryUsed.toFixed(1)} / ${selectedServer.gpuSummary.totalMemory.toFixed(1)} GB · ${selectedServer.gpuSummary.totalPower.toFixed(0)}W · ${selectedServer.activeUserCount} ${t('node.users')}`}
                                                    icon={Icons.Zap}
                                                />
                                            </div>
                                        </section>

                                        <div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1.6fr)_minmax(280px,1fr)] gap-5">
                                            <section className="soft-panel p-5">
                                                <div className="section-eyebrow mb-2">{t('detail.gpuMatrix')}</div>
                                                <GpuMatrixPanel server={selectedServer} onSelectGpu={handleSelectGpu} t={t} />
                                                <div className="mt-4">
                                                    <div className="section-eyebrow mb-2">{t('detail.gpuDetail')}</div>
                                                    <InlineGpuDetailPanel
                                                        selectedGpuRef={selectedGpuRef}
                                                        resolvedGpu={resolvedSelectedGpu}
                                                        onClear={() => setSelectedGpuRef(null)}
                                                        t={t}
                                                    />
                                                </div>
                                            </section>

                                            <div className="space-y-5">
                                                <section className="soft-panel p-5">
                                                    <div className="section-eyebrow mb-2">{t('detail.snapshotEvents')}</div>
                                                    <EventFeed events={snapshotEvents} />
                                                </section>
                                                <section className="soft-panel p-5">
                                                    <div className="section-eyebrow mb-2">{t('detail.userSummary')}</div>
                                                    <UserSummaryList users={selectedUsers} t={t} />
                                                </section>
                                            </div>
                                        </div>
                                    </>
                                )}
                            </section>
                        </div>
                    </div>

                    <ActivityDrawer isOpen={isActivityOpen} onClose={() => setIsActivityOpen(false)} processes={allProcesses} t={t} />
                    <ConfirmDialog config={dialogState && dialogState.type === 'confirm' ? dialogState : null} onResolve={resolveDialog} t={t} />
                    <ToastStack toasts={toasts} onDismiss={dismissToast} t={t} />

                    {isModalOpen && isAdmin ? (
                        <div className="fixed inset-0 z-50 bg-[#2f2922]/22 backdrop-blur-[2px] p-4 flex items-center justify-center fade-enter">
                            <div className="soft-panel w-full max-w-lg p-6 md:p-7">
                                <div className="flex items-center justify-between mb-5">
                                    <div>
                                        <div className="section-eyebrow mb-1">{t('modal.configuration')}</div>
                                        <h3 className="text-xl font-semibold text-[#1f1d1b]">{t('modal.addNode')}</h3>
                                    </div>
                                    <button
                                        onClick={() => setIsModalOpen(false)}
                                        disabled={isSavingServer}
                                        className={cx('muted-button p-2 text-[#6f685f]', isSavingServer ? 'opacity-60 cursor-not-allowed' : '')}
                                        title={t('action.close')}
                                    >
                                        <Icons.X className="w-4 h-4" />
                                    </button>
                                </div>

                                <div className="space-y-3.5">
                                    <div>
                                        <label className="block text-[10px] uppercase tracking-[0.13em] font-semibold text-[#847c73] mb-1.5">{t('modal.nodeName')}</label>
                                        <input
                                            type="text"
                                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors"
                                            placeholder={t('modal.nodeNamePlaceholder')}
                                            value={modalData.name}
                                            disabled={isSavingServer}
                                            onChange={(e) => setModalData({ ...modalData, name: e.target.value })}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] uppercase tracking-[0.13em] font-semibold text-[#847c73] mb-1.5">{t('modal.agentUrl')}</label>
                                        <input
                                            type="text"
                                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors font-mono"
                                            placeholder={t('modal.agentUrlPlaceholder')}
                                            value={modalData.url}
                                            disabled={isSavingServer}
                                            onChange={(e) => setModalData({ ...modalData, url: e.target.value })}
                                        />
                                    </div>
                                </div>

                                <div className="mt-6 flex gap-2.5">
                                    <button
                                        onClick={() => setIsModalOpen(false)}
                                        disabled={isSavingServer}
                                        className={cx('muted-button flex-1 px-4 py-2.5 text-sm font-medium', isSavingServer ? 'opacity-60 cursor-not-allowed' : '')}
                                    >
                                        {t('action.cancel')}
                                    </button>
                                    <button
                                        onClick={addServer}
                                        disabled={isSavingServer}
                                        className={cx('primary-button flex-1 px-4 py-2.5 text-sm font-medium', isSavingServer ? 'opacity-60 cursor-not-allowed' : '')}
                                    >
                                        {isSavingServer ? t('action.submitting') : t('action.connectAgent')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    ) : null}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
