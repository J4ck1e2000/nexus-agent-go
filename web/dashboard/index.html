        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --bg: #ece9e3;
            --panel: #f7f4ef;
            --panel-soft: #fbf8f3;
            --line: rgba(60, 47, 35, 0.08);
            --text-main: #181716;
            --text-muted: #6b665e;
            --teal: #5f9189;
            --teal-soft: #d9e8e4;
            --rose-soft: #ece4df;
            --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(1200px 380px at 0% -15%, rgba(255, 255, 255, 0.35), transparent 65%),
                radial-gradient(900px 280px at 100% 0%, rgba(255, 255, 255, 0.28), transparent 68%);
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c8c0b5; border-radius: 999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #b4ab9f; }

        .soft-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
        }

        .soft-panel-subtle {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 20px;
        }

        .muted-button {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            color: #3a3632;
            border-radius: 999px;
            transition: all 180ms ease;
        }

        .muted-button:hover {
            transform: translateY(-1px);
            border-color: rgba(60, 47, 35, 0.16);
            background: #f2eee7;
        }

        .primary-button {
            background: #26231f;
            color: #f8f4ed;
            border: 1px solid #26231f;
            border-radius: 999px;
            transition: all 180ms ease;
            box-shadow: 0 6px 16px rgba(38, 35, 31, 0.22);
        }

        .primary-button:hover {
            transform: translateY(-1px);
            background: #181614;
            border-color: #181614;
        }

        .section-eyebrow {
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 700;
            color: #7c746b;
        }

        .card-hover {
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            border-color: rgba(60, 47, 35, 0.16);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 22px rgba(0, 0, 0, 0.05);
        }

        .drawer-enter {
            animation: drawerIn 200ms ease;
        }

        @keyframes drawerIn {
            from { transform: translateX(20px); opacity: 0.7; }
            to { transform: translateX(0); opacity: 1; }
        }

        .fade-enter {
            animation: fadeIn 140ms ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .gpu-mini-card {
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .gpu-mini-card:hover {
            transform: translateY(-1px);
            border-color: rgba(60, 47, 35, 0.16);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 8px 18px rgba(0, 0, 0, 0.05);
        }

        .gpu-mini-card:focus-visible {
            outline: 2px solid rgba(95, 145, 137, 0.55);
            outline-offset: 2px;
        }
    </style>
</head>

        const resolveTranslationPath = (messages, key) => key.split('.').reduce((acc, part) => (acc && acc[part] !== undefined ? acc[part] : undefined), messages);

        const createTranslator = (language) => {
            const fallbackMessages = translations[DEFAULT_LANGUAGE] || {};
            const currentMessages = translations[language] || fallbackMessages;
            return (key, params = {}) => {
                const raw = resolveTranslationPath(currentMessages, key) ?? resolveTranslationPath(fallbackMessages, key);
                if (typeof raw === 'function') return raw(params);
                if (typeof raw === 'string') return formatTranslation(raw, params);
                return key;
            };
        };

        const getInitialLanguage = () => {
            try {
                const cached = localStorage.getItem(LANGUAGE_STORAGE_KEY);
                if (cached === 'zh' || cached === 'en') return cached;

            const browserLanguage = (navigator.language || navigator.userLanguage || DEFAULT_LANGUAGE).toLowerCase();
            return browserLanguage.startsWith('zh') ? 'zh' : 'en';
        };

        const clampPercent = (value) => {
            const num = Number(value);
            if (!Number.isFinite(num)) return 0;
            return Math.max(0, Math.min(100, num));

        const formatSpeed = (mbPerSec) => {
            if (!mbPerSec) return '0 KB/s';
            if (mbPerSec < 0.1) return '0 KB/s';
            if (mbPerSec < 1) return `${(mbPerSec * 1024).toFixed(0)} KB/s`;
            return `${mbPerSec.toFixed(2)} MB/s`;

        const formatTime = (d) => {

            const hh = String(d.getHours()).padStart(2, '0');

            const ss = String(d.getSeconds()).padStart(2, '0');
            return `${hh}:${mm}:${ss}`;

        const toneFromName = (name) => {
            const text = name || 'U';
            let hash = 0;
            for (let i = 0; i < text.length; i += 1) {
                hash = text.charCodeAt(i) + ((hash << 5) - hash);
            }
            return avatarTones[Math.abs(hash) % avatarTones.length];
        };

            if (!selectedGpuRef) return null;

            const server = servers.find((item) => String(item.id) === String(selectedGpuRef.serverId));
            if (!server) {
                return {
                    state: 'server_not_found',
                    server: null,
                    gpu: null,
                    gpuIndex: safeNumber(selectedGpuRef.gpuIndex)
                };
            }

            const gpus = Array.isArray(server.data?.gpus) ? server.data.gpus : [];
            const parsedIndex = Number(selectedGpuRef.gpuIndex);
            let gpuIndex = Number.isInteger(parsedIndex) ? parsedIndex : null;
            let gpu = gpuIndex !== null && gpuIndex >= 0 && gpuIndex < gpus.length ? gpus[gpuIndex] : null;

            const fallbackGpuId = safeNumber(selectedGpuRef.gpuId);
            if (!gpu && fallbackGpuId !== null) {
                const matchedIndex = gpus.findIndex((item) => safeNumber(item.id) === fallbackGpuId);
                if (matchedIndex >= 0) {
                    gpuIndex = matchedIndex;

            const fallbackGpuName = normalizeGpuName(selectedGpuRef.gpuName);

            const [isVisible, setIsVisible] = useState(false);

            const closeTimerRef = useRef(null);

            useEffect(() => {
                if (!isOpen) return undefined;
                previousFocusRef.current = document.activeElement;
                setIsClosing(false);
                setIsVisible(false);
                const frame = requestAnimationFrame(() => {
                    setIsVisible(true);
                    const explicitTarget = initialFocusRef && initialFocusRef.current ? initialFocusRef.current : null;
                    if (explicitTarget && typeof explicitTarget.focus === 'function') {
                        explicitTarget.focus();
                        return;
                    }
                    const fallback = dialogRef.current
                        ? dialogRef.current.querySelector('input:not([disabled]), textarea:not([disabled]), button:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])')
                        : null;
                    if (fallback && typeof fallback.focus === 'function') fallback.focus();
                    else if (dialogRef.current && typeof dialogRef.current.focus === 'function') dialogRef.current.focus();
                });
                const previousOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';

                return () => {
                    cancelAnimationFrame(frame);
                    document.body.style.overflow = previousOverflow;
                    if (closeTimerRef.current) {
                        clearTimeout(closeTimerRef.current);
                        closeTimerRef.current = null;
                    }
                    if (previousFocusRef.current && typeof previousFocusRef.current.focus === 'function') {

            const handleConfirm = async () => {
                if (isSubmitting) return;
                if (typeof config.beforeResolve === 'function') {
                    setIsSubmitting(true);
                    try {
                        const shouldClose = await config.beforeResolve(true);

                        onClick={handleConfirm}
                        disabled={isSubmitting}
                        className={cx(
                            'flex-1 px-4 py-2.5 text-sm font-medium rounded-full border transition-colors',
                            config.confirmTone === 'danger'
                                ? 'bg-[#392320] text-[#f8f4ed] border-[#392320] hover:bg-[#281714] hover:border-[#281714]'
                                : 'primary-button',
                            isSubmitting ? 'opacity-60 cursor-not-allowed' : ''
                        )}
                    >
                        {isSubmitting ? t('action.submitting') : (config.confirmText || t('action.confirm'))}
                    </button>
                </div>
            );

            return (
                <AppModal
                    isOpen={true}
                    onClose={() => onResolve(false)}
                    title={config.title || ''}
                    eyebrow={config.eyebrow || null}
                    closeTitle={t('action.close')}
                    widthClass={config.widthClass || 'max-w-md'}
                    closeOnEsc={config.closeOnEsc !== false}
                    closeOnBackdrop={config.closeOnBackdrop !== false}
                    disableClose={isSubmitting || config.disableClose}
                    footer={footer}
                >
                    {config.description ? <p className="text-sm text-[#6b665e] leading-relaxed">{config.description}</p> : null}
                </AppModal>
            );
        };

        const PromptDialog = ({ config, onResolve, t }) => {
            const inputRef = useRef(null);
            const [value, setValue] = useState('');
            const [error, setError] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                if (!config || config.type !== 'prompt') return;
                setValue(config.initialValue ?? '');
                setError('');
                setIsSubmitting(false);
            }, [config]);

            if (!config || config.type !== 'prompt') return null;

            const normalizeValue = (raw) => (config.trim === false ? raw : raw.trim());

            const validateInput = (candidate) => {
                if (config.required && !candidate) return config.requiredMessage || t('dialog.requiredField');
                if (typeof config.validate === 'function') {
                    const message = config.validate(candidate);
                    if (typeof message === 'string' && message) return message;
                }
                return '';
            };

            const handleSubmit = async () => {
                if (isSubmitting) return;
                const candidate = normalizeValue(value);
                const validationMessage = validateInput(candidate);
                if (validationMessage) {
                    setError(validationMessage);
                    return;
                }

                setError('');
                if (typeof config.beforeResolve === 'function') {
                    setIsSubmitting(true);
                    try {
                        const shouldClose = await config.beforeResolve(candidate);
                        if (shouldClose === false) return;
                    } catch (submitError) {
                        return;
                    } finally {
                        setIsSubmitting(false);
                    }
                }
                onResolve(candidate);
            };

            const footer = (
                <div className="flex gap-2.5">
                    <button
                        type="button"
                        onClick={() => onResolve(null)}
                        disabled={isSubmitting}
                        className={cx('muted-button flex-1 px-4 py-2.5 text-sm font-medium', isSubmitting ? 'opacity-60 cursor-not-allowed' : '')}
                    >
                        {config.cancelText || t('action.cancel')}
                    </button>
                    <button
                        type="button"
                        onClick={handleSubmit}
                        disabled={isSubmitting}
                        className={cx('primary-button flex-1 px-4 py-2.5 text-sm font-medium', isSubmitting ? 'opacity-60 cursor-not-allowed' : '')}
                    >
                        {isSubmitting ? t('action.submitting') : (config.confirmText || t('action.submit'))}
                    </button>
                </div>
            );

            return (
                <AppModal
                    isOpen={true}
                    onClose={() => onResolve(null)}
                    title={config.title || ''}
                    eyebrow={config.eyebrow || null}
                    closeTitle={t('action.close')}
                    widthClass={config.widthClass || 'max-w-md'}
                    closeOnEsc={config.closeOnEsc !== false}
                    closeOnBackdrop={config.closeOnBackdrop !== false}
                    disableClose={isSubmitting || config.disableClose}
                    initialFocusRef={inputRef}
                    footer={footer}
                >
                    <div className="space-y-3.5">
                        {config.description ? <p className="text-sm text-[#6b665e] leading-relaxed">{config.description}</p> : null}
                        <input
                            ref={inputRef}
                            type={config.inputType || 'text'}
                            inputMode={config.inputMode || undefined}
                            maxLength={config.maxLength || undefined}
                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors font-mono"
                            placeholder={config.placeholder || ''}
                            value={value}
                            disabled={isSubmitting}
                            onChange={(event) => {
                                setValue(event.target.value);
                                if (error) setError('');
                            }}
                            onKeyDown={(event) => {
                                if (event.key === 'Enter') {
                                    event.preventDefault();
                                    handleSubmit();
                                }
                            }}
                        />
                        {error ? <div className="text-sm text-[#8b4a42]">{error}</div> : null}
                    </div>
                </AppModal>
            );
        };

        const ToastStack = ({ toasts, onDismiss, t }) => {
            if (!Array.isArray(toasts) || toasts.length === 0) return null;

            const toneMap = {
                info: 'bg-[#f3eee6] border-[#d8cfc4] text-[#3c3833]',
                success: 'bg-[#e4efe9] border-[#c8ddd5] text-[#255049]',
                warning: 'bg-[#f1e7df] border-[#dfd0c5] text-[#5f4a42]',
                error: 'bg-[#f2e3df] border-[#dfc8c3] text-[#683833]',
            };

            return (
                <div className="fixed top-4 right-4 z-[80] w-[min(92vw,360px)] space-y-2 pointer-events-none">
                    {toasts.map((toast) => (
                        <div
                            key={toast.id}
                            className={cx(
                                'pointer-events-auto soft-panel-subtle border px-3.5 py-3 fade-enter shadow-[0_12px_24px_rgba(30,26,22,0.12)]',
                                toneMap[toast.tone] || toneMap.info
                            )}
                        >
                            <div className="flex items-start gap-2">
                                <div className="text-sm leading-relaxed flex-1">{toast.message}</div>
                                <button
                                    type="button"
                                    onClick={() => onDismiss(toast.id)}
                                    className="muted-button p-1.5 text-[#726b63]"
                                    aria-label={t('action.close')}
                                >
                                    <Icons.X className="w-3.5 h-3.5" />
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const GpuDetailModal = ({ selectedGpuRef, resolvedGpu, onClose, t }) => {
            if (!selectedGpuRef) return null;

            const state = resolvedGpu?.state || 'gpu_not_found';
            const serverName = resolvedGpu?.server?.name || '-';
            const gpu = state === 'ready' ? (resolvedGpu?.gpu || {}) : {};
            const gpuIndex = resolvedGpu?.gpuIndex !== null && resolvedGpu?.gpuIndex !== undefined
                ? resolvedGpu.gpuIndex
                : selectedGpuRef.gpuIndex;
            const fallbackName = typeof selectedGpuRef.gpuName === 'string' ? selectedGpuRef.gpuName.trim() : '';
            const rawName = (typeof gpu.name === 'string' && gpu.name.trim())
                ? gpu.name.trim()
                : (fallbackName || `GPU ${gpuIndex !== null && gpuIndex !== undefined ? gpuIndex : '-'}`);
            const temp = safeNumber(gpu.temperature);
            const utilizationRaw = safeNumber(gpu.utilization);
            const utilization = utilizationRaw !== null ? clampPercent(utilizationRaw) : null;
            const memoryUsed = safeNumber(gpu.memory_used);
            const memoryTotal = safeNumber(gpu.memory_total);
            const memoryPercentRaw = memoryTotal !== null && memoryTotal > 0 && memoryUsed !== null
                ? (memoryUsed / memoryTotal) * 100
                : safeNumber(gpu.memory_utilization);
            const memoryPercent = memoryPercentRaw !== null ? clampPercent(memoryPercentRaw) : null;
            const power = safeNumber(gpu.power_draw);
            const fanSpeed = safeNumber(gpu.fan_speed);
            const gpuID = safeNumber(gpu.id);

            const statusTextMap = {
                ready: t('common.online'),
                server_offline: t('gpu.modal.serverOffline'),
                no_data: t('gpu.modal.noData'),
                gpu_not_found: t('gpu.modal.gpuNotFound'),
                server_not_found: t('gpu.modal.serverNotFound'),
            };
            const statusToneMap = {
                ready: 'bg-[#e4efe9] border-[#c8ddd5] text-[#28544e]',
                server_offline: 'bg-[#f1e6df] border-[#ddcec4] text-[#664f46]',
                no_data: 'bg-[#efe9df] border-[#ddcfc3] text-[#63564c]',
                gpu_not_found: 'bg-[#efe9df] border-[#ddcfc3] text-[#63564c]',
                server_not_found: 'bg-[#f1e6df] border-[#ddcec4] text-[#664f46]',
            };
            const statusText = statusTextMap[state] || t('gpu.modal.gpuNotFound');

            const detailItems = [
                { label: t('gpu.modal.server'), value: serverName || '-' },
                { label: t('gpu.modal.status'), value: statusText },
                { label: t('gpu.modal.gpuIndex'), value: gpuIndex !== null && gpuIndex !== undefined ? gpuIndex : '-' },
                { label: t('gpu.modal.temperature'), value: temp !== null ? `${temp.toFixed(0)}C` : '-' },
                { label: t('gpu.modal.utilization'), value: utilization !== null ? `${utilization.toFixed(0)}%` : '-' },
                { label: t('gpu.modal.vramUsedTotal'), value: `${memoryUsed !== null ? memoryUsed.toFixed(1) : '-'} / ${memoryTotal !== null ? memoryTotal.toFixed(1) : '-'} GB` },
                { label: t('gpu.modal.vramUsage'), value: memoryPercent !== null ? `${memoryPercent.toFixed(1)}%` : '-' },
                { label: t('gpu.modal.powerDraw'), value: power !== null ? `${power.toFixed(0)}W` : '-' },
                { label: t('gpu.modal.fanSpeed'), value: fanSpeed !== null ? `${fanSpeed.toFixed(0)}%` : '-' },
                { label: t('gpu.modal.deviceId'), value: gpuID !== null ? gpuID : '-' },
            ];

            return (
                <AppModal
                    isOpen={true}
                    onClose={onClose}
                    title={rawName || '-'}
                    eyebrow={t('gpu.modal.eyebrow')}
                    closeTitle={t('gpu.modal.closeTitle')}
                    widthClass="max-w-xl"
                >
                    <div className="space-y-4">
                        <div className={cx('soft-panel-subtle p-3.5 border text-sm font-medium', statusToneMap[state] || statusToneMap.no_data)}>
                            {statusText}
                        </div>

                        <div className="soft-panel-subtle p-4">
                            <div className="text-[10px] uppercase tracking-[0.12em] text-[#837b72] font-semibold mb-2">{t('gpu.modal.summary')}</div>
                            <div className="flex flex-wrap gap-2">
                                <span className="px-2.5 py-1 rounded-full border border-[#d8cfc4] bg-[#efe7dc] text-[11px] font-mono text-[#615b54]">
                                    {t('gpu.modal.index')} {gpuIndex !== null && gpuIndex !== undefined ? gpuIndex : '-'}
                                </span>
                                <span className="px-2.5 py-1 rounded-full border border-[#d8cfc4] bg-[#ece7df] text-[11px] font-mono text-[#615b54]">
                                    {t('gpu.modal.util')} {utilization !== null ? `${utilization.toFixed(0)}%` : '-'}
                                </span>
                                <span className="px-2.5 py-1 rounded-full border border-[#d8cfc4] bg-[#ece7df] text-[11px] font-mono text-[#615b54]">
                                    {t('gpu.modal.temp')} {temp !== null ? `${temp.toFixed(0)}C` : '-'}
                                </span>
                            </div>
                        </div>

                        <div className="soft-panel-subtle p-4">
                            <div className="flex items-center justify-between text-[11px] text-[#6f685f] mb-1.5">
                                <span className="uppercase tracking-[0.08em]">{t('gpu.modal.vramUsage')}</span>
                                <span className="font-mono text-[#3e3934]">{memoryPercent !== null ? `${memoryPercent.toFixed(1)}%` : '-'}</span>
                            </div>
                            <MiniProgress value={memoryPercent !== null ? memoryPercent : 0} tone="muted" />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            {detailItems.map((item) => (
                                <div key={item.label} className="soft-panel-subtle p-3">
                                    <div className="text-[10px] uppercase tracking-[0.12em] text-[#877f76] font-semibold mb-1.5">{item.label}</div>
                                    <div className="text-sm font-mono text-[#2f2b28] break-words">{item.value}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </AppModal>
            );
        };

        const ServerCard = ({ server, onDelete, onSelectGpu, canManage, t }) => {
            const isOffline = server.status === 'offline';
            const data = server.data || {};
            const gpus = Array.isArray(data.gpus) ? data.gpus : [];
            const metrics = server.metrics || { upSpeed: 0, downSpeed: 0 };
            const totalPower = gpus.reduce((sum, gpu) => sum + (safeNumber(gpu.power_draw) || 0), 0);
            const ipOrHost = data.ip_address || (server.url ? server.url.replace('http://', '').replace('https://', '').split('/')[0] : '-');
            const isSingleGpu = gpus.length === 1;
            const gpuGridStyle = isSingleGpu
                ? { gridTemplateColumns: 'minmax(0, 1fr)' }
                : { gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))' };

            const statusTone = isOffline
                ? 'bg-[#ece2dd] text-[#705f57] border-[#ddcdc4]'
                : 'bg-[#dcebe8] text-[#2f6058] border-[#c8ddd8]';

            return (
                <article className="soft-panel p-4 md:p-5 h-full card-hover">
                    <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                            <div className="flex items-center gap-2 mb-1.5">
                                <h3 className="text-base font-semibold text-[#1e1c1a] truncate">{server.name}</h3>
                                <span className={cx('px-2 py-1 rounded-full border text-[10px] uppercase tracking-[0.08em] font-semibold', statusTone)}>
                                    {isOffline ? t('common.offline') : t('common.online')}
                                </span>
                            </div>
                            <div className="text-[11px] font-mono text-[#746e66] break-all">{ipOrHost}</div>
                        </div>
                        {canManage ? (
                            <button
                                onClick={() => onDelete(server)}
                                className="muted-button p-2 text-[#746d64] hover:text-[#3d3732]"
                                title={t('action.deleteNode')}
                            >
                                <Icons.Trash2 className="w-4 h-4" />
                            </button>
                        ) : null}
                    </div>

                    <div className="grid grid-cols-2 xl:grid-cols-4 gap-2.5 mt-4">
                        <ServerMetricTile
                            label={t('metric.cpu')}
                            value={safeNumber(data.cpu_usage) !== null ? `${Number(data.cpu_usage).toFixed(1)}%` : '-'}
                            sub={safeNumber(data.cpu_cores) !== null ? `${Number(data.cpu_cores).toFixed(0)} ${t('metric.cores')}` : '-'}
                            icon={Icons.Cpu}
                        />
                        <ServerMetricTile
                            label={t('metric.ram')}
                            value={safeNumber(data.ram_percent) !== null ? `${Number(data.ram_percent).toFixed(1)}%` : '-'}
                            sub={safeNumber(data.ram_used) !== null ? `${Number(data.ram_used).toFixed(1)} ${t('metric.gbUsed')}` : '-'}
                            icon={Icons.HardDrive}
                        />
                        <ServerMetricTile
                            label={t('metric.net')}
                            value={`${formatSpeed(metrics.downSpeed)}`}
                            sub={`${t('metric.up')} ${formatSpeed(metrics.upSpeed)}`}
                            icon={Icons.Activity}
                        />
                        <ServerMetricTile
                            label={t('metric.pwr')}
                            value={isOffline ? '-' : `${totalPower.toFixed(0)}W`}
                            sub={`${gpus.length} ${t('metric.gpuUnit')}`}
                            icon={Icons.Zap}
                        />
                    </div>

                    <div className="mt-4">
                        {isOffline ? (
                            <div className="soft-panel-subtle p-4 text-sm text-[#736c63]">
                                {t('empty.nodeUnreachable')}
                            </div>
                        ) : gpus.length === 0 ? (
                            <div className="soft-panel-subtle p-4 text-sm text-[#736c63]">{t('empty.noGpuData')}</div>
                        ) : (
                            <div className="grid gap-3" style={gpuGridStyle}>
                                {gpus.map((gpu, idx) => (
                                    <GpuMiniCard
                                        key={idx}
                                        gpu={gpu}
                                        index={idx}
                                        layoutMode={isSingleGpu ? 'single' : 'compact'}
                                        t={t}
                                        onSelect={(gpuData, gpuIndex) => onSelectGpu(server.id, gpuIndex, gpuData)}
                                    />
                                ))}
                            </div>
                        )}
                    </div>
                </article>
            );
        };

        const ActivityDrawer = ({ isOpen, onClose, processes, t }) => {
            const users = useMemo(() => {
                const map = {};
                processes.forEach((proc) => {
                    const name = proc.user || proc.username || t('misc.unknown');
                    if (!map[name]) map[name] = { name, processes: [], totalVram: 0, gpuCount: 0 };
                    map[name].processes.push(proc);
                    map[name].totalVram += (safeNumber(proc.vram_used_mb) || 0);
                    if (proc.gpu_index !== null && (safeNumber(proc.vram_used_mb) || 0) > 0) map[name].gpuCount += 1;
                });
                const thresholdMb = 0.1 * 1024;
                return Object.values(map)
                    .filter((u) => u.totalVram >= thresholdMb)
                    .sort((a, b) => b.totalVram - a.totalVram);
            }, [processes, t]);

            const [expandedUser, setExpandedUser] = useState(null);
            if (!isOpen) return null;

            return (
                <>
                    <div className="fixed inset-0 z-50 bg-[#2f2922]/18 backdrop-blur-[2px] fade-enter" onClick={onClose} />
                    <aside className="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-[#f7f4ef] border-l border-[rgba(60,47,35,0.1)] shadow-[0_18px_50px_rgba(30,26,22,0.16)] drawer-enter flex flex-col">
                        <div className="px-5 py-4 border-b border-[rgba(60,47,35,0.08)] flex items-center justify-between">
                            <div>
                                <div className="section-eyebrow mb-1">{t('drawer.eyebrow')}</div>
                                <h3 className="text-lg font-semibold text-[#1d1a18]">{t('drawer.title')}</h3>
                            </div>
                            <button onClick={onClose} className="muted-button p-2 text-[#6f685f]" title={t('action.close')}>
                                <Icons.X className="w-4 h-4" />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar px-4 py-4">
                            {users.length === 0 ? (
                                <div className="soft-panel-subtle p-6 text-center text-[#6f685f] text-sm">{t('empty.noActiveGpuUsers')}</div>
                            ) : (
                                <div className="space-y-3">
                                    <div className="text-[11px] text-[#7a736a]">{t('drawer.thresholdNote')}</div>
                                    {users.map((user, idx) => {
                                        const isExpanded = expandedUser === user.name;
                                        return (
                                            <div key={user.name} className="soft-panel-subtle overflow-hidden">
                                                <button
                                                    className="w-full text-left px-3.5 py-3 flex items-center gap-3"
                                                    onClick={() => setExpandedUser(isExpanded ? null : user.name)}
                                                >
                                                    <div className={cx('w-9 h-9 rounded-full text-sm font-semibold flex items-center justify-center', toneFromName(user.name))}>
                                                        {String(user.name || 'U').slice(0, 1).toUpperCase()}
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center justify-between gap-2">
                                                            <div className="truncate text-sm font-semibold text-[#2a2724]">{user.name}</div>
                                                            <div className="text-[10px] font-mono text-[#746d64]">#{idx + 1}</div>
                                                        </div>
                                                        <div className="mt-1 flex items-center gap-2 text-[10px] text-[#756e66]">
                                                            <span className="px-1.5 py-0.5 rounded-full border border-[#d8cfc4] bg-[#efe7dc]">{(user.totalVram / 1024).toFixed(1)} GB</span>
                                                            <span className="px-1.5 py-0.5 rounded-full border border-[#d8cfc4] bg-[#ece7df]">{user.gpuCount} {t('metric.gpuUnit')}</span>
                                                        </div>
                                                    </div>
                                                    <Icons.ChevronDown className={cx('w-4 h-4 text-[#80786f] transition-transform', isExpanded ? 'rotate-180' : '')} />
                                                </button>

                                                {isExpanded ? (
                                                    <div className="px-3 pb-3 space-y-2.5 border-t border-[rgba(60,47,35,0.06)]">
                                                        {user.processes.map((proc, i) => (
                                                            <div key={i} className="mt-3 soft-panel-subtle p-3">
                                                                <div className="grid grid-cols-2 gap-2 text-[11px]">
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">{t('drawer.server')}</div>
                                                                        <div className="font-semibold text-[#2c2926]">{proc.serverName || '-'}</div>
                                                                    </div>
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">{t('drawer.gpuIndex')}</div>
                                                                        <div className="font-mono text-[#2c2926]">{proc.gpu_index !== null && proc.gpu_index !== undefined ? proc.gpu_index : '-'}</div>
                                                                    </div>
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">{t('drawer.pid')}</div>
                                                                        <div className="font-mono text-[#2c2926]">{proc.pid || '-'}</div>
                                                                    </div>
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">{t('drawer.vram')}</div>
                                                                        <div className="font-mono text-[#2c2926]">{safeNumber(proc.vram_used_mb) !== null ? `${(Number(proc.vram_used_mb) / 1024).toFixed(2)} GB` : '-'}</div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : null}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </aside>
                </>
            );
        };

        const ACTIVE_USER_VRAM_THRESHOLD_MB = 0.1 * 1024;
        const SYSTEM_USER_BLACKLIST = new Set(['root', 'gdm']);
        const GPU_BUSY_UTIL_THRESHOLD = 55;
        const GPU_BUSY_VRAM_THRESHOLD = 60;
        const GPU_LIGHT_UTIL_THRESHOLD = 20;
        const GPU_LIGHT_VRAM_THRESHOLD = 25;
        const DATA_STALE_WARNING_SEC = 8;
        const DATA_STALE_CRITICAL_SEC = 18;

        const getServerGpus = (server) => (Array.isArray(server?.data?.gpus) ? server.data.gpus : []);
        const getServerProcesses = (server) => (Array.isArray(server?.data?.processes) ? server.data.processes : []);

        const getServerHostDisplay = (server) => {
            const ip = server?.data?.ip_address;
            if (typeof ip === 'string' && ip.trim()) return ip.trim();
            const rawUrl = String(server?.url || '').trim();
            if (!rawUrl) return '-';
            return rawUrl.replace(/^https?:\/\//, '').split('/')[0] || rawUrl;
        };

        const resolveProcessUser = (proc) => {
            const raw = (proc?.user ?? proc?.username ?? '').toString().trim();
            return raw || '';
        };

        const isActiveGpuProcess = (proc) => {
            const user = resolveProcessUser(proc).toLowerCase();
            if (SYSTEM_USER_BLACKLIST.has(user)) return false;
            const gpuIndex = safeNumber(proc?.gpu_index);
            const vramUsedMb = safeNumber(proc?.vram_used_mb) || 0;
            return gpuIndex !== null && vramUsedMb >= ACTIVE_USER_VRAM_THRESHOLD_MB;
        };

        const getServerGpuProcessIndexes = (server) => {
            const indexes = new Set();
            getServerProcesses(server).forEach((proc) => {
                if (!isActiveGpuProcess(proc)) return;
                const idx = safeNumber(proc?.gpu_index);
                if (idx !== null) indexes.add(Math.round(idx));
            });
            return indexes;
        };

        const getServerActiveUsers = (server) => {
            const users = new Set();
            getServerProcesses(server).forEach((proc) => {
                if (!isActiveGpuProcess(proc)) return;
                const user = resolveProcessUser(proc);
                if (!user) return;
                users.add(user);
            });
            return Array.from(users);
        };

        const getServerGpuSummary = (server) => {
            const gpus = getServerGpus(server);
            const activeGpuIndexes = getServerGpuProcessIndexes(server);
            if (gpus.length === 0) {
                return {
                    gpuCount: 0,
                    busyGpuCount: 0,
                    idleGpuCount: 0,
                    avgUtilization: null,
                    avgMemoryPercent: null,
                    totalMemoryUsed: 0,
                    totalMemory: 0,
                    totalPower: 0,
                    gpuPressure: 0,
                    busyRatio: 0,
                };
            }

            let utilTotal = 0;
            let utilCount = 0;
            let vramPercentTotal = 0;
            let vramPercentCount = 0;
            let totalMemoryUsed = 0;
            let totalMemory = 0;
            let totalPower = 0;
            let busyGpuCount = 0;

            gpus.forEach((gpu, idx) => {
                const utilization = safeNumber(gpu.utilization);
                const memoryUsed = safeNumber(gpu.memory_used);
                const memoryTotal = safeNumber(gpu.memory_total);
                const memoryPercent = memoryTotal !== null && memoryTotal > 0 && memoryUsed !== null
                    ? clampPercent((memoryUsed / memoryTotal) * 100)
                    : safeNumber(gpu.memory_utilization);
                const hasActiveProcess = activeGpuIndexes.has(idx);
                const power = safeNumber(gpu.power_draw);

                if (utilization !== null) {
                    utilTotal += utilization;
                    utilCount += 1;
                }
                if (memoryPercent !== null) {
                    vramPercentTotal += memoryPercent;
                    vramPercentCount += 1;
                }
                if (memoryUsed !== null) totalMemoryUsed += memoryUsed;
                if (memoryTotal !== null) totalMemory += memoryTotal;
                if (power !== null) totalPower += power;

                const utilValue = utilization !== null ? utilization : 0;
                const vramValue = memoryPercent !== null ? memoryPercent : 0;
                const isBusy = utilValue >= GPU_BUSY_UTIL_THRESHOLD
                    || vramValue >= GPU_BUSY_VRAM_THRESHOLD
                    || hasActiveProcess;
                if (isBusy) busyGpuCount += 1;
            });

            const idleGpuCount = Math.max(0, gpus.length - busyGpuCount);
            const avgUtilization = utilCount > 0 ? utilTotal / utilCount : null;
            const avgMemoryPercent = vramPercentCount > 0 ? vramPercentTotal / vramPercentCount : null;
            const gpuPressure = clampPercent(((avgUtilization ?? 0) * 0.6) + ((avgMemoryPercent ?? 0) * 0.4));
            const busyRatio = gpus.length > 0 ? busyGpuCount / gpus.length : 0;

            return {
                gpuCount: gpus.length,
                busyGpuCount,
                idleGpuCount,
                avgUtilization,
                avgMemoryPercent,
                totalMemoryUsed,
                totalMemory,
                totalPower,
                gpuPressure,
                busyRatio,
            };
        };

        const getIdleGpuCount = (server) => getServerGpuSummary(server).idleGpuCount;
        const getBusyGpuCount = (server) => getServerGpuSummary(server).busyGpuCount;

        const computeDataAgeSeconds = (server, nowMs = Date.now()) => {
            const ts = safeNumber(server?.lastSeenAt);
            if (ts === null || ts <= 0) return Number.POSITIVE_INFINITY;
            return Math.max(0, (nowMs - ts) / 1000);
        };

        const computeAvailabilityScore = (server, nowMs = Date.now()) => {
            if (!server || server.status !== 'online') return 0;

            const activeUsers = getServerActiveUsers(server).length;
            const cpu = safeNumber(server?.data?.cpu_usage);
            const ram = safeNumber(server?.data?.ram_percent);
            const gpuSummary = getServerGpuSummary(server);
            const ageSec = computeDataAgeSeconds(server, nowMs);
            const avgPowerPerGpu = gpuSummary.gpuCount > 0 ? (gpuSummary.totalPower / gpuSummary.gpuCount) : 0;

            let score = 100;
            score -= Math.min(30, activeUsers * 8);
            score -= cpu !== null ? Math.min(24, cpu * 0.24) : 6;
            score -= ram !== null ? Math.min(20, ram * 0.2) : 6;
            score -= Math.min(22, gpuSummary.gpuPressure * 0.22);
            score -= Math.min(16, gpuSummary.busyRatio * 16);
            score -= Math.min(10, avgPowerPerGpu * 0.08);
            score += Math.min(12, gpuSummary.idleGpuCount * 3);
            if (gpuSummary.gpuCount === 0) score -= 8;
            if (ageSec > DATA_STALE_CRITICAL_SEC) score -= 18;
            else if (ageSec > DATA_STALE_WARNING_SEC) score -= 8;

            return Math.max(0, Math.min(100, Math.round(score)));
        };

        const getAvailabilityTier = (score, server) => {
            if (!server || server.status !== 'online') return 'offline';
            if (score >= 80) return 'highlyAvailable';
            if (score >= 60) return 'available';
            if (score >= 35) return 'busy';
            return 'saturated';
        };

        const sortServersByAvailability = (servers, nowMs = Date.now()) => [...servers].sort((a, b) => {
            const aOnline = a.status === 'online' ? 1 : 0;
            const bOnline = b.status === 'online' ? 1 : 0;
            if (aOnline !== bOnline) return bOnline - aOnline;
            const aScore = Number.isFinite(a.availabilityScore) ? a.availabilityScore : computeAvailabilityScore(a, nowMs);
            const bScore = Number.isFinite(b.availabilityScore) ? b.availabilityScore : computeAvailabilityScore(b, nowMs);
            if (aScore !== bScore) return bScore - aScore;
            return String(a.name || '').localeCompare(String(b.name || ''));
        });

        const sortServersForMode = (servers, mode) => {
            const onlineRank = (item) => (item.status === 'online' ? 0 : 1);
            if (mode === 'availability') return sortServersByAvailability(servers);

            const list = [...servers];
            if (mode === 'name') {
                return list.sort((a, b) => {
                    const rankDiff = onlineRank(a) - onlineRank(b);
                    if (rankDiff !== 0) return rankDiff;
                    return String(a.name || '').localeCompare(String(b.name || ''));
                });
            }

            if (mode === 'cpu') {
                return list.sort((a, b) => {
                    const rankDiff = onlineRank(a) - onlineRank(b);
                    if (rankDiff !== 0) return rankDiff;
                    const aCpu = safeNumber(a?.data?.cpu_usage);
                    const bCpu = safeNumber(b?.data?.cpu_usage);
                    if (aCpu === null && bCpu === null) return String(a.name || '').localeCompare(String(b.name || ''));
                    if (aCpu === null) return 1;
                    if (bCpu === null) return -1;
                    return aCpu - bCpu;
                });
            }

            if (mode === 'users') {
                return list.sort((a, b) => {
                    const rankDiff = onlineRank(a) - onlineRank(b);
                    if (rankDiff !== 0) return rankDiff;
                    const aUsers = Number(a.activeUserCount || 0);
                    const bUsers = Number(b.activeUserCount || 0);
                    if (aUsers !== bUsers) return aUsers - bUsers;
                    return String(a.name || '').localeCompare(String(b.name || ''));
                });
            }

            return list;
        };

        const formatAgeShort = (seconds, t) => {
            if (!Number.isFinite(seconds)) return t('node.na');
            if (seconds < 1) return '<1s';
            if (seconds < 60) return `${Math.round(seconds)}s`;
            const mins = Math.floor(seconds / 60);
            const secs = Math.round(seconds % 60);
            if (mins < 60) return `${mins}m ${secs}s`;
            const hours = Math.floor(mins / 60);
            return `${hours}h ${mins % 60}m`;
        };

        const buildServerTopUsers = (server, t) => {
            const map = {};
            getServerProcesses(server).forEach((proc) => {
                if (!isActiveGpuProcess(proc)) return;
                const name = resolveProcessUser(proc) || t('misc.unknown');
                if (!map[name]) map[name] = { name, vramMb: 0, procCount: 0 };
                map[name].vramMb += (safeNumber(proc?.vram_used_mb) || 0);
                map[name].procCount += 1;
            });
            return Object.values(map)
                .sort((a, b) => b.vramMb - a.vramMb)
                .slice(0, 8);
        };

        const resolveGpuLoadTier = (gpu, index, activeGpuIndexes) => {
            const utilization = safeNumber(gpu?.utilization) ?? 0;
            const memoryUsed = safeNumber(gpu?.memory_used);
            const memoryTotal = safeNumber(gpu?.memory_total);
            const memoryPercent = memoryTotal !== null && memoryTotal > 0 && memoryUsed !== null
                ? clampPercent((memoryUsed / memoryTotal) * 100)
                : (safeNumber(gpu?.memory_utilization) ?? 0);
            const hasActiveProcess = activeGpuIndexes.has(index);

            if (utilization >= 90 || memoryPercent >= 92) return 'full';
            if (utilization >= GPU_BUSY_UTIL_THRESHOLD || memoryPercent >= GPU_BUSY_VRAM_THRESHOLD || hasActiveProcess) return 'busy';
            if (utilization >= GPU_LIGHT_UTIL_THRESHOLD || memoryPercent >= GPU_LIGHT_VRAM_THRESHOLD) return 'light';
            return 'idle';
        };

        const SORT_MODE_OPTIONS = [
            { value: 'availability', labelKey: 'panel.sortAvailability' },
            { value: 'name', labelKey: 'panel.sortName' },
            { value: 'cpu', labelKey: 'panel.sortCpu' },
            { value: 'users', labelKey: 'panel.sortUsers' },
        ];

        const NodeKpiTile = ({ label, value, sub, icon: Icon }) => (
            <div className="soft-panel-subtle p-3.5">
                <div className="flex items-center justify-between mb-2">
                    <div className="text-[10px] uppercase tracking-[0.13em] text-[#847d73] font-semibold">{label}</div>
                    {Icon ? <Icon className="w-3.5 h-3.5 text-[#8f877d]" /> : null}
                </div>
                <div className="text-lg font-semibold text-[#201d1a]">{value}</div>
                <div className="text-[11px] text-[#6d665d] mt-1">{sub}</div>
            </div>
        );

        const SortSelect = ({ value, onChange, options, t }) => {
            const rootRef = useRef(null);
            const buttonRef = useRef(null);
            const listRef = useRef(null);
            const listIdRef = useRef(`sort-listbox-${Math.random().toString(16).slice(2)}`);
            const [isOpen, setIsOpen] = useState(false);
            const [highlightedIndex, setHighlightedIndex] = useState(0);

            const selectedIndex = Math.max(0, options.findIndex((item) => item.value === value));
            const selectedOption = options[selectedIndex] || options[0];

            const openMenu = (nextIndex = selectedIndex) => {
                const safeIndex = Math.max(0, Math.min(options.length - 1, nextIndex));
                setHighlightedIndex(safeIndex);
                setIsOpen(true);
            };

            const closeMenu = () => {
                setIsOpen(false);
            };

            const selectIndex = (index) => {
                const option = options[index];
                if (!option) return;
                onChange(option.value);
                closeMenu();
                requestAnimationFrame(() => {
                    if (buttonRef.current) buttonRef.current.focus();
                });
            };

            useEffect(() => {
                if (!isOpen) return;
                setHighlightedIndex(selectedIndex);
            }, [isOpen, selectedIndex]);

            useEffect(() => {
                if (!isOpen) return;
                const handlePointerDown = (event) => {
                    if (!rootRef.current) return;
                    if (!rootRef.current.contains(event.target)) closeMenu();
                };
                document.addEventListener('mousedown', handlePointerDown);
                document.addEventListener('touchstart', handlePointerDown);
                return () => {
                    document.removeEventListener('mousedown', handlePointerDown);
                    document.removeEventListener('touchstart', handlePointerDown);
                };
            }, [isOpen]);

            useEffect(() => {
                if (!isOpen) return;
                const rafId = requestAnimationFrame(() => {
                    if (listRef.current) listRef.current.focus();
                });
                return () => cancelAnimationFrame(rafId);
            }, [isOpen]);

            const handleButtonKeyDown = (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    if (isOpen) selectIndex(highlightedIndex);
                    else openMenu(selectedIndex);
                    return;
                }
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    openMenu(isOpen ? highlightedIndex + 1 : selectedIndex);
                    return;
                }
                if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    openMenu(isOpen ? highlightedIndex - 1 : selectedIndex);
                    return;
                }
                if (event.key === 'Escape' && isOpen) {
                    event.preventDefault();
                    closeMenu();
                }
            };

            const handleListKeyDown = (event) => {
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    setHighlightedIndex((prev) => (prev + 1) % options.length);
                    return;
                }
                if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    setHighlightedIndex((prev) => (prev - 1 + options.length) % options.length);
                    return;
                }
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    selectIndex(highlightedIndex);
                    return;
                }
                if (event.key === 'Escape') {
                    event.preventDefault();
                    closeMenu();
                    if (buttonRef.current) buttonRef.current.focus();
                    return;
                }
                if (event.key === 'Tab') closeMenu();
            };

            return (
                <div ref={rootRef} className="relative flex-1 min-w-0">
                    <button
                        type="button"
                        ref={buttonRef}
                        aria-label={t('panel.sortLabel')}
                        aria-haspopup="listbox"
                        aria-expanded={isOpen}
                        aria-controls={listIdRef.current}
                        onClick={() => (isOpen ? closeMenu() : openMenu(selectedIndex))}
                        onKeyDown={handleButtonKeyDown}
                        className={cx(
                            'w-full bg-[#fbf8f3] border rounded-2xl px-3.5 py-2.5 text-sm text-[#2b2723] transition-all duration-150',
                            'outline-none flex items-center justify-between gap-2 shadow-[0_1px_1px_rgba(0,0,0,0.02)]',
                            'hover:border-[rgba(60,47,35,0.18)] hover:bg-[#fcfaf6] hover:shadow-[0_2px_6px_rgba(40,35,30,0.06)]',
                            isOpen
                                ? 'border-[rgba(95,145,137,0.32)] ring-2 ring-[rgba(95,145,137,0.14)] bg-[#fcfaf6]'
                                : 'border-[rgba(60,47,35,0.1)]',
                            'focus-visible:border-[rgba(95,145,137,0.38)] focus-visible:ring-2 focus-visible:ring-[rgba(95,145,137,0.16)]'
                        )}
                    >
                        <span className="truncate">{t(selectedOption.labelKey)}</span>
                        <Icons.ChevronDown className={cx('w-4 h-4 text-[#857d73] transition-transform', isOpen ? 'rotate-180' : '')} />
                    </button>

                    {isOpen ? (
                        <div
                            id={listIdRef.current}
                            ref={listRef}
                            role="listbox"
                            tabIndex={-1}
                            onKeyDown={handleListKeyDown}
                            className="absolute left-0 right-0 top-[calc(100%+6px)] z-40 p-1.5 soft-panel-subtle border-[rgba(60,47,35,0.12)] rounded-2xl shadow-[0_14px_26px_rgba(34,29,24,0.12)]"
                        >
                            {options.map((option, idx) => {
                                const isSelected = option.value === value;
                                const isHighlighted = idx === highlightedIndex;
                                return (
                                    <button
                                        key={option.value}
                                        type="button"
                                        role="option"
                                        aria-selected={isSelected}
                                        onMouseEnter={() => setHighlightedIndex(idx)}
                                        onClick={() => selectIndex(idx)}
                                        className={cx(
                                            'w-full text-left px-3 py-2.5 rounded-xl text-sm transition-colors duration-120 border',
                                            isSelected
                                                ? 'bg-[#e5efe9] border-[rgba(95,145,137,0.24)] text-[#2f5d56]'
                                                : isHighlighted
                                                    ? 'bg-[#f1ece4] border-transparent text-[#2f2b27]'
                                                    : 'bg-transparent border-transparent text-[#3a3530] hover:bg-[#f1ece4]'
                                        )}
                                    >
                                        {t(option.labelKey)}
                                    </button>
                                );
                            })}
                        </div>
                    ) : null}
                </div>
            );
        };

        const NodeListToolbar = ({ query, onQueryChange, sortMode, onSortModeChange, t }) => (
            <div className="space-y-2.5">
                <input
                    type="text"
                    value={query}
                    onChange={(event) => onQueryChange(event.target.value)}
                    className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-3.5 py-2.5 text-sm text-[#1f1d1b] outline-none transition-all duration-150 hover:border-[rgba(60,47,35,0.16)] focus:border-[rgba(95,145,137,0.36)] focus:ring-2 focus:ring-[rgba(95,145,137,0.14)]"
                    placeholder={t('panel.searchPlaceholder')}
                />
                <div className="flex items-center gap-2">
                    <SortSelect
                        value={sortMode}
                        onChange={onSortModeChange}
                        options={SORT_MODE_OPTIONS}
                        t={t}
                    />
                    {query ? (
                        <button type="button" className="muted-button px-3 py-2 text-xs font-medium" onClick={() => onQueryChange('')}>
                            {t('action.clearFilter')}
                        </button>
                    ) : null}
                </div>
                <div className="text-[11px] text-[#746d64]">
                    <span className="font-semibold">{sortMode === 'availability' ? t('panel.sortedByAvailability') : `${t('panel.sortLabel')}: ${t(`panel.sort${sortMode.charAt(0).toUpperCase()}${sortMode.slice(1)}`)}`}</span>
                    {sortMode === 'availability' ? <span className="ml-1">{t('panel.bestNodesFirst')}</span> : null}
                </div>
            </div>
        );

        const NodeListItem = ({ server, isSelected, onSelect, onDelete, canManage, t }) => {
            const tierToneMap = {
                highlyAvailable: 'bg-[#dcefe5] text-[#2f655a] border-[#c8dfd4]',
                available: 'bg-[#deece8] text-[#345f59] border-[#cadfd9]',
                busy: 'bg-[#f0e9dd] text-[#6c5a3f] border-[#e0d2bc]',
                saturated: 'bg-[#f2e1de] text-[#7a4740] border-[#e3c9c4]',
                offline: 'bg-[#ebe5dc] text-[#6e665d] border-[#dad0c4]',
            };
            const barToneMap = {
                highlyAvailable: 'bg-[#4f8f82]',
                available: 'bg-[#5f9189]',
                busy: 'bg-[#b38b54]',
                saturated: 'bg-[#ad6158]',
                offline: 'bg-[#9a948b]',
            };

            const tier = server.availabilityTier || 'offline';
            const tierLabel = t(`availability.${tier}`);
            const cpuText = server.cpuPercent !== null ? `${server.cpuPercent.toFixed(1)}%` : t('node.na');
            const ramText = server.ramPercent !== null ? `${server.ramPercent.toFixed(1)}%` : t('node.na');
            const avgGpuText = server.gpuSummary.avgUtilization !== null ? `${server.gpuSummary.avgUtilization.toFixed(1)}%` : t('node.na');
            const vramText = `${server.gpuSummary.totalMemoryUsed.toFixed(1)} / ${server.gpuSummary.totalMemory.toFixed(1)} GB`;

            return (
                <article
                    className={cx(
                        'soft-panel-subtle p-3 border card-hover cursor-pointer',
                        server.status !== 'online' ? 'opacity-80' : '',
                        isSelected ? 'border-[#5f9189] shadow-[0_8px_24px_rgba(95,145,137,0.18)]' : 'border-[rgba(60,47,35,0.1)]'
                    )}
                    onClick={() => onSelect(server)}
                >
                    <div className="flex items-start justify-between gap-2">
                        <div className="min-w-0">
                            <div className="flex items-center gap-2">
                                <span className={cx('w-2 h-2 rounded-full', server.status === 'online' ? 'bg-[#5f9189]' : 'bg-[#a39a8f]')} />
                                <h3 className="text-sm font-semibold text-[#221f1b] truncate">{server.name || '-'}</h3>
                            </div>
                            <div className="text-[11px] text-[#7a7269] mt-1 truncate">{getServerHostDisplay(server)}</div>
                        </div>
                        <div className="flex items-start gap-1.5">
                            <span className={cx('px-2 py-1 rounded-full border text-[10px] font-semibold whitespace-nowrap', tierToneMap[tier] || tierToneMap.offline)}>
                                {tierLabel}
                            </span>
                            {canManage ? (
                                <button
                                    type="button"
                                    onClick={(event) => {
                                        event.stopPropagation();
                                        onDelete(server);
                                    }}
                                    className="muted-button p-1.5 text-[#746d64]"
                                    title={t('action.deleteNode')}
                                >
                                    <Icons.Trash2 className="w-3.5 h-3.5" />
                                </button>
                            ) : null}
                        </div>
                    </div>

                    <div className="grid grid-cols-4 gap-1.5 mt-2.5 text-[10px] text-[#6e675e]">
                        <div className="soft-panel-subtle border border-[rgba(60,47,35,0.08)] rounded-lg px-2 py-1.5">
                            <div className="uppercase tracking-[0.08em]">{t('node.users')}</div>
                            <div className="font-semibold text-[#2d2a26] mt-0.5">{server.activeUserCount}</div>
                        </div>
                        <div className="soft-panel-subtle border border-[rgba(60,47,35,0.08)] rounded-lg px-2 py-1.5">
                            <div className="uppercase tracking-[0.08em]">{t('node.gpuCount')}</div>
                            <div className="font-semibold text-[#2d2a26] mt-0.5">{server.gpuSummary.gpuCount}</div>
                        </div>
                        <div className="soft-panel-subtle border border-[rgba(60,47,35,0.08)] rounded-lg px-2 py-1.5">
                            <div className="uppercase tracking-[0.08em]">{t('node.idleGpu')}</div>
                            <div className="font-semibold text-[#2d2a26] mt-0.5">{server.gpuSummary.idleGpuCount}</div>
                        </div>
                        <div className="soft-panel-subtle border border-[rgba(60,47,35,0.08)] rounded-lg px-2 py-1.5">
                            <div className="uppercase tracking-[0.08em]">{t('node.busyGpu')}</div>
                            <div className="font-semibold text-[#2d2a26] mt-0.5">{server.gpuSummary.busyGpuCount}</div>
                        </div>
                    </div>

                    <div className="mt-2.5 text-[11px] text-[#6f685f] space-y-1">
                        <div className="flex items-center justify-between">
                            <span>CPU {cpuText}</span>
                            <span>RAM {ramText}</span>
                            <span>{t('node.avgGpu')} {avgGpuText}</span>
                        </div>
                        <div className="flex items-center justify-between">
                            <span>{t('node.vram')} {vramText}</span>
                            <span className="font-mono">↓ {formatSpeed(server.networkDown)} / ↑ {formatSpeed(server.networkUp)}</span>
                        </div>
                    </div>

                    <div className="mt-2.5">
                        <div className="flex items-center justify-between text-[10px] text-[#746d64] mb-1">
                            <span>{t('availability.score')}</span>
                            <span className="font-mono">{server.availabilityScore}</span>
                        </div>
                        <div className="w-full h-1.5 rounded-full bg-[#e4ded3] overflow-hidden">
                            <div
                                className={cx('h-full rounded-full transition-all duration-400', barToneMap[tier] || barToneMap.offline)}
                                style={{ width: `${clampPercent(server.availabilityScore)}%` }}
                            />
                        </div>
                        <div className="text-[10px] text-[#7c756c] mt-1 flex items-center justify-between">
                            <span>{t('node.lastSync')}</span>
                            <span>{server.lastSeenAt ? formatTime(new Date(server.lastSeenAt)) : t('node.na')}</span>
                        </div>
                    </div>
                </article>
            );
        };

        const NodeHeroCard = ({ server, t }) => {
            if (!server) return null;
            const statusTone = server.status === 'online'
                ? 'bg-[#dcefe5] text-[#2f655a] border-[#c8dfd4]'
                : 'bg-[#ebe5dc] text-[#6e665d] border-[#dad0c4]';
            const tier = server.availabilityTier || 'offline';
            const tierLabel = t(`availability.${tier}`);

            return (
                <section className="soft-panel p-5">
                    <div className="flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
                        <div>
                            <div className="section-eyebrow mb-1">{t('detail.nodeHeroEyebrow')}</div>
                            <h2 className="text-2xl font-semibold tracking-tight text-[#1f1c19]">{server.name || '-'}</h2>
                            <div className="text-sm text-[#6d665d] mt-1 font-mono">{getServerHostDisplay(server)}</div>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <span className={cx('px-3 py-1.5 rounded-full border text-xs font-semibold', statusTone)}>

        const InlineGpuDetailPanel = ({ selectedGpuRef, resolvedGpu, onClear, t }) => {

                        <div className="soft-panel-subtle p-2.5 border border-[rgba(60,47,35,0.08)]">
                            <div className="text-[10px] uppercase tracking-[0.11em] text-[#847c72]">{t('gpu.modal.utilization')}</div>
                            <div className="text-sm font-semibold text-[#26231f] mt-1">{utilization !== null ? `${utilization.toFixed(1)}%` : t('node.na')}</div>

                            <div className="text-[10px] uppercase tracking-[0.11em] text-[#847c72]">{t('gpu.modal.vramUsedTotal')}</div>
                            <div className="text-sm font-semibold text-[#26231f] mt-1">{memoryUsed !== null ? memoryUsed.toFixed(1) : t('node.na')} / {memoryTotal !== null ? memoryTotal.toFixed(1) : t('node.na')} GB</div>
                        </div>
                        <div className="soft-panel-subtle p-2.5 border border-[rgba(60,47,35,0.08)]">

                        <div className="soft-panel-subtle p-2.5 border border-[rgba(60,47,35,0.08)]">

                            <div className="text-sm font-semibold text-[#26231f] mt-1">{power !== null ? `${power.toFixed(0)}W` : t('node.na')}</div>

                    <div className="mt-3">
                        <div className="flex items-center justify-between text-[10px] text-[#6f685f] mb-1">

                        </div>
                        <div className="w-full h-1.5 rounded-full bg-[#e4ded3] overflow-hidden">
                            <div className="h-full rounded-full bg-[#8b9f98]" style={{ width: `${clampPercent(memoryPercent ?? 0)}%` }} />
                        </div>
                    </div>

                    <div className="text-[11px] text-[#6f685f] mt-2">
                        {t('gpu.modal.fanSpeed')}: {fanSpeed !== null ? `${fanSpeed.toFixed(0)}%` : t('node.na')}
                    </div>
