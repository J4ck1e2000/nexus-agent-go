        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --bg: #ece9e3;
            --panel: #f7f4ef;
            --panel-soft: #fbf8f3;
            --line: rgba(60, 47, 35, 0.08);
            --text-main: #181716;
            --text-muted: #6b665e;
            --teal: #5f9189;
            --teal-soft: #d9e8e4;
            --rose-soft: #ece4df;
            --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(1200px 380px at 0% -15%, rgba(255, 255, 255, 0.35), transparent 65%),
                radial-gradient(900px 280px at 100% 0%, rgba(255, 255, 255, 0.28), transparent 68%);
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c8c0b5; border-radius: 999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #b4ab9f; }

        .soft-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
        }

        .soft-panel-subtle {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 20px;
        }

        .muted-button {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            color: #3a3632;
            border-radius: 999px;
            transition: all 180ms ease;
        }

        .muted-button:hover {
            transform: translateY(-1px);
            border-color: rgba(60, 47, 35, 0.16);
            background: #f2eee7;
        }

        .primary-button {
            background: #26231f;
            color: #f8f4ed;
            border: 1px solid #26231f;
            border-radius: 999px;
            transition: all 180ms ease;
            box-shadow: 0 6px 16px rgba(38, 35, 31, 0.22);
        }

        .primary-button:hover {
            transform: translateY(-1px);
            background: #181614;
            border-color: #181614;
        }

        .section-eyebrow {
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 700;
            color: #7c746b;
        }

        .card-hover {
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            border-color: rgba(60, 47, 35, 0.16);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 22px rgba(0, 0, 0, 0.05);
        }

        .drawer-enter {
            animation: drawerIn 200ms ease;
        }

        @keyframes drawerIn {
            from { transform: translateX(20px); opacity: 0.7; }
            to { transform: translateX(0); opacity: 1; }
        }

        .fade-enter {
            animation: fadeIn 140ms ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .gpu-mini-card {
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .gpu-mini-card:hover {
            transform: translateY(-1px);
            border-color: rgba(60, 47, 35, 0.16);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 8px 18px rgba(0, 0, 0, 0.05);
        }

        .gpu-mini-card:focus-visible {
            outline: 2px solid rgba(95, 145, 137, 0.55);
            outline-offset: 2px;
        }
    </style>
</head>

        const resolveTranslationPath = (messages, key) => key.split('.').reduce((acc, part) => (acc && acc[part] !== undefined ? acc[part] : undefined), messages);

        const createTranslator = (language) => {
            const fallbackMessages = translations[DEFAULT_LANGUAGE] || {};
            const currentMessages = translations[language] || fallbackMessages;
            return (key, params = {}) => {
                const raw = resolveTranslationPath(currentMessages, key) ?? resolveTranslationPath(fallbackMessages, key);
                if (typeof raw === 'function') return raw(params);
                if (typeof raw === 'string') return formatTranslation(raw, params);
                return key;
            };
        };

        const getInitialLanguage = () => {
            try {
                const cached = localStorage.getItem(LANGUAGE_STORAGE_KEY);
                if (cached === 'zh' || cached === 'en') return cached;

            const browserLanguage = (navigator.language || navigator.userLanguage || DEFAULT_LANGUAGE).toLowerCase();
            return browserLanguage.startsWith('zh') ? 'zh' : 'en';
        };

            return `${mbPerSec.toFixed(2)} MB/s`;

            if (!d) return '-';
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');
            return `${hh}:${mm}:${ss}`;

            useEffect(() => {

                setIsClosing(false);

                const frame = requestAnimationFrame(() => setIsVisible(true));
                const previousOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';

                return () => {
                    cancelAnimationFrame(frame);
                    document.body.style.overflow = previousOverflow;
                    if (closeTimerRef.current) {
                        clearTimeout(closeTimerRef.current);

                };
            }, [payload]);

                                icon={Icons.Zap}
                            />
                        </div>

                        <div className="mt-4">
                            {isOffline ? (
                                <div className="soft-panel-subtle p-4 text-sm text-[#736c63]">
                                    {t('empty.nodeUnreachable')}
                                </div>
                            ) : gpus.length === 0 ? (
                                <div className="soft-panel-subtle p-4 text-sm text-[#736c63]">{t('empty.noGpuData')}</div>
                            ) : (
                                <div className="grid gap-3" style={gpuGridStyle}>
                                    {gpus.map((gpu, idx) => (
                                        <GpuMiniCard
                                            key={idx}
                                            gpu={gpu}
                                            index={idx}
                                            layoutMode={isSingleGpu ? 'single' : 'compact'}
                                            t={t}
                                            onSelect={(gpuData, gpuIndex) => setSelectedGpu({ gpu: gpuData, index: gpuIndex })}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>
                    </article>

                    <GpuDetailModal payload={selectedGpu} onClose={() => setSelectedGpu(null)} t={t} />
                </>
            );
        };

        const ActivityDrawer = ({ isOpen, onClose, processes, t }) => {
            const users = useMemo(() => {
                const map = {};
                processes.forEach((proc) => {
                    const name = proc.user || proc.username || t('misc.unknown');
                    if (!map[name]) map[name] = { name, processes: [], totalVram: 0, gpuCount: 0 };
                    map[name].processes.push(proc);
                    map[name].totalVram += (safeNumber(proc.vram_used_mb) || 0);
                    if (proc.gpu_index !== null && (safeNumber(proc.vram_used_mb) || 0) > 0) map[name].gpuCount += 1;
                });
                const thresholdMb = 0.1 * 1024;
                return Object.values(map)
                    .filter((u) => u.totalVram >= thresholdMb)
                    .sort((a, b) => b.totalVram - a.totalVram);
            }, [processes, t]);

            const [expandedUser, setExpandedUser] = useState(null);
            if (!isOpen) return null;

            return (
                <>
                    <div className="fixed inset-0 z-50 bg-[#2f2922]/18 backdrop-blur-[2px] fade-enter" onClick={onClose} />
                    <aside className="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-[#f7f4ef] border-l border-[rgba(60,47,35,0.1)] shadow-[0_18px_50px_rgba(30,26,22,0.16)] drawer-enter flex flex-col">
                        <div className="px-5 py-4 border-b border-[rgba(60,47,35,0.08)] flex items-center justify-between">
                            <div>
                                <div className="section-eyebrow mb-1">{t('drawer.eyebrow')}</div>
                                <h3 className="text-lg font-semibold text-[#1d1a18]">{t('drawer.title')}</h3>
                            </div>
                            <button onClick={onClose} className="muted-button p-2 text-[#6f685f]" title={t('action.close')}>
                                <Icons.X className="w-4 h-4" />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar px-4 py-4">
                            {users.length === 0 ? (
                                <div className="soft-panel-subtle p-6 text-center text-[#6f685f] text-sm">{t('empty.noActiveGpuUsers')}</div>
                            ) : (
                                <div className="space-y-3">
                                    <div className="text-[11px] text-[#7a736a]">{t('drawer.thresholdNote')}</div>
                                    {users.map((user, idx) => {
                                        const isExpanded = expandedUser === user.name;
                                        return (
                                            <div key={user.name} className="soft-panel-subtle overflow-hidden">
                                                <button
                                                    className="w-full text-left px-3.5 py-3 flex items-center gap-3"
                                                    onClick={() => setExpandedUser(isExpanded ? null : user.name)}
                                                >
                                                    <div className={cx('w-9 h-9 rounded-full text-sm font-semibold flex items-center justify-center', toneFromName(user.name))}>
                                                        {String(user.name || 'U').slice(0, 1).toUpperCase()}
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center justify-between gap-2">
                                                            <div className="truncate text-sm font-semibold text-[#2a2724]">{user.name}</div>
                                                            <div className="text-[10px] font-mono text-[#746d64]">#{idx + 1}</div>
                                                        </div>
                                                        <div className="mt-1 flex items-center gap-2 text-[10px] text-[#756e66]">
                                                            <span className="px-1.5 py-0.5 rounded-full border border-[#d8cfc4] bg-[#efe7dc]">{(user.totalVram / 1024).toFixed(1)} GB</span>
                                                            <span className="px-1.5 py-0.5 rounded-full border border-[#d8cfc4] bg-[#ece7df]">{user.gpuCount} {t('metric.gpuUnit')}</span>
                                                        </div>
                                                    </div>
                                                    <Icons.ChevronDown className={cx('w-4 h-4 text-[#80786f] transition-transform', isExpanded ? 'rotate-180' : '')} />
                                                </button>

                                                {isExpanded ? (
                                                    <div className="px-3 pb-3 space-y-2.5 border-t border-[rgba(60,47,35,0.06)]">
                                                        {user.processes.map((proc, i) => (
                                                            <div key={i} className="mt-3 soft-panel-subtle p-3">
                                                                <div className="grid grid-cols-2 gap-2 text-[11px]">
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">{t('drawer.server')}</div>
                                                                        <div className="font-semibold text-[#2c2926]">{proc.serverName || '-'}</div>
                                                                    </div>
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">{t('drawer.gpuIndex')}</div>
                                                                        <div className="font-mono text-[#2c2926]">{proc.gpu_index !== null && proc.gpu_index !== undefined ? proc.gpu_index : '-'}</div>
                                                                    </div>
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">{t('drawer.pid')}</div>
                                                                        <div className="font-mono text-[#2c2926]">{proc.pid || '-'}</div>
                                                                    </div>
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">{t('drawer.vram')}</div>
                                                                        <div className="font-mono text-[#2c2926]">{safeNumber(proc.vram_used_mb) !== null ? `${(Number(proc.vram_used_mb) / 1024).toFixed(2)} GB` : '-'}</div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : null}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </aside>
                </>
            );
        };

        const App = () => {
            const [servers, setServers] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isActivityOpen, setIsActivityOpen] = useState(false);
            const [modalData, setModalData] = useState({ name: "", url: "http://", pin: "", token: "" });
            const [language, setLanguage] = useState(() => getInitialLanguage());
            const historyRef = useRef({});
            const latestServersRef = useRef([]);
            const activeFetchIdRef = useRef(0);
            const [lastSyncedAt, setLastSyncedAt] = useState(null);
            const [gatewayToken, setGatewayToken] = useState(() => localStorage.getItem(GATEWAY_TOKEN_STORAGE_KEY) || '');
            const t = useMemo(() => createTranslator(language), [language]);

            useEffect(() => {
                try {
                    localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
                } catch (e) {}
                document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
                document.title = t('app.title');
            }, [language, t]);

            const saveGatewayToken = (rawToken) => {
                const token = normalizeToken(rawToken);
                setGatewayToken(token);
                if (token) localStorage.setItem(GATEWAY_TOKEN_STORAGE_KEY, token);
                else localStorage.removeItem(GATEWAY_TOKEN_STORAGE_KEY);
                return token;
            };

            const promptGatewayToken = (message = t('prompt.gatewayTokenTitle')) => {
                const input = prompt(message, gatewayToken || '');
                if (input === null) return null;
                return saveGatewayToken(input);
            };

            const fetchWithGatewayAuth = async (url, options = {}, allowPrompt = true) => {
                const runRequest = (token) => {
                    const baseHeaders = options.headers || {};
                    const headers = { ...baseHeaders, ...buildBearerHeader(token) };
                    return fetch(url, { ...options, headers });
                };

                let res = await runRequest(gatewayToken);
                if (allowPrompt && res.status === 401) {
                    const refreshedToken = promptGatewayToken(t('prompt.gatewayTokenRequired'));
                    if (refreshedToken !== null) {
                        res = await runRequest(refreshedToken);
                    }
                }
                return res;
            };

            useEffect(() => {
                const loadConfig = async () => {
                    try {
                        const res = await fetchWithGatewayAuth('/api/config');
                        if (res.ok) {
                            const data = await res.json();
                            setServers(data.map((s) => ({ ...s, token: normalizeToken(s.token || ''), status: 'pending', data: null, metrics: null })));
                        } else {
                            throw new Error();
                        }
                    } catch {
                        const saved = localStorage.getItem('nexus_servers_fallback');
                        if (saved) {
                            setServers(JSON.parse(saved).map((s) => ({ ...s, token: normalizeToken(s.token || ''), status: 'pending', data: null, metrics: null })));
                        }
                    }
                };
                loadConfig();
            }, []);

            useEffect(() => {
                latestServersRef.current = servers;
            }, [servers]);

            const saveConfig = async (newServersList, pin) => {
                const configToSave = newServersList.map((s) => ({ id: s.id, name: s.name, url: s.url, token: normalizeToken(s.token) }));
                try {
                    const res = await fetchWithGatewayAuth('/api/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-PIN': pin || '' },
                        body: JSON.stringify(configToSave),
                    });
                    if (res.ok) return { ok: true };
                    if (res.status === 401) return { ok: false, reason: 'unauthorized' };
                    if (res.status === 403) return { ok: false, reason: 'invalid_pin' };
                    return { ok: false, reason: 'server_error' };
                } catch {
                    if (validatePin(pin)) {
                        localStorage.setItem('nexus_servers_fallback', JSON.stringify(configToSave));
                        return { ok: true };
                    }
                    return { ok: false, reason: 'network_error' };
                }
            };

            const showSaveConfigError = (reason) => {
                if (reason === 'unauthorized') {
                    alert(t('notify.gatewayAuthFailed'));
                    return;
                }
                if (reason === 'invalid_pin') {
                    alert(t('notify.invalidPin'));
                    return;
                }
                alert(t('notify.saveConfigFailed'));
            };

            useEffect(() => {
                let disposed = false;
                const inFlightControllers = new Set();
                const inFlightTimeouts = new Set();
                const effectGeneration = ++activeFetchIdRef.current;
                let nextRequestId = 0;
                let latestAppliedRequestId = 0;

                const fetchAll = async () => {
                    const requestId = ++nextRequestId;
                    const snapshot = latestServersRef.current;
                    if (snapshot.length === 0) return;

                    const promises = snapshot.map(async (server) => {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 3000);
                        inFlightControllers.add(controller);
                        inFlightTimeouts.add(timeoutId);

                        try {
                            const targetUrl = `${server.url}/metrics`;
                            const proxyUrl = `/api/proxy?url=${encodeURIComponent(targetUrl)}`;
                            const targetToken = normalizeToken(server.token || '');
                            let res;
                            try {
                                res = await fetchWithGatewayAuth(proxyUrl, {
                                    signal: controller.signal,
                                    headers: { ...buildTargetAuthorizationHeader(targetToken) },
                                }, false);
                                if (res.status !== 200) throw new Error();
                            } catch {
                                res = await fetch(targetUrl, {
                                    signal: controller.signal,
                                    headers: { ...buildBearerHeader(targetToken) },
                                });
                            }
                            if (!res.ok) throw new Error();

                            const jsonData = await res.json();
                            const currentTime = Date.now();
                            const history = historyRef.current[server.url];
                            let upSpeed = 0;
                            let downSpeed = 0;
                            if (history) {
                                const timeDiffSec = (currentTime - history.timestamp) / 1000;
                                if (timeDiffSec > 0) {
                                    upSpeed = Math.max(0, jsonData.net_sent_mb - history.sent) / timeDiffSec;
                                    downSpeed = Math.max(0, jsonData.net_recv_mb - history.recv) / timeDiffSec;
                                }
                            }
                            historyRef.current[server.url] = { timestamp: currentTime, sent: jsonData.net_sent_mb, recv: jsonData.net_recv_mb };
                            return { id: server.id, status: 'online', data: jsonData, metrics: { upSpeed, downSpeed } };
                        } catch {
                            return { id: server.id, status: 'offline' };
                        } finally {
                            clearTimeout(timeoutId);
                            inFlightTimeouts.delete(timeoutId);
                            inFlightControllers.delete(controller);
                        }
                    });

                    const results = await Promise.all(promises);
                    if (disposed || effectGeneration !== activeFetchIdRef.current) return;
                    if (requestId < latestAppliedRequestId) return;
                    latestAppliedRequestId = requestId;

                    setServers((prevServers) => {
                        const resultMap = new Map(results.map((item) => [item.id, item]));
                        return prevServers.map((server) => {
                            const next = resultMap.get(server.id);
                            if (!next) return server;
                            if (next.status === 'offline') return { ...server, status: 'offline' };
                            return { ...server, status: 'online', data: next.data, metrics: next.metrics };
                        });
                    });
                    setLastSyncedAt(new Date());
                };

                fetchAll();
                const interval = setInterval(fetchAll, 2000);

                return () => {
                    disposed = true;
                    if (activeFetchIdRef.current === effectGeneration) {
                        activeFetchIdRef.current += 1;
                    }
                    clearInterval(interval);
                    inFlightTimeouts.forEach((timeoutId) => clearTimeout(timeoutId));
                    inFlightControllers.forEach((controller) => controller.abort());
                };
            }, [gatewayToken]);

            const addServer = async () => {
                const newServer = {
                    id: Date.now(),
                    name: modalData.name,
                    url: modalData.url,
                    token: normalizeToken(modalData.token),
                    status: 'pending'
                };
                const newList = [...servers, newServer];
                const saveResult = await saveConfig(newList, modalData.pin);
                if (!saveResult.ok) {
                    showSaveConfigError(saveResult.reason);
                    return;
                }
                setServers(newList);
                setIsModalOpen(false);
                setModalData({ name: "", url: "http://", pin: "", token: "" });
            };

            const deleteServer = async (id) => {
                if (!confirm(t('prompt.confirmDeleteNode'))) return;
                const pin = prompt(t('prompt.adminPin'));
                if (!pin) return;
                const newList = servers.filter((x) => x.id !== id);
                const saveResult = await saveConfig(newList, pin);
                if (!saveResult.ok) {
                    showSaveConfigError(saveResult.reason);
                    return;
                }
                const removedServer = servers.find((x) => x.id === id);
                if (removedServer) delete historyRef.current[removedServer.url];
                setServers(newList);
            };

            const onlineServers = servers.filter((s) => s.status === 'online');
            const activeCount = onlineServers.length;
            const totalServers = servers.length;
            const totalGpus = onlineServers.reduce((acc, s) => acc + (Array.isArray(s.data?.gpus) ? s.data.gpus.length : 0), 0);

            const allProcesses = onlineServers
                .filter((s) => Array.isArray(s.data?.processes))
                .flatMap((s) => s.data.processes.map((p) => ({ ...p, serverName: s.name })))
                .filter((p) => !['root', 'gdm'].includes(String(p.user || '').toLowerCase()));

            const activeUsersCount = useMemo(() => {
                const totals = {};
                allProcesses.forEach((p) => {
                    const name = p.user || p.username || t('misc.unknown');
                    if (!totals[name]) totals[name] = 0;
                    totals[name] += (safeNumber(p.vram_used_mb) || 0);
                });
                const thresholdMb = 0.1 * 1024;
                return Object.values(totals).filter((total) => total >= thresholdMb).length;
            }, [allProcesses, t]);

            const topUsers = useMemo(() => {
                const map = {};
                allProcesses.forEach((proc) => {
                    const name = proc.user || proc.username || t('misc.unknown');
                    if (!map[name]) map[name] = { name, vramMb: 0, procCount: 0 };
                    map[name].vramMb += (safeNumber(proc.vram_used_mb) || 0);
                    map[name].procCount += 1;
                });
                return Object.values(map)
                    .filter((item) => item.vramMb >= 0.1 * 1024)
                    .sort((a, b) => b.vramMb - a.vramMb)
                    .slice(0, 6);
            }, [allProcesses, t]);

            const cpuValues = onlineServers.map((s) => safeNumber(s.data?.cpu_usage)).filter((v) => v !== null);
            const ramValues = onlineServers.map((s) => safeNumber(s.data?.ram_percent)).filter((v) => v !== null);
            const totalCpuAvg = cpuValues.length ? cpuValues.reduce((sum, v) => sum + v, 0) / cpuValues.length : null;
            const totalRamAvg = ramValues.length ? ramValues.reduce((sum, v) => sum + v, 0) / ramValues.length : null;

            const allGpuData = onlineServers.flatMap((s) => (Array.isArray(s.data?.gpus) ? s.data.gpus : []));
            const powerValues = allGpuData.map((gpu) => safeNumber(gpu.power_draw)).filter((v) => v !== null);
            const totalPower = powerValues.length ? powerValues.reduce((sum, v) => sum + v, 0) : null;

            const vramUsedValues = allGpuData.map((gpu) => safeNumber(gpu.memory_used)).filter((v) => v !== null);
            const vramTotalValues = allGpuData.map((gpu) => safeNumber(gpu.memory_total)).filter((v) => v !== null);
            const totalVramUsed = vramUsedValues.length ? vramUsedValues.reduce((sum, v) => sum + v, 0) : null;
            const totalVram = vramTotalValues.length ? vramTotalValues.reduce((sum, v) => sum + v, 0) : null;

            const totalDown = onlineServers.reduce((sum, s) => sum + (safeNumber(s.metrics?.downSpeed) || 0), 0);
            const totalUp = onlineServers.reduce((sum, s) => sum + (safeNumber(s.metrics?.upSpeed) || 0), 0);

            const highestCpuNode = onlineServers
                .map((s) => ({ name: s.name, cpu: safeNumber(s.data?.cpu_usage) }))
                .filter((item) => item.cpu !== null)
                .sort((a, b) => b.cpu - a.cpu)[0] || null;

            const highestPowerNode = onlineServers
                .map((s) => {
                    const pwr = (Array.isArray(s.data?.gpus) ? s.data.gpus : []).reduce((sum, gpu) => sum + (safeNumber(gpu.power_draw) || 0), 0);
                    return { name: s.name, power: pwr };
                })
                .sort((a, b) => b.power - a.power)[0] || null;

            const onlineRatio = totalServers > 0 ? (activeCount / totalServers) * 100 : 0;
            const fleetState = totalServers === 0
                ? t('fleet.idle')
                : activeCount === totalServers
                    ? t('fleet.healthy')
                    : activeCount === 0
                        ? t('fleet.idle')
                        : t('fleet.partial');

            const snapshotEvents = [
                {
                    label: t('snapshot.updatedLabel'),
                    value: lastSyncedAt ? formatTime(lastSyncedAt) : '-',
                    detail: t('snapshot.updatedDetail')
                },
                {
                    label: t('snapshot.reachabilityLabel'),
                    value: t('snapshot.reachabilityValue', { online: activeCount, total: totalServers || 0 }),
                    detail: totalServers ? t('snapshot.reachabilityDetail', { percent: Math.round(onlineRatio) }) : t('snapshot.reachabilityWaiting')
                },
                {
                    label: t('snapshot.occupancyLabel'),
                    value: t('snapshot.occupancyValue', { count: activeUsersCount }),
                    detail: t('snapshot.occupancyDetail')
                },
                {
                    label: t('snapshot.peakCpuLabel'),
                    value: highestCpuNode ? `${highestCpuNode.name}` : '-',
                    detail: highestCpuNode ? t('snapshot.peakCpuDetail', { cpu: highestCpuNode.cpu.toFixed(1) }) : t('snapshot.peakCpuEmpty')
                },
                {
                    label: t('snapshot.powerFocusLabel'),
                    value: highestPowerNode && highestPowerNode.power > 0 ? highestPowerNode.name : '-',
                    detail: highestPowerNode && highestPowerNode.power > 0 ? t('snapshot.powerFocusDetail', { power: highestPowerNode.power.toFixed(0) }) : t('snapshot.powerFocusEmpty')
                }
            ];

            return (
                <div className="min-h-screen pb-14">
                    <div className="max-w-[1400px] mx-auto px-4 sm:px-6 py-6 md:py-8">
                        <header className="soft-panel p-4 md:p-5 mb-6">
                            <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                                <div className="flex items-start gap-3">
                                    <div className="w-11 h-11 rounded-2xl border border-[rgba(60,47,35,0.1)] bg-[#f2ede4] flex items-center justify-center text-[#3f3a34]">
                                        <Icons.LayoutDashboard className="w-5 h-5" />
                                    </div>
                                    <div>
                                        <div className="section-eyebrow mb-1">{t('app.eyebrow')}</div>
                                        <h1 className="text-xl md:text-2xl font-semibold tracking-tight text-[#1a1917]">{t('app.dashboardTitle')}</h1>
                                        <p className="text-sm text-[#6b665e] mt-1">{t('app.dashboardSubtitle')}</p>
                                    </div>
                                </div>
                                <div className="flex flex-wrap items-center gap-2">
                                    <button
                                        onClick={() => setLanguage((prev) => (prev === 'en' ? 'zh' : 'en'))}
                                        className="muted-button px-3 py-2 text-sm font-medium"
                                        title={language === 'en' ? t('action.langSwitchTitleToZh') : t('action.langSwitchTitleToEn')}
                                        aria-label={language === 'en' ? t('action.langSwitchAriaToZh') : t('action.langSwitchAriaToEn')}
                                    >
                                        {language === 'en' ? '中文' : 'EN'}
                                    </button>

                                    <button
                                        onClick={() => setIsActivityOpen(true)}
                                        className="muted-button px-4 py-2 text-sm font-medium inline-flex items-center gap-2"
                                        title={t('misc.includesVramUsers')}
                                    >
                                        <Icons.Users className="w-4 h-4" />
                                        {t('action.gpuUsers')}
                                        {activeUsersCount > 0 ? (
                                            <span className="px-2 py-0.5 rounded-full bg-[#dcebe8] text-[#2d5a54] text-[11px] font-semibold">{activeUsersCount}</span>
                                        ) : null}
                                    </button>

                                    <button
                                        onClick={() => promptGatewayToken(t('prompt.gatewayTokenConfig'))}
                                        className={cx('muted-button px-4 py-2 text-sm font-medium', gatewayToken ? 'bg-[#deebe7] text-[#2d5a54] border-[#c8ddd8]' : '')}
                                        title={t('prompt.gatewayTokenTitle')}
                                    >
                                        {gatewayToken ? t('action.gatewayTokenActive') : t('action.gatewayToken')}
                                    </button>

                                    <button onClick={() => setIsModalOpen(true)} className="primary-button px-4 py-2 text-sm font-medium inline-flex items-center gap-2">
                                        <Icons.Plus className="w-4 h-4" /> {t('action.addNode')}
                                    </button>

                                    <a
                                        href="https://github.com/J4ck1e2000/Lab-Tutorial"
                                        target="_blank"
                                        className="muted-button px-3 py-2 text-sm inline-flex items-center gap-2 opacity-80 hover:opacity-100"
                                        rel="noreferrer"
                                        title={t('misc.projectRepository')}
                                    >
                                        <Icons.Github className="w-4 h-4" />
                                    </a>
                                </div>
                            </div>
                        </header>

                        <section className="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-6">
                            <div className="soft-panel p-6 md:p-8 xl:col-span-8">
                                <div className="section-eyebrow mb-2">{t('app.fleetOverviewEyebrow')}</div>
                                <h2 className="text-2xl md:text-3xl font-semibold tracking-tight text-[#1a1917]">{t('app.fleetOverviewTitle')}</h2>
                                <p className="text-sm md:text-base text-[#6b665e] mt-3 max-w-3xl">
                                    {t('app.fleetOverviewSubtitle')}
                                </p>
                                <div className="mt-5 flex flex-wrap gap-2">
                                    <SummaryPill label={t('summary.nodes')} value={t('summary.totalSuffix', { count: totalServers || 0 })} tone="neutral" />
                                    <SummaryPill label={t('summary.refresh')} value={t('summary.refreshValue')} tone="default" />
                                    <SummaryPill label={t('summary.synced')} value={lastSyncedAt ? formatTime(lastSyncedAt) : '-'} tone="default" />
                                    <SummaryPill label={t('summary.gateway')} value={gatewayToken ? t('summary.authenticated') : t('summary.notSet')} tone={gatewayToken ? 'positive' : 'warning'} />
                                    <SummaryPill label={t('summary.activeUsers')} value={`${activeUsersCount}`} tone="default" />
                                </div>
                            </div>

                            <div className="soft-panel p-6 xl:col-span-4">
                                <div className="section-eyebrow mb-2">{t('app.clusterSummaryEyebrow')}</div>
                                <div className="text-xl font-semibold text-[#1f1d1b]">{t('app.clusterSummaryTitle')}</div>
                                <div className="mt-4">
                                    <div className="flex items-end justify-between mb-2">
                                        <div className="text-3xl font-semibold leading-none text-[#1b1917]">{Math.round(onlineRatio)}%</div>
                                        <div className="text-xs text-[#6b665e]">{t('summary.onlineRatio', { online: activeCount, total: totalServers || 0 })}</div>
                                    </div>
                                    <MiniProgress value={onlineRatio} tone="teal" />
                                </div>

                                <div className="grid grid-cols-2 gap-2.5 mt-5">
                                    <MetricTile label={t('metric.status')} value={fleetState} sub={t('metric.computedReachability')} icon={Icons.Server} />
                                    <MetricTile label={t('metric.gpus')} value={`${totalGpus}`} sub={t('metric.detectedOnlineNodes')} icon={Icons.Zap} />
                                </div>
                            </div>
                        </section>

                        <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
                            <div className="xl:col-span-12">
                                <SectionCard
                                    eyebrow={t('app.nodeSummaryEyebrow')}
                                    title={t('app.nodeSummaryTitle')}
                                    subtitle={t('app.nodeSummarySubtitle')}
                                >
                                    {servers.length === 0 ? (
                                        <div className="soft-panel-subtle p-10 text-center">
                                            <div className="text-base font-semibold text-[#2d2a27] mb-2">{t('empty.noConfiguredNodes')}</div>
                                            <div className="text-sm text-[#6e675f] mb-5">{t('empty.addFirstNode')}</div>
                                            <button onClick={() => setIsModalOpen(true)} className="primary-button px-5 py-2 text-sm font-medium inline-flex items-center gap-2">
                                                <Icons.Plus className="w-4 h-4" /> {t('action.connectNode')}
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-4">
                                            {servers.map((s) => (
                                                <ServerCard key={s.id} server={s} onDelete={deleteServer} t={t} />
                                            ))}
                                        </div>
                                    )}
                                </SectionCard>
                            </div>

                            <div className="xl:col-span-4">
                                <SectionCard
                                    eyebrow={t('app.runtimeEyebrow')}
                                    title={t('app.runtimeTitle')}
                                    subtitle={t('app.runtimeSubtitle')}
                                >
                                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-1 gap-3">
                                        <MetricTile label={t('metric.onlineServers')} value={`${activeCount} / ${totalServers || 0}`} sub={t('metric.liveReachability')} icon={Icons.Server} />
                                        <MetricTile label={t('metric.totalGpu')} value={`${totalGpus}`} sub={t('metric.acrossReachableNodes')} icon={Icons.Zap} />
                                        <MetricTile label={t('metric.totalPower')} value={totalPower !== null ? `${totalPower.toFixed(0)} W` : '-'} sub={t('metric.summedGpuDraw')} icon={Icons.Activity} />
                                        <MetricTile label={t('metric.avgCpu')} value={totalCpuAvg !== null ? `${totalCpuAvg.toFixed(1)}%` : '-'} sub={t('metric.onlineNodesOnly')} icon={Icons.Cpu} />
                                        <MetricTile label={t('metric.avgRam')} value={totalRamAvg !== null ? `${totalRamAvg.toFixed(1)}%` : '-'} sub={t('metric.onlineNodesOnly')} icon={Icons.HardDrive} />
                                        <MetricTile
                                            label={t('metric.vram')}
                                            value={totalVramUsed !== null && totalVram !== null ? `${totalVramUsed.toFixed(1)} / ${totalVram.toFixed(1)} GB` : '-'}
                                            sub={t('metric.usedTotal')}
                                            icon={Icons.HardDrive}
                                        />
                                    </div>
                                </SectionCard>
                            </div>

                            <div className="xl:col-span-4">
                                <SectionCard
                                    eyebrow={t('app.latestLogEyebrow')}
                                    title={t('app.latestLogTitle')}
                                    subtitle={t('app.latestLogSubtitle')}
                                    right={
                                        <div className="text-xs text-[#6f685f] inline-flex items-center gap-1">
                                            <Icons.Clock className="w-3.5 h-3.5" /> {lastSyncedAt ? formatTime(lastSyncedAt) : '-'}
                                        </div>
                                    }
                                >
                                    <div className="space-y-2.5">
                                        {snapshotEvents.map((event, idx) => (
                                            <div key={idx} className="soft-panel-subtle p-3.5">
                                                <div className="flex items-start justify-between gap-3">
                                                    <div>
                                                        <div className="text-[11px] uppercase tracking-[0.1em] text-[#867f76] font-semibold">{event.label}</div>
                                                        <div className="text-sm font-semibold text-[#2b2926] mt-1">{event.value}</div>
                                                    </div>
                                                    <div className="text-[10px] text-[#7a7269]">#{idx + 1}</div>
                                                </div>
                                                <div className="text-xs text-[#6f685f] mt-2">{event.detail}</div>
                                            </div>
                                        ))}
                                    </div>
                                </SectionCard>
                            </div>

                            <div className="xl:col-span-4">
                                <SectionCard
                                    eyebrow={t('app.recentEyebrow')}
                                    title={t('app.recentTitle')}
                                    subtitle={t('app.recentSubtitle')}
                                >
                                    <div className="soft-panel-subtle p-3 mb-3">
                                        <div className="flex items-center justify-between text-sm">
                                            <span className="text-[#6f685f]">{t('drawer.totalActiveUsers')}</span>
                                            <span className="font-semibold text-[#2b2926]">{activeUsersCount}</span>
                                        </div>
                                        <div className="flex items-center justify-between text-sm mt-2">
                                            <span className="text-[#6f685f]">{t('drawer.networkThroughput')}</span>
                                            <span className="font-mono text-[#2b2926]">↓ {formatSpeed(totalDown)} / ↑ {formatSpeed(totalUp)}</span>
                                        </div>
                                    </div>

                                    {topUsers.length === 0 ? (
                                        <div className="soft-panel-subtle p-4 text-sm text-[#6f685f]">{t('empty.noActiveGpuUsersSnapshot')}</div>
                                    ) : (
                                        <div className="space-y-2.5">
                                            {topUsers.map((user, idx) => (
                                                <div key={user.name} className="soft-panel-subtle p-3 flex items-center gap-3">
                                                    <div className={cx('w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold', toneFromName(user.name))}>
                                                        {String(user.name).slice(0, 1).toUpperCase()}
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center justify-between gap-2">
                                                            <div className="truncate text-sm font-semibold text-[#2b2926]">{user.name}</div>
                                                            <div className="text-[10px] font-mono text-[#7a7269]">#{idx + 1}</div>
                                                        </div>
                                                        <div className="text-xs text-[#6f685f] mt-0.5">
                                                            {t(user.procCount > 1 ? 'misc.activeUserLinePlural' : 'misc.activeUserLine', {
                                                                vram: (user.vramMb / 1024).toFixed(2),
                                                                count: user.procCount
                                                            })}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </SectionCard>
                            </div>
                        </div>
                    </div>

                    <ActivityDrawer isOpen={isActivityOpen} onClose={() => setIsActivityOpen(false)} processes={allProcesses} t={t} />

                    {isModalOpen ? (
                        <div className="fixed inset-0 z-50 bg-[#2f2922]/22 backdrop-blur-[2px] p-4 flex items-center justify-center fade-enter">
                            <div className="soft-panel w-full max-w-lg p-6 md:p-7">
                                <div className="flex items-center justify-between mb-5">
                                    <div>
                                        <div className="section-eyebrow mb-1">{t('modal.configuration')}</div>
                                        <h3 className="text-xl font-semibold text-[#1f1d1b]">{t('modal.addNode')}</h3>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} className="muted-button p-2 text-[#6f685f]" title={t('action.close')}>
                                        <Icons.X className="w-4 h-4" />
                                    </button>
                                </div>

                                <div className="space-y-3.5">
                                    <div>
                                        <label className="block text-[10px] uppercase tracking-[0.13em] font-semibold text-[#847c73] mb-1.5">{t('modal.nodeName')}</label>
                                        <input
                                            type="text"
                                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors"
                                            placeholder={t('modal.nodeNamePlaceholder')}
                                            value={modalData.name}
                                            onChange={(e) => setModalData({ ...modalData, name: e.target.value })}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] uppercase tracking-[0.13em] font-semibold text-[#847c73] mb-1.5">{t('modal.agentUrl')}</label>
                                        <input
                                            type="text"
                                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors font-mono"
                                            placeholder={t('modal.agentUrlPlaceholder')}
                                            value={modalData.url}
                                            onChange={(e) => setModalData({ ...modalData, url: e.target.value })}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] uppercase tracking-[0.13em] font-semibold text-[#847c73] mb-1.5">{t('modal.agentTokenOptional')}</label>
                                        <input
                                            type="text"
                                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors font-mono"
                                            placeholder={t('modal.agentTokenPlaceholder')}
                                            value={modalData.token}
                                            onChange={(e) => setModalData({ ...modalData, token: e.target.value })}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] uppercase tracking-[0.13em] font-semibold text-[#847c73] mb-1.5">{t('modal.securityPin')}</label>
                                        <input
                                            type="text"
                                            inputMode="numeric"
                                            maxLength={4}
                                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors font-mono tracking-[0.5em] text-center"
                                            placeholder={t('modal.pinPlaceholder')}
                                            value={modalData.pin}
                                            onChange={(e) => setModalData({ ...modalData, pin: e.target.value.replace(/\D/g, '') })}
                                        />
                                    </div>
                                </div>

                                <div className="mt-6 flex gap-2.5">
                                    <button onClick={() => setIsModalOpen(false)} className="muted-button flex-1 px-4 py-2.5 text-sm font-medium">{t('action.cancel')}</button>
                                    <button onClick={addServer} className="primary-button flex-1 px-4 py-2.5 text-sm font-medium">{t('action.connectAgent')}</button>
                                </div>
                            </div>
                        </div>
                    ) : null}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
