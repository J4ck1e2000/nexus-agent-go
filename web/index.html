<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Monitor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --bg: #ece9e3;
            --panel: #f7f4ef;
            --panel-soft: #fbf8f3;
            --line: rgba(60, 47, 35, 0.08);
            --text-main: #181716;
            --text-muted: #6b665e;
            --teal: #5f9189;
            --teal-soft: #d9e8e4;
            --rose-soft: #ece4df;
            --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(1200px 380px at 0% -15%, rgba(255, 255, 255, 0.35), transparent 65%),
                radial-gradient(900px 280px at 100% 0%, rgba(255, 255, 255, 0.28), transparent 68%);
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c8c0b5; border-radius: 999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #b4ab9f; }

        .soft-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
        }

        .soft-panel-subtle {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 20px;
        }

        .muted-button {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            color: #3a3632;
            border-radius: 999px;
            transition: all 180ms ease;
        }

        .muted-button:hover {
            transform: translateY(-1px);
            border-color: rgba(60, 47, 35, 0.16);
            background: #f2eee7;
        }

        .primary-button {
            background: #26231f;
            color: #f8f4ed;
            border: 1px solid #26231f;
            border-radius: 999px;
            transition: all 180ms ease;
            box-shadow: 0 6px 16px rgba(38, 35, 31, 0.22);
        }

        .primary-button:hover {
            transform: translateY(-1px);
            background: #181614;
            border-color: #181614;
        }

        .section-eyebrow {
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 700;
            color: #7c746b;
        }

        .card-hover {
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            border-color: rgba(60, 47, 35, 0.16);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 22px rgba(0, 0, 0, 0.05);
        }

        .drawer-enter {
            animation: drawerIn 200ms ease;
        }

        @keyframes drawerIn {
            from { transform: translateX(20px); opacity: 0.7; }
            to { transform: translateX(0); opacity: 1; }
        }

        .fade-enter {
            animation: fadeIn 140ms ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const Icons = {
            Github: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
                    <path d="M9 18c-4.51 2-5-2-7-2"/>
                </svg>
            ),
            LayoutDashboard: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <rect width="7" height="9" x="3" y="3" rx="1"/>
                    <rect width="7" height="5" x="14" y="3" rx="1"/>
                    <rect width="7" height="9" x="14" y="12" rx="1"/>
                    <rect width="7" height="5" x="3" y="16" rx="1"/>
                </svg>
            ),
            Users: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            ),
            Plus: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M5 12h14"/>
                    <path d="M12 5v14"/>
                </svg>
            ),
            X: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="m6 6 12 12"/>
                </svg>
            ),
            Trash2: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 6h18"/>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                    <line x1="10" x2="10" y1="11" y2="17"/>
                    <line x1="14" x2="14" y1="11" y2="17"/>
                </svg>
            ),
            Cpu: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <rect x="9" y="9" width="6" height="6"/>
                    <path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/>
                </svg>
            ),
            HardDrive: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="22" x2="2" y1="12" y2="12"/>
                    <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                    <line x1="6" x2="6.01" y1="16" y2="16"/>
                    <line x1="10" x2="10.01" y1="16" y2="16"/>
                </svg>
            ),
            Activity: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            ),
            Zap: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
            ),
            Thermometer: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
                </svg>
            ),
            Network: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="16" y="16" width="6" height="6" rx="1"/>
                    <rect x="2" y="16" width="6" height="6" rx="1"/>
                    <rect x="9" y="2" width="6" height="6" rx="1"/>
                    <path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/>
                    <path d="M12 12V8"/>
                </svg>
            ),
            Server: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <rect width="20" height="8" x="2" y="2" rx="2" ry="2"/>
                    <rect width="20" height="8" x="2" y="14" rx="2" ry="2"/>
                    <line x1="6" x2="6.01" y1="6" y2="6"/>
                    <line x1="6" x2="6.01" y1="18" y2="18"/>
                </svg>
            ),
            Clock: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
            ),
            ChevronDown: ({ className = "w-4 h-4" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="m6 9 6 6 6-6"/>
                </svg>
            )
        };

        const GATEWAY_TOKEN_STORAGE_KEY = 'nexus_gateway_token';

        const clampPercent = (value) => {
            const num = Number(value);
            if (!Number.isFinite(num)) return 0;
            return Math.max(0, Math.min(100, num));
        };

        const safeNumber = (value) => {
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        };

        const cx = (...parts) => parts.filter(Boolean).join(' ');

        const formatSpeed = (mbPerSec) => {
            if (!mbPerSec) return '0 KB/s';
            if (mbPerSec < 0.1) return '0 KB/s';
            if (mbPerSec < 1) return `${(mbPerSec * 1024).toFixed(0)} KB/s`;
            return `${mbPerSec.toFixed(2)} MB/s`;
        };

        const formatTime = (d) => {
            if (!d) return '-';
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');
            return `${hh}:${mm}:${ss}`;
        };

        const formatPercent = (value) => {
            if (!Number.isFinite(value)) return '-';
            return `${value.toFixed(1)}%`;
        };

        const formatOneDecimal = (value, suffix = '') => {
            if (!Number.isFinite(value)) return '-';
            return `${value.toFixed(1)}${suffix}`;
        };

        const getTodayPin = () => {
            const d = new Date();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return mm + dd;
        };

        const validatePin = (pin) => typeof pin === 'string' && /^\d{4}$/.test(pin) && pin === getTodayPin();
        const normalizeToken = (token) => (typeof token === 'string' ? token.trim() : '');
        const buildBearerHeader = (token) => {
            const normalized = normalizeToken(token);
            return normalized ? { Authorization: `Bearer ${normalized}` } : {};
        };
        const buildTargetAuthorizationHeader = (token) => {
            const normalized = normalizeToken(token);
            return normalized ? { 'X-Target-Authorization': `Bearer ${normalized}` } : {};
        };

        const avatarTones = [
            'bg-[#dfd7cc] text-[#3a352f]',
            'bg-[#d9ddd3] text-[#2f3a2f]',
            'bg-[#d5e0de] text-[#2f4340]',
            'bg-[#e3dacf] text-[#4d3b2e]',
            'bg-[#d7d4de] text-[#3b3648]'
        ];

        const toneFromName = (name) => {
            const text = name || 'U';
            let hash = 0;
            for (let i = 0; i < text.length; i += 1) {
                hash = text.charCodeAt(i) + ((hash << 5) - hash);
            }
            return avatarTones[Math.abs(hash) % avatarTones.length];
        };

        const SummaryPill = ({ label, value, tone = 'default' }) => {
            const toneMap = {
                default: 'bg-[#f2eee7] text-[#4f4943] border-[#d9d0c5]',
                positive: 'bg-[#deebe7] text-[#2d5953] border-[#c8ded8]',
                neutral: 'bg-[#ece6dc] text-[#5e564d] border-[#d7cfc2]',
                warning: 'bg-[#eee3df] text-[#6e5b55] border-[#ded0ca]'
            };
            return (
                <div className={cx('px-3 py-1.5 rounded-full border text-[11px] font-medium inline-flex items-center gap-1.5', toneMap[tone] || toneMap.default)}>
                    <span className="text-[10px] uppercase tracking-[0.12em] opacity-70">{label}</span>
                    <span className="font-semibold">{value}</span>
                </div>
            );
        };

        const MiniProgress = ({ value, tone = 'teal' }) => {
            const safe = clampPercent(value);
            const toneMap = {
                teal: 'bg-[#5f9189]',
                slate: 'bg-[#8f968e]',
                muted: 'bg-[#97aaa5]'
            };
            return (
                <div className="w-full h-2 rounded-full bg-[#e5dfd5] overflow-hidden">
                    <div className={cx('h-full rounded-full transition-all duration-500', toneMap[tone] || toneMap.teal)} style={{ width: `${safe}%` }} />
                </div>
            );
        };

        const MetricTile = ({ label, value, sub, icon: Icon }) => (
            <div className="soft-panel-subtle p-4">
                <div className="flex items-center justify-between mb-2">
                    <div className="text-[10px] uppercase tracking-[0.14em] text-[#80786f] font-semibold">{label}</div>
                    {Icon ? <Icon className="w-3.5 h-3.5 text-[#8b847b]" /> : null}
                </div>
                <div className="text-xl font-semibold text-[#1f1d1b] leading-none">{value}</div>
                <div className="text-xs text-[#6b665e] mt-1">{sub}</div>
            </div>
        );

        const SectionCard = ({ eyebrow, title, subtitle, right, children, className = '' }) => (
            <section className={cx('soft-panel p-6 md:p-7', className)}>
                <div className="flex items-start justify-between gap-4 mb-5">
                    <div>
                        {eyebrow ? <div className="section-eyebrow mb-2">{eyebrow}</div> : null}
                        <h2 className="text-xl font-semibold tracking-tight text-[#1c1a18]">{title}</h2>
                        {subtitle ? <p className="text-sm text-[#6b665e] mt-1">{subtitle}</p> : null}
                    </div>
                    {right ? <div>{right}</div> : null}
                </div>
                {children}
            </section>
        );

        const ServerMetricTile = ({ label, value, sub, icon: Icon }) => (
            <div className="soft-panel-subtle p-3">
                <div className="flex items-center justify-between mb-1.5">
                    <span className="text-[10px] font-semibold uppercase tracking-[0.12em] text-[#877f76]">{label}</span>
                    <Icon className="w-3.5 h-3.5 text-[#9a9288]" />
                </div>
                <div className="text-sm font-semibold text-[#201e1c] leading-none">{value}</div>
                <div className="text-[11px] text-[#6e685f] mt-1">{sub}</div>
            </div>
        );

        const GpuMiniCard = ({ gpu, index }) => {
            const cleaned = (gpu.name || `GPU ${index}`).replace('NVIDIA GeForce ', '').replace('NVIDIA ', '');
            const temp = safeNumber(gpu.temperature);
            const util = clampPercent(gpu.utilization);
            const memoryUsed = safeNumber(gpu.memory_used);
            const memoryTotal = safeNumber(gpu.memory_total);
            const memoryPercentRaw = memoryTotal && memoryTotal > 0 && memoryUsed !== null
                ? (memoryUsed / memoryTotal) * 100
                : safeNumber(gpu.memory_utilization);
            const memoryPercent = clampPercent(memoryPercentRaw);
            const power = safeNumber(gpu.power_draw);

            return (
                <div className="soft-panel-subtle p-3.5">
                    <div className="flex items-center justify-between gap-2 mb-2">
                        <div className="flex items-center gap-2 min-w-0">
                            <div className="w-6 h-6 rounded-lg border border-[#d8cfc4] bg-[#efe9de] flex items-center justify-center text-[10px] font-mono text-[#635d56]">{index}</div>
                            <div className="min-w-0">
                                <div className="text-xs font-semibold text-[#2a2826] truncate" title={gpu.name || `GPU ${index}`}>{cleaned || `GPU ${index}`}</div>
                                <div className="text-[10px] text-[#827b72]">Device</div>
                            </div>
                        </div>
                        <div className="px-2 py-1 rounded-full border border-[#d6cdc2] bg-[#efe8dc] text-[10px] font-mono text-[#665f57]">
                            {temp !== null ? `${temp.toFixed(0)}°C` : '-'}
                        </div>
                    </div>

                    <div className="space-y-2.5">
                        <div>
                            <div className="flex items-center justify-between text-[10px] text-[#6f685f] mb-1">
                                <span className="uppercase tracking-[0.08em]">Utilization</span>
                                <span className="font-mono text-[#3e3934]">{Number.isFinite(util) ? `${util.toFixed(0)}%` : '-'}</span>
                            </div>
                            <MiniProgress value={util} tone="teal" />
                        </div>
                        <div>
                            <div className="flex items-center justify-between text-[10px] text-[#6f685f] mb-1">
                                <span className="uppercase tracking-[0.08em]">VRAM</span>
                                <span className="font-mono text-[#3e3934]">
                                    {memoryUsed !== null ? memoryUsed.toFixed(1) : '-'} / {memoryTotal !== null ? memoryTotal.toFixed(1) : '-'} GB
                                </span>
                            </div>
                            <MiniProgress value={memoryPercent} tone="muted" />
                        </div>
                    </div>

                    <div className="flex items-center justify-between mt-2.5 text-[10px] text-[#6f685f]">
                        <span className="font-mono">Power {power !== null ? `${power.toFixed(0)}W` : '-'}</span>
                        <span className="font-mono">Fan {safeNumber(gpu.fan_speed) !== null ? `${Number(gpu.fan_speed).toFixed(0)}%` : '-'}</span>
                    </div>
                </div>
            );
        };

        const ServerCard = ({ server, onDelete }) => {
            const isOffline = server.status === 'offline';
            const data = server.data || {};
            const gpus = Array.isArray(data.gpus) ? data.gpus : [];
            const metrics = server.metrics || { upSpeed: 0, downSpeed: 0 };
            const totalPower = gpus.reduce((sum, gpu) => sum + (safeNumber(gpu.power_draw) || 0), 0);
            const ipOrHost = data.ip_address || (server.url ? server.url.replace('http://', '').replace('https://', '').split('/')[0] : '-');

            const statusTone = isOffline
                ? 'bg-[#ece2dd] text-[#705f57] border-[#ddcdc4]'
                : 'bg-[#dcebe8] text-[#2f6058] border-[#c8ddd8]';

            return (
                <article className="soft-panel p-4 md:p-5 h-full card-hover">
                    <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                            <div className="flex items-center gap-2 mb-1.5">
                                <h3 className="text-base font-semibold text-[#1e1c1a] truncate">{server.name}</h3>
                                <span className={cx('px-2 py-1 rounded-full border text-[10px] uppercase tracking-[0.08em] font-semibold', statusTone)}>
                                    {isOffline ? 'offline' : 'online'}
                                </span>
                            </div>
                            <div className="text-[11px] font-mono text-[#746e66] break-all">{ipOrHost}</div>
                        </div>
                        <button
                            onClick={() => onDelete(server.id)}
                            className="muted-button p-2 text-[#746d64] hover:text-[#3d3732]"
                            title="Delete Node"
                        >
                            <Icons.Trash2 className="w-4 h-4" />
                        </button>
                    </div>

                    <div className="grid grid-cols-2 xl:grid-cols-4 gap-2.5 mt-4">
                        <ServerMetricTile
                            label="CPU"
                            value={safeNumber(data.cpu_usage) !== null ? `${Number(data.cpu_usage).toFixed(1)}%` : '-'}
                            sub={safeNumber(data.cpu_cores) !== null ? `${Number(data.cpu_cores).toFixed(0)} Cores` : '-'}
                            icon={Icons.Cpu}
                        />
                        <ServerMetricTile
                            label="RAM"
                            value={safeNumber(data.ram_percent) !== null ? `${Number(data.ram_percent).toFixed(1)}%` : '-'}
                            sub={safeNumber(data.ram_used) !== null ? `${Number(data.ram_used).toFixed(1)} GB Used` : '-'}
                            icon={Icons.HardDrive}
                        />
                        <ServerMetricTile
                            label="NET"
                            value={`${formatSpeed(metrics.downSpeed)}`}
                            sub={`↑ ${formatSpeed(metrics.upSpeed)}`}
                            icon={Icons.Activity}
                        />
                        <ServerMetricTile
                            label="PWR"
                            value={isOffline ? '-' : `${totalPower.toFixed(0)}W`}
                            sub={`${gpus.length} GPU`}
                            icon={Icons.Zap}
                        />
                    </div>

                    <div className="mt-4">
                        {isOffline ? (
                            <div className="soft-panel-subtle p-4 text-sm text-[#736c63]">
                                Node currently unreachable. Existing config is kept and will reconnect automatically once available.
                            </div>
                        ) : gpus.length === 0 ? (
                            <div className="soft-panel-subtle p-4 text-sm text-[#736c63]">No GPU data reported by this node.</div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {gpus.map((gpu, idx) => (
                                    <GpuMiniCard key={idx} gpu={gpu} index={idx} />
                                ))}
                            </div>
                        )}
                    </div>
                </article>
            );
        };

        const ActivityDrawer = ({ isOpen, onClose, processes }) => {
            const users = useMemo(() => {
                const map = {};
                processes.forEach((proc) => {
                    const name = proc.user || proc.username || 'Unknown';
                    if (!map[name]) map[name] = { name, processes: [], totalVram: 0, gpuCount: 0 };
                    map[name].processes.push(proc);
                    map[name].totalVram += (safeNumber(proc.vram_used_mb) || 0);
                    if (proc.gpu_index !== null && (safeNumber(proc.vram_used_mb) || 0) > 0) map[name].gpuCount += 1;
                });
                const thresholdMb = 0.1 * 1024;
                return Object.values(map)
                    .filter((u) => u.totalVram >= thresholdMb)
                    .sort((a, b) => b.totalVram - a.totalVram);
            }, [processes]);

            const [expandedUser, setExpandedUser] = useState(null);
            if (!isOpen) return null;

            return (
                <>
                    <div className="fixed inset-0 z-50 bg-[#2f2922]/18 backdrop-blur-[2px] fade-enter" onClick={onClose} />
                    <aside className="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-[#f7f4ef] border-l border-[rgba(60,47,35,0.1)] shadow-[0_18px_50px_rgba(30,26,22,0.16)] drawer-enter flex flex-col">
                        <div className="px-5 py-4 border-b border-[rgba(60,47,35,0.08)] flex items-center justify-between">
                            <div>
                                <div className="section-eyebrow mb-1">GPU Users</div>
                                <h3 className="text-lg font-semibold text-[#1d1a18]">Live Occupancy</h3>
                            </div>
                            <button onClick={onClose} className="muted-button p-2 text-[#6f685f]" title="Close">
                                <Icons.X className="w-4 h-4" />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar px-4 py-4">
                            {users.length === 0 ? (
                                <div className="soft-panel-subtle p-6 text-center text-[#6f685f] text-sm">No active GPU users right now.</div>
                            ) : (
                                <div className="space-y-3">
                                    <div className="text-[11px] text-[#7a736a]">Only users with VRAM usage ≥ 0.1 GB are listed.</div>
                                    {users.map((user, idx) => {
                                        const isExpanded = expandedUser === user.name;
                                        return (
                                            <div key={user.name} className="soft-panel-subtle overflow-hidden">
                                                <button
                                                    className="w-full text-left px-3.5 py-3 flex items-center gap-3"
                                                    onClick={() => setExpandedUser(isExpanded ? null : user.name)}
                                                >
                                                    <div className={cx('w-9 h-9 rounded-full text-sm font-semibold flex items-center justify-center', toneFromName(user.name))}>
                                                        {String(user.name || 'U').slice(0, 1).toUpperCase()}
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center justify-between gap-2">
                                                            <div className="truncate text-sm font-semibold text-[#2a2724]">{user.name}</div>
                                                            <div className="text-[10px] font-mono text-[#746d64]">#{idx + 1}</div>
                                                        </div>
                                                        <div className="mt-1 flex items-center gap-2 text-[10px] text-[#756e66]">
                                                            <span className="px-1.5 py-0.5 rounded-full border border-[#d8cfc4] bg-[#efe7dc]">{(user.totalVram / 1024).toFixed(1)} GB</span>
                                                            <span className="px-1.5 py-0.5 rounded-full border border-[#d8cfc4] bg-[#ece7df]">{user.gpuCount} GPU</span>
                                                        </div>
                                                    </div>
                                                    <Icons.ChevronDown className={cx('w-4 h-4 text-[#80786f] transition-transform', isExpanded ? 'rotate-180' : '')} />
                                                </button>

                                                {isExpanded ? (
                                                    <div className="px-3 pb-3 space-y-2.5 border-t border-[rgba(60,47,35,0.06)]">
                                                        {user.processes.map((proc, i) => (
                                                            <div key={i} className="mt-3 soft-panel-subtle p-3">
                                                                <div className="grid grid-cols-2 gap-2 text-[11px]">
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">Server</div>
                                                                        <div className="font-semibold text-[#2c2926]">{proc.serverName || '-'}</div>
                                                                    </div>
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">GPU Index</div>
                                                                        <div className="font-mono text-[#2c2926]">{proc.gpu_index !== null && proc.gpu_index !== undefined ? proc.gpu_index : '-'}</div>
                                                                    </div>
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">PID</div>
                                                                        <div className="font-mono text-[#2c2926]">{proc.pid || '-'}</div>
                                                                    </div>
                                                                    <div>
                                                                        <div className="text-[#867e74] uppercase tracking-[0.08em] mb-1">VRAM</div>
                                                                        <div className="font-mono text-[#2c2926]">{safeNumber(proc.vram_used_mb) !== null ? `${(Number(proc.vram_used_mb) / 1024).toFixed(2)} GB` : '-'}</div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : null}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </aside>
                </>
            );
        };

        const App = () => {
            const [servers, setServers] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isActivityOpen, setIsActivityOpen] = useState(false);
            const [modalData, setModalData] = useState({ name: "", url: "http://", pin: "", token: "" });
            const historyRef = useRef({});
            const latestServersRef = useRef([]);
            const activeFetchIdRef = useRef(0);
            const [lastSyncedAt, setLastSyncedAt] = useState(null);
            const [gatewayToken, setGatewayToken] = useState(() => localStorage.getItem(GATEWAY_TOKEN_STORAGE_KEY) || '');

            const saveGatewayToken = (rawToken) => {
                const token = normalizeToken(rawToken);
                setGatewayToken(token);
                if (token) localStorage.setItem(GATEWAY_TOKEN_STORAGE_KEY, token);
                else localStorage.removeItem(GATEWAY_TOKEN_STORAGE_KEY);
                return token;
            };

            const promptGatewayToken = (message = 'Gateway Bearer Token') => {
                const input = prompt(message, gatewayToken || '');
                if (input === null) return null;
                return saveGatewayToken(input);
            };

            const fetchWithGatewayAuth = async (url, options = {}, allowPrompt = true) => {
                const runRequest = (token) => {
                    const baseHeaders = options.headers || {};
                    const headers = { ...baseHeaders, ...buildBearerHeader(token) };
                    return fetch(url, { ...options, headers });
                };

                let res = await runRequest(gatewayToken);
                if (allowPrompt && res.status === 401) {
                    const refreshedToken = promptGatewayToken('Gateway token required. Please enter Bearer token:');
                    if (refreshedToken !== null) {
                        res = await runRequest(refreshedToken);
                    }
                }
                return res;
            };

            useEffect(() => {
                const loadConfig = async () => {
                    try {
                        const res = await fetchWithGatewayAuth('/api/config');
                        if (res.ok) {
                            const data = await res.json();
                            setServers(data.map((s) => ({ ...s, token: normalizeToken(s.token || ''), status: 'pending', data: null, metrics: null })));
                        } else {
                            throw new Error();
                        }
                    } catch {
                        const saved = localStorage.getItem('nexus_servers_fallback');
                        if (saved) {
                            setServers(JSON.parse(saved).map((s) => ({ ...s, token: normalizeToken(s.token || ''), status: 'pending', data: null, metrics: null })));
                        }
                    }
                };
                loadConfig();
            }, []);

            useEffect(() => {
                latestServersRef.current = servers;
            }, [servers]);

            const saveConfig = async (newServersList, pin) => {
                const configToSave = newServersList.map((s) => ({ id: s.id, name: s.name, url: s.url, token: normalizeToken(s.token) }));
                try {
                    const res = await fetchWithGatewayAuth('/api/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-PIN': pin || '' },
                        body: JSON.stringify(configToSave),
                    });
                    if (res.ok) return { ok: true };
                    if (res.status === 401) return { ok: false, reason: 'unauthorized' };
                    if (res.status === 403) return { ok: false, reason: 'invalid_pin' };
                    return { ok: false, reason: 'server_error' };
                } catch {
                    if (validatePin(pin)) {
                        localStorage.setItem('nexus_servers_fallback', JSON.stringify(configToSave));
                        return { ok: true };
                    }
                    return { ok: false, reason: 'network_error' };
                }
            };

            const showSaveConfigError = (reason) => {
                if (reason === 'unauthorized') {
                    alert('Gateway authentication failed. Please check your Bearer token.');
                    return;
                }
                if (reason === 'invalid_pin') {
                    alert('Security PIN is incorrect.');
                    return;
                }
                alert('Failed to save node configuration. Please try again.');
            };

            useEffect(() => {
                let disposed = false;
                const inFlightControllers = new Set();
                const inFlightTimeouts = new Set();
                const effectGeneration = ++activeFetchIdRef.current;
                let nextRequestId = 0;
                let latestAppliedRequestId = 0;

                const fetchAll = async () => {
                    const requestId = ++nextRequestId;
                    const snapshot = latestServersRef.current;
                    if (snapshot.length === 0) return;

                    const promises = snapshot.map(async (server) => {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 3000);
                        inFlightControllers.add(controller);
                        inFlightTimeouts.add(timeoutId);

                        try {
                            const targetUrl = `${server.url}/metrics`;
                            const proxyUrl = `/api/proxy?url=${encodeURIComponent(targetUrl)}`;
                            const targetToken = normalizeToken(server.token || '');
                            let res;
                            try {
                                res = await fetchWithGatewayAuth(proxyUrl, {
                                    signal: controller.signal,
                                    headers: { ...buildTargetAuthorizationHeader(targetToken) },
                                }, false);
                                if (res.status !== 200) throw new Error();
                            } catch {
                                res = await fetch(targetUrl, {
                                    signal: controller.signal,
                                    headers: { ...buildBearerHeader(targetToken) },
                                });
                            }
                            if (!res.ok) throw new Error();

                            const jsonData = await res.json();
                            const currentTime = Date.now();
                            const history = historyRef.current[server.url];
                            let upSpeed = 0;
                            let downSpeed = 0;
                            if (history) {
                                const timeDiffSec = (currentTime - history.timestamp) / 1000;
                                if (timeDiffSec > 0) {
                                    upSpeed = Math.max(0, jsonData.net_sent_mb - history.sent) / timeDiffSec;
                                    downSpeed = Math.max(0, jsonData.net_recv_mb - history.recv) / timeDiffSec;
                                }
                            }
                            historyRef.current[server.url] = { timestamp: currentTime, sent: jsonData.net_sent_mb, recv: jsonData.net_recv_mb };
                            return { id: server.id, status: 'online', data: jsonData, metrics: { upSpeed, downSpeed } };
                        } catch {
                            return { id: server.id, status: 'offline' };
                        } finally {
                            clearTimeout(timeoutId);
                            inFlightTimeouts.delete(timeoutId);
                            inFlightControllers.delete(controller);
                        }
                    });

                    const results = await Promise.all(promises);
                    if (disposed || effectGeneration !== activeFetchIdRef.current) return;
                    if (requestId < latestAppliedRequestId) return;
                    latestAppliedRequestId = requestId;

                    setServers((prevServers) => {
                        const resultMap = new Map(results.map((item) => [item.id, item]));
                        return prevServers.map((server) => {
                            const next = resultMap.get(server.id);
                            if (!next) return server;
                            if (next.status === 'offline') return { ...server, status: 'offline' };
                            return { ...server, status: 'online', data: next.data, metrics: next.metrics };
                        });
                    });
                    setLastSyncedAt(new Date());
                };

                fetchAll();
                const interval = setInterval(fetchAll, 2000);

                return () => {
                    disposed = true;
                    if (activeFetchIdRef.current === effectGeneration) {
                        activeFetchIdRef.current += 1;
                    }
                    clearInterval(interval);
                    inFlightTimeouts.forEach((timeoutId) => clearTimeout(timeoutId));
                    inFlightControllers.forEach((controller) => controller.abort());
                };
            }, [gatewayToken]);

            const addServer = async () => {
                const newServer = {
                    id: Date.now(),
                    name: modalData.name,
                    url: modalData.url,
                    token: normalizeToken(modalData.token),
                    status: 'pending'
                };
                const newList = [...servers, newServer];
                const saveResult = await saveConfig(newList, modalData.pin);
                if (!saveResult.ok) {
                    showSaveConfigError(saveResult.reason);
                    return;
                }
                setServers(newList);
                setIsModalOpen(false);
                setModalData({ name: "", url: "http://", pin: "", token: "" });
            };

            const deleteServer = async (id) => {
                if (!confirm('Delete node?')) return;
                const pin = prompt('Admin PIN (MMDD)');
                if (!pin) return;
                const newList = servers.filter((x) => x.id !== id);
                const saveResult = await saveConfig(newList, pin);
                if (!saveResult.ok) {
                    showSaveConfigError(saveResult.reason);
                    return;
                }
                const removedServer = servers.find((x) => x.id === id);
                if (removedServer) delete historyRef.current[removedServer.url];
                setServers(newList);
            };

            const onlineServers = servers.filter((s) => s.status === 'online');
            const activeCount = onlineServers.length;
            const totalServers = servers.length;
            const totalGpus = onlineServers.reduce((acc, s) => acc + (Array.isArray(s.data?.gpus) ? s.data.gpus.length : 0), 0);

            const allProcesses = onlineServers
                .filter((s) => Array.isArray(s.data?.processes))
                .flatMap((s) => s.data.processes.map((p) => ({ ...p, serverName: s.name })))
                .filter((p) => !['root', 'gdm'].includes(String(p.user || '').toLowerCase()));

            const activeUsersCount = useMemo(() => {
                const totals = {};
                allProcesses.forEach((p) => {
                    const name = p.user || p.username || 'Unknown';
                    if (!totals[name]) totals[name] = 0;
                    totals[name] += (safeNumber(p.vram_used_mb) || 0);
                });
                const thresholdMb = 0.1 * 1024;
                return Object.values(totals).filter((total) => total >= thresholdMb).length;
            }, [allProcesses]);

            const topUsers = useMemo(() => {
                const map = {};
                allProcesses.forEach((proc) => {
                    const name = proc.user || proc.username || 'Unknown';
                    if (!map[name]) map[name] = { name, vramMb: 0, procCount: 0 };
                    map[name].vramMb += (safeNumber(proc.vram_used_mb) || 0);
                    map[name].procCount += 1;
                });
                return Object.values(map)
                    .filter((item) => item.vramMb >= 0.1 * 1024)
                    .sort((a, b) => b.vramMb - a.vramMb)
                    .slice(0, 6);
            }, [allProcesses]);

            const cpuValues = onlineServers.map((s) => safeNumber(s.data?.cpu_usage)).filter((v) => v !== null);
            const ramValues = onlineServers.map((s) => safeNumber(s.data?.ram_percent)).filter((v) => v !== null);
            const totalCpuAvg = cpuValues.length ? cpuValues.reduce((sum, v) => sum + v, 0) / cpuValues.length : null;
            const totalRamAvg = ramValues.length ? ramValues.reduce((sum, v) => sum + v, 0) / ramValues.length : null;

            const allGpuData = onlineServers.flatMap((s) => (Array.isArray(s.data?.gpus) ? s.data.gpus : []));
            const powerValues = allGpuData.map((gpu) => safeNumber(gpu.power_draw)).filter((v) => v !== null);
            const totalPower = powerValues.length ? powerValues.reduce((sum, v) => sum + v, 0) : null;

            const vramUsedValues = allGpuData.map((gpu) => safeNumber(gpu.memory_used)).filter((v) => v !== null);
            const vramTotalValues = allGpuData.map((gpu) => safeNumber(gpu.memory_total)).filter((v) => v !== null);
            const totalVramUsed = vramUsedValues.length ? vramUsedValues.reduce((sum, v) => sum + v, 0) : null;
            const totalVram = vramTotalValues.length ? vramTotalValues.reduce((sum, v) => sum + v, 0) : null;

            const totalDown = onlineServers.reduce((sum, s) => sum + (safeNumber(s.metrics?.downSpeed) || 0), 0);
            const totalUp = onlineServers.reduce((sum, s) => sum + (safeNumber(s.metrics?.upSpeed) || 0), 0);

            const highestCpuNode = onlineServers
                .map((s) => ({ name: s.name, cpu: safeNumber(s.data?.cpu_usage) }))
                .filter((item) => item.cpu !== null)
                .sort((a, b) => b.cpu - a.cpu)[0] || null;

            const highestPowerNode = onlineServers
                .map((s) => {
                    const pwr = (Array.isArray(s.data?.gpus) ? s.data.gpus : []).reduce((sum, gpu) => sum + (safeNumber(gpu.power_draw) || 0), 0);
                    return { name: s.name, power: pwr };
                })
                .sort((a, b) => b.power - a.power)[0] || null;

            const onlineRatio = totalServers > 0 ? (activeCount / totalServers) * 100 : 0;
            const fleetState = totalServers === 0 ? 'Idle' : activeCount === totalServers ? 'Healthy' : activeCount === 0 ? 'Idle' : 'Partial';

            const snapshotEvents = [
                {
                    label: 'Snapshot Updated',
                    value: lastSyncedAt ? formatTime(lastSyncedAt) : '-',
                    detail: 'Pulled from live polling window'
                },
                {
                    label: 'Node Reachability',
                    value: `${activeCount} / ${totalServers || 0} online`,
                    detail: totalServers ? `${Math.round(onlineRatio)}% reachable` : 'Waiting for configured nodes'
                },
                {
                    label: 'GPU Occupancy',
                    value: `${activeUsersCount} active users`,
                    detail: 'Derived from current process snapshot'
                },
                {
                    label: 'Peak CPU Node',
                    value: highestCpuNode ? `${highestCpuNode.name}` : '-',
                    detail: highestCpuNode ? `${highestCpuNode.cpu.toFixed(1)}% CPU` : 'No online metrics available'
                },
                {
                    label: 'Power Focus',
                    value: highestPowerNode && highestPowerNode.power > 0 ? highestPowerNode.name : '-',
                    detail: highestPowerNode && highestPowerNode.power > 0 ? `${highestPowerNode.power.toFixed(0)}W` : 'No power telemetry reported'
                }
            ];

            return (
                <div className="min-h-screen pb-14">
                    <div className="max-w-[1400px] mx-auto px-4 sm:px-6 py-6 md:py-8">
                        <header className="soft-panel p-4 md:p-5 mb-6">
                            <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                                <div className="flex items-start gap-3">
                                    <div className="w-11 h-11 rounded-2xl border border-[rgba(60,47,35,0.1)] bg-[#f2ede4] flex items-center justify-center text-[#3f3a34]">
                                        <Icons.LayoutDashboard className="w-5 h-5" />
                                    </div>
                                    <div>
                                        <div className="section-eyebrow mb-1">Nexus Monitor</div>
                                        <h1 className="text-xl md:text-2xl font-semibold tracking-tight text-[#1a1917]">Cluster Operations Dashboard</h1>
                                        <p className="text-sm text-[#6b665e] mt-1">Quiet, real-time infrastructure visibility for distributed GPU nodes.</p>
                                    </div>
                                </div>
                                <div className="flex flex-wrap items-center gap-2">
                                    <button
                                        onClick={() => setIsActivityOpen(true)}
                                        className="muted-button px-4 py-2 text-sm font-medium inline-flex items-center gap-2"
                                        title="Only includes users with VRAM usage >= 0.1 GB"
                                    >
                                        <Icons.Users className="w-4 h-4" />
                                        GPU Users
                                        {activeUsersCount > 0 ? (
                                            <span className="px-2 py-0.5 rounded-full bg-[#dcebe8] text-[#2d5a54] text-[11px] font-semibold">{activeUsersCount}</span>
                                        ) : null}
                                    </button>

                                    <button
                                        onClick={() => promptGatewayToken('Set Gateway Bearer Token (leave empty to clear):')}
                                        className={cx('muted-button px-4 py-2 text-sm font-medium', gatewayToken ? 'bg-[#deebe7] text-[#2d5a54] border-[#c8ddd8]' : '')}
                                        title="Configure Authorization Bearer token used by gateway"
                                    >
                                        {gatewayToken ? 'Gateway Token: Active' : 'Gateway Token'}
                                    </button>

                                    <button onClick={() => setIsModalOpen(true)} className="primary-button px-4 py-2 text-sm font-medium inline-flex items-center gap-2">
                                        <Icons.Plus className="w-4 h-4" /> Add Node
                                    </button>

                                    <a
                                        href="https://github.com/J4ck1e2000/Lab-Tutorial"
                                        target="_blank"
                                        className="muted-button px-3 py-2 text-sm inline-flex items-center gap-2 opacity-80 hover:opacity-100"
                                        rel="noreferrer"
                                        title="Project Repository"
                                    >
                                        <Icons.Github className="w-4 h-4" />
                                    </a>
                                </div>
                            </div>
                        </header>

                        <section className="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-6">
                            <div className="soft-panel p-6 md:p-8 xl:col-span-8">
                                <div className="section-eyebrow mb-2">Fleet Overview</div>
                                <h2 className="text-2xl md:text-3xl font-semibold tracking-tight text-[#1a1917]">Unified Node Health & Runtime Snapshot</h2>
                                <p className="text-sm md:text-base text-[#6b665e] mt-3 max-w-3xl">
                                    Monitoring surfaces are fully connected to live gateway polling and node metrics streams. Visuals are editorial, while data and control paths remain untouched.
                                </p>
                                <div className="mt-5 flex flex-wrap gap-2">
                                    <SummaryPill label="Nodes" value={`${totalServers || 0} total`} tone="neutral" />
                                    <SummaryPill label="Refresh" value="2s polling" tone="default" />
                                    <SummaryPill label="Synced" value={lastSyncedAt ? formatTime(lastSyncedAt) : '-'} tone="default" />
                                    <SummaryPill label="Gateway" value={gatewayToken ? 'Authenticated' : 'Not set'} tone={gatewayToken ? 'positive' : 'warning'} />
                                    <SummaryPill label="Active Users" value={`${activeUsersCount}`} tone="default" />
                                </div>
                            </div>

                            <div className="soft-panel p-6 xl:col-span-4">
                                <div className="section-eyebrow mb-2">Cluster Summary</div>
                                <div className="text-xl font-semibold text-[#1f1d1b]">Overall Fleet Health</div>
                                <div className="mt-4">
                                    <div className="flex items-end justify-between mb-2">
                                        <div className="text-3xl font-semibold leading-none text-[#1b1917]">{Math.round(onlineRatio)}%</div>
                                        <div className="text-xs text-[#6b665e]">{activeCount} / {totalServers || 0} online</div>
                                    </div>
                                    <MiniProgress value={onlineRatio} tone="teal" />
                                </div>

                                <div className="grid grid-cols-2 gap-2.5 mt-5">
                                    <MetricTile label="Status" value={fleetState} sub="Computed from online reachability" icon={Icons.Server} />
                                    <MetricTile label="GPUs" value={`${totalGpus}`} sub="Detected from online nodes" icon={Icons.Zap} />
                                </div>
                            </div>
                        </section>

                        <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
                            <div className="xl:col-span-12">
                                <SectionCard
                                    eyebrow="Node Summary"
                                    title="Server Cards"
                                    subtitle="Per-node resource status, connectivity, and live GPU telemetry."
                                >
                                    {servers.length === 0 ? (
                                        <div className="soft-panel-subtle p-10 text-center">
                                            <div className="text-base font-semibold text-[#2d2a27] mb-2">No configured nodes yet</div>
                                            <div className="text-sm text-[#6e675f] mb-5">Add your first agent node to begin monitoring.</div>
                                            <button onClick={() => setIsModalOpen(true)} className="primary-button px-5 py-2 text-sm font-medium inline-flex items-center gap-2">
                                                <Icons.Plus className="w-4 h-4" /> Connect Node
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-4">
                                            {servers.map((s) => (
                                                <ServerCard key={s.id} server={s} onDelete={deleteServer} />
                                            ))}
                                        </div>
                                    )}
                                </SectionCard>
                            </div>

                            <div className="xl:col-span-4">
                                <SectionCard
                                    eyebrow="Runtime Metadata"
                                    title="Cluster Metrics"
                                    subtitle="Aggregated from online nodes and reported telemetry fields."
                                >
                                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-1 gap-3">
                                        <MetricTile label="Online Servers" value={`${activeCount} / ${totalServers || 0}`} sub="Live reachability" icon={Icons.Server} />
                                        <MetricTile label="Total GPU" value={`${totalGpus}`} sub="Across reachable nodes" icon={Icons.Zap} />
                                        <MetricTile label="Total Power" value={totalPower !== null ? `${totalPower.toFixed(0)} W` : '-'} sub="Summed GPU draw" icon={Icons.Activity} />
                                        <MetricTile label="Avg CPU" value={totalCpuAvg !== null ? `${totalCpuAvg.toFixed(1)}%` : '-'} sub="Online nodes only" icon={Icons.Cpu} />
                                        <MetricTile label="Avg RAM" value={totalRamAvg !== null ? `${totalRamAvg.toFixed(1)}%` : '-'} sub="Online nodes only" icon={Icons.HardDrive} />
                                        <MetricTile
                                            label="VRAM"
                                            value={totalVramUsed !== null && totalVram !== null ? `${totalVramUsed.toFixed(1)} / ${totalVram.toFixed(1)} GB` : '-'}
                                            sub="Used / Total"
                                            icon={Icons.HardDrive}
                                        />
                                    </div>
                                </SectionCard>
                            </div>

                            <div className="xl:col-span-4">
                                <SectionCard
                                    eyebrow="Latest Log"
                                    title="Live Activity / Cluster Events"
                                    subtitle="Snapshot-driven status feed from current polling cycle."
                                    right={
                                        <div className="text-xs text-[#6f685f] inline-flex items-center gap-1">
                                            <Icons.Clock className="w-3.5 h-3.5" /> {lastSyncedAt ? formatTime(lastSyncedAt) : '-'}
                                        </div>
                                    }
                                >
                                    <div className="space-y-2.5">
                                        {snapshotEvents.map((event, idx) => (
                                            <div key={idx} className="soft-panel-subtle p-3.5">
                                                <div className="flex items-start justify-between gap-3">
                                                    <div>
                                                        <div className="text-[11px] uppercase tracking-[0.1em] text-[#867f76] font-semibold">{event.label}</div>
                                                        <div className="text-sm font-semibold text-[#2b2926] mt-1">{event.value}</div>
                                                    </div>
                                                    <div className="text-[10px] text-[#7a7269]">#{idx + 1}</div>
                                                </div>
                                                <div className="text-xs text-[#6f685f] mt-2">{event.detail}</div>
                                            </div>
                                        ))}
                                    </div>
                                </SectionCard>
                            </div>

                            <div className="xl:col-span-4">
                                <SectionCard
                                    eyebrow="Recent Completions"
                                    title="Active GPU Users"
                                    subtitle="Current occupancy ranking based on observed VRAM usage."
                                >
                                    <div className="soft-panel-subtle p-3 mb-3">
                                        <div className="flex items-center justify-between text-sm">
                                            <span className="text-[#6f685f]">Total Active Users</span>
                                            <span className="font-semibold text-[#2b2926]">{activeUsersCount}</span>
                                        </div>
                                        <div className="flex items-center justify-between text-sm mt-2">
                                            <span className="text-[#6f685f]">Network Throughput</span>
                                            <span className="font-mono text-[#2b2926]">↓ {formatSpeed(totalDown)} / ↑ {formatSpeed(totalUp)}</span>
                                        </div>
                                    </div>

                                    {topUsers.length === 0 ? (
                                        <div className="soft-panel-subtle p-4 text-sm text-[#6f685f]">No active GPU users in the latest snapshot.</div>
                                    ) : (
                                        <div className="space-y-2.5">
                                            {topUsers.map((user, idx) => (
                                                <div key={user.name} className="soft-panel-subtle p-3 flex items-center gap-3">
                                                    <div className={cx('w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold', toneFromName(user.name))}>
                                                        {String(user.name).slice(0, 1).toUpperCase()}
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center justify-between gap-2">
                                                            <div className="truncate text-sm font-semibold text-[#2b2926]">{user.name}</div>
                                                            <div className="text-[10px] font-mono text-[#7a7269]">#{idx + 1}</div>
                                                        </div>
                                                        <div className="text-xs text-[#6f685f] mt-0.5">
                                                            {(user.vramMb / 1024).toFixed(2)} GB VRAM · {user.procCount} process{user.procCount > 1 ? 'es' : ''}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </SectionCard>
                            </div>
                        </div>
                    </div>

                    <ActivityDrawer isOpen={isActivityOpen} onClose={() => setIsActivityOpen(false)} processes={allProcesses} />

                    {isModalOpen ? (
                        <div className="fixed inset-0 z-50 bg-[#2f2922]/22 backdrop-blur-[2px] p-4 flex items-center justify-center fade-enter">
                            <div className="soft-panel w-full max-w-lg p-6 md:p-7">
                                <div className="flex items-center justify-between mb-5">
                                    <div>
                                        <div className="section-eyebrow mb-1">Configuration</div>
                                        <h3 className="text-xl font-semibold text-[#1f1d1b]">Add Node</h3>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} className="muted-button p-2 text-[#6f685f]" title="Close">
                                        <Icons.X className="w-4 h-4" />
                                    </button>
                                </div>

                                <div className="space-y-3.5">
                                    <div>
                                        <label className="block text-[10px] uppercase tracking-[0.13em] font-semibold text-[#847c73] mb-1.5">Node Name</label>
                                        <input
                                            type="text"
                                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors"
                                            placeholder="e.g. research-4090"
                                            value={modalData.name}
                                            onChange={(e) => setModalData({ ...modalData, name: e.target.value })}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] uppercase tracking-[0.13em] font-semibold text-[#847c73] mb-1.5">Agent URL</label>
                                        <input
                                            type="text"
                                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors font-mono"
                                            placeholder="http://192.168.x.x:8005"
                                            value={modalData.url}
                                            onChange={(e) => setModalData({ ...modalData, url: e.target.value })}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] uppercase tracking-[0.13em] font-semibold text-[#847c73] mb-1.5">Agent Token (Optional)</label>
                                        <input
                                            type="text"
                                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors font-mono"
                                            placeholder="Bearer token for this agent"
                                            value={modalData.token}
                                            onChange={(e) => setModalData({ ...modalData, token: e.target.value })}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] uppercase tracking-[0.13em] font-semibold text-[#847c73] mb-1.5">Security PIN</label>
                                        <input
                                            type="text"
                                            inputMode="numeric"
                                            maxLength={4}
                                            className="w-full bg-[#fbf8f3] border border-[rgba(60,47,35,0.1)] rounded-2xl px-4 py-3 text-sm text-[#1f1d1b] outline-none focus:border-[rgba(60,47,35,0.22)] transition-colors font-mono tracking-[0.5em] text-center"
                                            placeholder="••••"
                                            value={modalData.pin}
                                            onChange={(e) => setModalData({ ...modalData, pin: e.target.value.replace(/\D/g, '') })}
                                        />
                                    </div>
                                </div>

                                <div className="mt-6 flex gap-2.5">
                                    <button onClick={() => setIsModalOpen(false)} className="muted-button flex-1 px-4 py-2.5 text-sm font-medium">Cancel</button>
                                    <button onClick={addServer} className="primary-button flex-1 px-4 py-2.5 text-sm font-medium">Connect Agent</button>
                                </div>
                            </div>
                        </div>
                    ) : null}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
